[package]
name = "gluesql-idb"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
gluesql = { version = "0.19", default-features = false }
gluesql-idb-storage = "0.19"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
serde_json = "1"
getrandom = { version = "0.2", features = ["js"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
