# RedPash-next workspace — three crates, one hard boundary:
#   data   = pure compute (NO io / http / sqlx / tokio::fs) -> compiles to wasm32
#   shared = wire DTOs only (serde structs both sides speak)
#   api    = the axum edge (http + postgres + the data crate, native only)
# The boundary is enforced mechanically: tools/purity-check.sh runs
# `cargo check --target wasm32-unknown-unknown -p data` in CI.
[workspace]
resolver = "2"
members = ["crates/api", "crates/data", "crates/shared"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
axum = { version = "0.7", features = ["macros", "multipart"] }
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace", "fs", "compression-br", "limit", "set-header"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls-ring", "postgres", "json", "chrono", "migrate", "macros"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
eyre = "0.6"
dotenvy = "0.15"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
dashmap = "6"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
thiserror = "2"
# Server polars carries defaults (fmt → DataFrame Debug). The wasm32 build
# overrides this with default-features = false (Cargo.toml in the data crate)
# to keep the fmt → comfy-table → crossterm terminal-IO chain off wasm.
polars = { version = "0.54", features = ["lazy", "csv", "strings", "dtype-full", "regex", "concat_str", "sql"] }
chardetng = "0.1"
encoding_rs = "0.8"
csv = "1.3"
rust_xlsxwriter = "0.95"

# polars-on-wasm fork (doumouya/polars-rp). polars 0.54 made polars-async
# (tokio multi-thread + net → mio) an unconditional dep of polars-core; the
# fork gates tokio off wasm and gives polars-async a bare current-thread
# runtime WITHOUT .enable_time() (which panics at build() on wasm). ~110
# lines across 11 files; rebase-able per polars bump. See runbook 0023 in
# the predecessor repo. Cascades to sub-crates through path-deps where a
# published-crate vendor would not.
[patch.crates-io]
polars = { git = "https://github.com/doumouya/polars-rp", rev = "0bb178d6ea1239ba009ca69a569ea66871b8a328" }
