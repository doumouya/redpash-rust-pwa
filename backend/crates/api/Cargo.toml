[package]
name = "api"
version = "0.1.0"
edition = "2021"
default-run = "redpash-api"

[[bin]]
name = "redpash-api"
path = "src/main.rs"

[[bin]]
name = "redpash-audit-ingest"
path = "src/bin/audit_ingest.rs"

[[bin]]
name = "redpash-rotate-secrets"
path = "src/bin/rotate_secrets.rs"

[dependencies]
shared = { path = "../shared" }
data = { path = "../data" }
axum = { workspace = true }
tokio = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
sqlx = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
eyre = { workspace = true }
dotenvy = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
dashmap = { workspace = true }
reqwest = { workspace = true }
polars = { workspace = true }
# Connector-secret encryption (privacy F-F): AES-256-GCM under REDPASH_MASTER_KEY.
aes-gcm = { version = "0.10", features = ["getrandom"] }
base64 = "0.22"
