# HTTP server. One route module per resource under src/routes/. The
# binary is `redpash-api`; it loads DATABASE_URL + a few other env vars
# at startup, binds to REDPASH_BIND, and serves both the API and (in
# dev) the frontend's static assets.

[package]
name        = "api"
version     = { workspace = true }
edition     = { workspace = true }
# `cargo run` from the workspace root has two binaries to choose
# between (redpash-api + redpash-audit-ingest, the audit-persistence
# CLI Gus added). Default to the server — the audit ingest is invoked
# by tools/audit.sh, never directly.
default-run = "redpash-api"

[[bin]]
name = "redpash-api"
path = "src/main.rs"

[[bin]]
name = "redpash-audit-ingest"
path = "src/bin/audit_ingest.rs"

[[bin]]
name = "redpash-audit-distincts"
path = "src/bin/audit_distincts.rs"

[dependencies]
shared = { path = "../shared" }
data   = { path = "../data" }

axum               = { workspace = true }
tokio              = { workspace = true }
tower              = { workspace = true }
tower-http         = { workspace = true }
bytes              = { workspace = true }
dashmap            = { workspace = true }

serde              = { workspace = true }
serde_json         = { workspace = true }
thiserror          = { workspace = true }
anyhow             = { workspace = true }
eyre               = { workspace = true }

sqlx               = { workspace = true }
chrono             = { workspace = true }
uuid               = { workspace = true }
polars             = { workspace = true }
encoding_rs        = { workspace = true }
pulldown-cmark     = { workspace = true }
apache-avro        = "0.21"   # avro meta-codec decode (codec_registry, Rust-central per js-rust-boundary)
rskafka            = { version = "0.6", features = ["transport-tls"] }  # pure-Rust Kafka consumer (Confluent SASL_SSL)
rustls             = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }  # TLS for SASL_SSL (mirror rskafka's rustls)
webpki-roots       = "1"      # CA roots for the Kafka TLS config
regex              = "1"       # `pattern` ValidateRule (CAS_C7AEBE83). Already in-tree (via polars);
                               # RE2-style linear-time matching = no ReDoS — the safe choice vs a hand-rolled backtracker.
base64             = "0.22"   # /api/demo/avro-decode: decode adversarial payloads

dotenvy            = { workspace = true }
tracing            = { workspace = true }
tracing-subscriber = { workspace = true }
reqwest            = { workspace = true }
