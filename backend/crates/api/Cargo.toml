# HTTP server. One route module per resource under src/routes/. The
# binary is `redpash-api`; it loads DATABASE_URL + a few other env vars
# at startup, binds to REDPASH_BIND, and serves both the API and (in
# dev) the frontend's static assets.

[package]
name        = "api"
version     = { workspace = true }
edition     = { workspace = true }
# `cargo run` from the workspace root has two binaries to choose
# between (redpash-api + redpash-audit-ingest, the audit-persistence
# CLI Gus added). Default to the server — the audit ingest is invoked
# by tools/audit.sh, never directly.
default-run = "redpash-api"

[[bin]]
name = "redpash-api"
path = "src/main.rs"

[[bin]]
name = "redpash-audit-ingest"
path = "src/bin/audit_ingest.rs"

[[bin]]
name = "redpash-audit-distincts"
path = "src/bin/audit_distincts.rs"

[dependencies]
shared = { path = "../shared" }
data   = { path = "../data" }

axum               = { workspace = true }
tokio              = { workspace = true }
tower              = { workspace = true }
tower-http         = { workspace = true }
bytes              = { workspace = true }
dashmap            = { workspace = true }

serde              = { workspace = true }
serde_json         = { workspace = true }
thiserror          = { workspace = true }
anyhow             = { workspace = true }

sqlx               = { workspace = true }
chrono             = { workspace = true }
uuid               = { workspace = true }
polars             = { workspace = true }
encoding_rs        = { workspace = true }
pulldown-cmark     = { workspace = true }

dotenvy            = { workspace = true }
tracing            = { workspace = true }
tracing-subscriber = { workspace = true }
reqwest            = { workspace = true }
