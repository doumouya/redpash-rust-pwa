[package]
name = "data"
version = "0.1.0"
edition = "2021"

# PURE COMPUTE. Nothing here does io/networking/threads/time — it compiles to
# wasm32-unknown-unknown unchanged ("one engine, two surfaces"). The crate-type
# yields both the server rlib (linked by api) and the browser .wasm cdylib.
# render/doc-rendering deliberately lives OUTSIDE this crate (day-one: keep the
# pure-compute story clean) — the predecessor's stub-plus-4-deps muddied it.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
shared = { path = "../shared" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
chardetng = { workspace = true }
encoding_rs = { workspace = true }
chrono = { workspace = true }
# csv is pure-compute when writing to a Vec<u8> (steps/structure unwrap_csv),
# so it rides on BOTH targets — the reference ships it to wasm the same way.
csv = { workspace = true }

# Server build: workspace polars (with `fmt` default — powers DataFrame Debug).
# rust_xlsxwriter (export.rs XLSX) is server-only — won't build on wasm.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
polars = { workspace = true }
rust_xlsxwriter = { workspace = true }

# WASM build: polars with default-features = false (no fmt → no
# comfy-table → no crossterm terminal IO), plus the wasm RNG wiring.
# getrandom needs RUSTFLAGS='--cfg getrandom_backend="wasm_js"' at build —
# set in tools/build-wasm.sh and tools/purity-check.sh.
[target.'cfg(target_arch = "wasm32")'.dependencies]
polars = { version = "0.54", default-features = false, features = ["lazy", "csv", "strings", "dtype-full", "regex", "concat_str", "sql"] }
getrandom = { version = "0.3", features = ["wasm_js"] }
wasm-bindgen = "0.2"
console_error_panic_hook = "0.1"
