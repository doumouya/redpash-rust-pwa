# DTOs shared between `api` and `data` — request / response shapes for
# every endpoint. Keep this crate dependency-light: serde + chrono + uuid
# only, so both sides compile fast.

[package]
name    = "shared"
version = { workspace = true }
edition = { workspace = true }

[dependencies]
serde      = { workspace = true }
serde_json = { workspace = true }
chrono     = { workspace = true }
uuid       = { workspace = true }
