<!-- Database console — a platform admin browses + runs READ-ONLY SQL against a
     connected Postgres through the connector, and pulls a table → CSV. One of the
     Admin app's pages (Slice B2). Platform-admin gated (ROUTES admin:true + the
     backend platform-admin gate on /connectors/:rid/query). mountRail fills
     #dbRail (thin rail + footer); pages/database.js renders the console into
     #dbSurface using the framework editor + redtable + the live /query endpoint. -->
<section class="rp-shell rp-shell--wide">
  <header id="rp-topbar"></header>

  <div class="rp-shell-body">
    <aside class="rp-rail" id="dbRail"></aside>
    <main class="rp-main">
      <div class="rp-surface" id="dbSurface">
        <p class="rp-shell-state">Loading…</p>
      </div>
    </main>
  </div>
</section>
