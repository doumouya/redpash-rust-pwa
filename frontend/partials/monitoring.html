<!-- Monitoring — the system telemetry surface. Uses the shared
     rail-page shell (shell.css: .rp-shell + .rp-shell-* atoms),
     same as /home. Page-specific styles (window chips, panels,
     top-routes table) live in monitoring.css. Phase 1 wires the
     Requests tab against /api/metrics; the other rail tabs render
     disabled until their backend list endpoints land (see
     docs/internal/admin-monitoring-surfaces.md §6). -->
<section class="rp-shell rp-shell--wide">
  <header id="rp-topbar"></header>

  <div class="rp-shell-body">

    <!-- ════ rail — static groups (REQUESTS + AUDITS) ════ -->
    <aside class="rp-rail" id="rpMonNav">
      <div class="rp-rail-head">
        <span class="rp-rail-title">Telemetry</span>
        <button class="rp-btn-icon" id="rpMonNavCollapse" type="button" title="Collapse">
          <i class="bi bi-chevron-double-left"></i>
        </button>
      </div>
      <!-- The Monitoring ↔ Admin Console rail-seg moved out: Admin Console is its
           own page now (the Admin app, Slice B). Monitoring is observability-only. -->
      <div class="rp-rail-body" id="rpMonNavBody"></div>
      <div class="rp-rail-footer"><!-- rail footer nav mounted by monitoring.js --></div>
    </aside>

    <!-- ════ main — body view per active tab ════
         Same `<main class="rp-main"><div class="rp-surface">` shell
         as Home — #rpMonView IS the rp-surface so the entire body
         (head / chips / composite / toolbar / body / pager) lives
         inside one chrome'd card. The rp-surface-body wrapper around
         the filter panel + table-wrap is the only structural
         difference from Home, present only because Monitoring has the
         slide-out filter panel that Home doesn't. -->
    <main class="rp-main">
      <div class="rp-surface" id="rpMonView">
        <p class="rp-shell-state">Loading…</p>
      </div>
    </main>

  </div>
</section>
