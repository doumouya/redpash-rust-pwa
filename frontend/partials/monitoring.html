<!-- Monitoring — the system telemetry surface. Uses the shared
     rail-page shell (shell.css: .rp-shell + .rp-shell-* atoms),
     same as /home. Page-specific styles (window chips, panels,
     top-routes table) live in monitoring.css. Phase 1 wires the
     Requests tab against /api/metrics; the other rail tabs render
     disabled until their backend list endpoints land (see
     docs/internal/admin-monitoring-surfaces.md §6). -->
<section class="rp-shell rp-shell--wide">
  <header id="rp-topbar"></header>

  <div class="rp-shell-body">

    <!-- ════ rail — static groups (REQUESTS + AUDITS) ════ -->
    <aside class="rt-nav" id="rpMonNav">
      <div class="rt-nav-head">
        <span class="rt-nav-title">Telemetry</span>
        <button class="rt-btn" id="rpMonNavCollapse" type="button" title="Collapse">
          <i class="bi bi-chevron-double-left"></i>
        </button>
      </div>
      <!-- View switcher (reuses the .rt-seg--rail atom, same as Workspace's
           Data ↔ Dashboard toggle). Flips the rail between SYSTEM
           observability groups and the Admin Console (org management).
           Persisted via `monitoring-railView`. The Admin Console button is
           platform-admin-only — hidden on .rt-nav without .rp-mon-admin
           (monitoring.js sets it once /api/me lands). CAS_274EDF3B. -->
      <div class="rt-seg rt-seg--rail rt-nav-views" id="rpMonRailView">
        <button type="button" class="is-active" data-rail-seg="monitoring"
                title="System observability — requests, audits, optimization, activity">
          <i class="bi bi-activity"></i> Monitoring
        </button>
        <button type="button" data-rail-seg="admin"
                title="Admin Console — org management & configuration">
          <i class="bi bi-sliders"></i> Admin Console
        </button>
      </div>
      <div class="rt-nav-body" id="rpMonNavBody"></div>
      <div class="rt-nav-foot"><!-- rail footer nav mounted by monitoring.js --></div>
    </aside>

    <!-- ════ main — body view per active tab ════
         Same `<main class="rp-main"><div class="rp-surface">` shell
         as Home — #rpMonView IS the rp-surface so the entire body
         (head / chips / composite / toolbar / body / pager) lives
         inside one chrome'd card. The rp-surface-body wrapper around
         the filter panel + table-wrap is the only structural
         difference from Home, present only because Monitoring has the
         slide-out filter panel that Home doesn't. -->
    <main class="rp-main">
      <div class="rp-surface" id="rpMonView">
        <p class="rp-shell-state">Loading…</p>
      </div>
    </main>

  </div>
</section>
