<!-- Monitoring — the system telemetry surface. Uses the shared
     rail-page shell (shell.css: .rp-shell + .rp-shell-* atoms),
     same as /home. Page-specific styles (window chips, panels,
     top-routes table) live in monitoring.css. Phase 1 wires the
     Requests tab against /api/metrics; the other rail tabs render
     disabled until their backend list endpoints land (see
     docs/internal/admin-monitoring-surfaces.md §6). -->
<section class="rp-shell">
  <header id="rp-topbar"></header>

  <header class="rp-shell-greeting">
    <h1 class="rp-shell-greeting-title">Monitoring</h1>
    <p class="rp-shell-greeting-sub">Requests, audits, and system telemetry.</p>
  </header>

  <div class="rp-shell-body">

    <!-- ════ rail — static groups (REQUESTS + AUDITS) ════ -->
    <aside class="rt-nav" id="rpMonNav">
      <div class="rt-nav-head">
        <span class="rt-nav-title">Telemetry</span>
        <button class="rt-btn" id="rpMonNavCollapse" type="button" title="Collapse">
          <i class="bi bi-chevron-double-left"></i>
        </button>
      </div>
      <div class="rt-nav-body" id="rpMonNavBody"></div>
    </aside>

    <!-- ════ main — body view per active tab ════ -->
    <main class="rp-shell-main" id="rpMonMain">
      <div class="rp-shell-view" id="rpMonView">
        <p class="rp-shell-state">Loading…</p>
      </div>
    </main>

  </div>
</section>
