<!-- Monitoring — the system telemetry surface. Same shell pattern
     as Home: topbar + rail (.rt-nav, static groups REQUESTS/AUDITS)
     + per-tab body. Phase 1 wires the Requests tab against
     /api/metrics; the other tabs render disabled in the rail until
     their backend list endpoints land (see
     docs/internal/admin-monitoring-surfaces.md §6). -->
<section class="rp-monitoring">
  <header id="rp-topbar"></header>

  <header class="rp-home__greeting">
    <h1 class="rp-home__greeting-title">Monitoring</h1>
    <p class="rp-home__greeting-sub">Requests, audits, and system telemetry.</p>
  </header>

  <div class="rp-home__body">

    <!-- ════ rail — static groups (REQUESTS + AUDITS) ════ -->
    <aside class="rt-nav" id="rpMonNav">
      <div class="rt-nav-head">
        <span class="rt-nav-title">Telemetry</span>
        <button class="rt-btn" id="rpMonNavCollapse" type="button" title="Collapse">
          <i class="bi bi-chevron-double-left"></i>
        </button>
      </div>
      <div class="rt-nav-body" id="rpMonNavBody"></div>
    </aside>

    <!-- ════ main — body view per active tab ════ -->
    <main class="rp-home__main" id="rpMonMain">
      <div class="rp-home__view" id="rpMonView">
        <p class="rp-home__state">Loading…</p>
      </div>
    </main>

  </div>
</section>
