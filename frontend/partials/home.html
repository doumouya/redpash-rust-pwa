<!-- Home — the org command center. Same shell pattern as Workspace:
     topbar above, then a rail (.rt-nav, static groups ORG/DATA) on
     the left and a per-tab body on the right. The body owns its own
     sub-controls (filter chips, sub-tabs) so we never end up with
     stacked horizontal tab rows. -->
<section class="rp-home">
  <header id="rp-topbar"></header>

  <header class="rp-home__greeting">
    <h1 class="rp-home__greeting-title" id="rp-home-greeting">Welcome.</h1>
    <p class="rp-home__greeting-sub">Pick up a project or scan a new CSV.</p>
  </header>

  <div class="rp-home__body">

    <!-- ════ rail — static groups (ORG + DATA) ════ -->
    <aside class="rt-nav" id="rpHomeNav">
      <div class="rt-nav-head">
        <span class="rt-nav-title">Browse</span>
        <button class="rt-btn" id="rpHomeNavCollapse" type="button" title="Collapse">
          <i class="bi bi-chevron-double-left"></i>
        </button>
      </div>
      <div class="rt-nav-body" id="rpHomeNavBody"></div>
    </aside>

    <!-- ════ main — body view, content depends on the active tab ════ -->
    <main class="rp-home__main" id="rpHomeMain">
      <div class="rp-home__view" id="rpHomeView">
        <p class="rp-home__state">Loading…</p>
      </div>
    </main>

  </div>
</section>
