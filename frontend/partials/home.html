<!-- Home — the org command center. Uses the shared rail-page shell
     (shell.css: outer flex column, rail+body split, per-tab head,
     KPI strip). Per-tab content (head / chips / KPIs / charts /
     toolbar / table) is the rendered context; no greeting block. -->
<section class="rp-shell rp-shell--wide">
  <header id="rp-topbar"></header>

  <div class="rp-shell-body">

    <!-- ════ rail — static groups (ORG + DATA) ════ -->
    <aside class="rt-nav" id="rpHomeNav">
      <div class="rt-nav-head">
        <span class="rt-nav-title">Browse</span>
        <button class="rt-btn" id="rpHomeNavCollapse" type="button" title="Collapse">
          <i class="bi bi-chevron-double-left"></i>
        </button>
      </div>
      <div class="rt-nav-body" id="rpHomeNavBody"></div>
      <!-- Rail-foot creation button — single dynamic action that repoints
           per active tab (label + icon + handler driven by the tab's
           createSpec in LIST_VIEWS). Matches the Workspace + Cases
           rail-foot pattern (one full-width .rt-btn--glass per action).
           Tabs without a createSpec hide the button. -->
      <div class="rt-nav-foot">
        <button class="rt-btn rt-btn--glass" id="rpHomeNavCreate" type="button" hidden>
          <i class="bi bi-plus-lg" id="rpHomeNavCreateIcon"></i><span id="rpHomeNavCreateLabel">New</span>
        </button>
      </div>
    </aside>

    <!-- ════ main — body view, content depends on the active tab ════
         Mirrors Workspace's `<main class="rt-main"><div class="rt-surface">`
         shell (workspace.html:42-43, workspace.css:.rt-surface) so the
         table surface lives inside the same canonical card chrome.
         #rpHomeView IS the rt-surface — home.js targets `#rpHomeView`
         and the flex/overflow/chrome all come from .rt-surface. -->
    <main class="rt-main">
      <div class="rt-surface" id="rpHomeView">
        <p class="rp-shell-state">Loading…</p>
      </div>
    </main>

  </div>

  <!-- ════ generic create-modal — repointed per tab via createSpec ════
       One form host (#rpHomeCreateModal) reused across tabs. activate()
       updates the title + fields + submit endpoint when the tab
       changes; openCreateModal/closeCreateModal toggle visibility.
       Fields render from spec.fields[] into #rpHomeCreateFields.
       Lives outside .rp-shell-body (matching cases.html's modal
       placement) so the overlay covers the full shell. -->
  <div class="rp-cases-modal" id="rpHomeCreateModal" hidden
       role="dialog" aria-modal="true" aria-labelledby="rpHomeCreateTitle">
    <div class="rp-cases-modal-backdrop" data-modal-dismiss="1"></div>
    <div class="rp-cases-modal-body">
      <header class="rp-cases-modal-head">
        <h2 class="rp-cases-modal-title" id="rpHomeCreateTitle">New</h2>
        <button class="rt-icon-btn rp-cases-modal-close" type="button"
                data-modal-dismiss="1" title="Close">
          <i class="bi bi-x-lg"></i>
        </button>
      </header>
      <form id="rpHomeCreateForm">
        <div class="rp-cases-modal-content" id="rpHomeCreateFields"></div>
        <p class="rp-cases-modal-hint rp-home-create-error" id="rpHomeCreateError" hidden></p>
        <footer class="rp-cases-modal-foot">
          <button class="rt-btn rt-btn--glass" type="button"
                  data-modal-dismiss="1">Cancel</button>
          <button class="rt-btn rt-btn--accent" type="submit" id="rpHomeCreateSubmit">
            <i class="bi bi-plus-lg"></i> Create
          </button>
        </footer>
      </form>
    </div>
  </div>
</section>
