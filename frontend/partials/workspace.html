<!-- Workspace — the redtable as a browser. The rail loads real projects
     and files; a file click fetches /api/files/:rid (columns) and
     /page (rows) and renders the table. The toolbar's controls
     operate on whatever's loaded. -->
<section class="rp-shell rp-shell--wide">
  <header id="rp-topbar"></header>

  <div class="rp-shell-body">

    <!-- ════ rail — the framework mountRail component fills this host ════
         (projects → their DATA files; title, collapse, search, ownership
         chips, the Overview pseudo-tab, hidden-recovery, and the New-project
         footer are all built by workspace.js's mountRail config — D0', the
         same component as dashboard/admin/sheetwise/database). Upload stays in
         the data toolbar (not the rail foot, per CAS_37B2E1BF/D2). -->
    <aside id="wsNav"></aside>

    <!-- ════ main — the redtable surface ════ -->
    <main class="rp-main">
      <div class="rp-surface" id="wsSurface">

        <!-- landing — the default surface when no file is open (bare
             #/workspace, no deep-link). Recent projects + a stats strip,
             the Workspace twin of the Cases board. The second surface mode
             alongside the data redtable: .is-landing-mode (workspace.css)
             hides the toolbar / body / pager and shows this. Content is
             rendered by workspace.js renderLanding(). -->
        <div class="ws-landing" id="wsLanding"></div>

        <!-- toolbar — the data redtable's controls (charting moved to the
             standalone #/dashboard page, Slice D). -->
        <div class="rp-toolbar rp-toolbar--data">
          <!-- Upload lives here (where files are worked) + on the landing (the
               empty state). Moved off the rail foot in the create-button
               consolidation (CAS_37B2E1BF). The hidden input is clicked
               programmatically from both the toolbar button and the landing CTA. -->
          <input type="file" id="wsUploadInput" accept=".csv,.tsv,.txt,.xlsx,.xls,.xlsm,.xlsb,.ods,text/csv" multiple hidden />
          <button class="rp-btn-icon rp-btn-icon--glass" id="wsUpload" type="button" title="Upload a data file into the active project">
            <i class="bi bi-upload"></i><span>Upload</span>
          </button>
          <span class="rp-toolbar-sep"></span>
          <button class="rp-btn-icon" id="wsFilterToggle" type="button" title="Filter panel">
            <i class="bi bi-funnel"></i>
          </button>
          <div class="rp-search">
            <i class="bi bi-search"></i>
            <input type="search" id="wsRowSearch" placeholder="Search the file…" title="Server-side full-file search. Use the filter panel for column-specific predicates." />
          </div>
          <span class="rp-toolbar-sep"></span>
          <button class="rp-btn-icon rp-toolbar-mode" data-mode="edit" type="button" title="Edit mode"><i class="bi bi-pencil"></i></button>
          <button class="rp-btn-icon rp-toolbar-mode" data-mode="select" type="button" title="Select mode"><i class="bi bi-check2-square"></i></button>
          <button class="rp-btn-icon rp-toolbar-mode" data-mode="delete" type="button" title="Delete mode"><i class="bi bi-trash3"></i></button>
          <span class="rp-toolbar-sep"></span>
          <button class="rp-btn-icon" id="wsUndo" type="button" disabled title="Undo last step"><i class="bi bi-arrow-return-left"></i></button>
          <button class="rp-btn-icon" id="wsRedo" type="button" disabled title="Redo next step"><i class="bi bi-arrow-return-right"></i></button>
          <button class="rp-btn-icon" id="wsRefresh" type="button" title="Refresh"><i class="bi bi-arrow-clockwise"></i></button>
          <button class="rp-btn-icon is-active" id="wsRownum" type="button" title="Row numbers"><i class="bi bi-list-ol"></i></button>
          <span class="rp-toolbar-sep"></span>
          <div class="rp-menu-wrap">
            <button class="rp-chip rp-toolbar-pill" data-dd="wsRowsDd" type="button" title="Rows per page">
              <span id="wsRowsLabel">25 rows</span>
              <i class="bi bi-chevron-down rp-toolbar-chev"></i>
            </button>
            <div class="rp-menu" id="wsRowsDd">
              <div class="rp-menu-item" data-rows="10">10 rows</div>
              <div class="rp-menu-item selected" data-rows="25">25 rows <i class="bi bi-check2 rp-menu-tick"></i></div>
              <div class="rp-menu-item" data-rows="50">50 rows</div>
              <div class="rp-menu-item" data-rows="100">100 rows</div>
              <div class="rp-menu-item" data-rows="250">250 rows</div>
              <div class="rp-menu-item" data-rows="500">500 rows</div>
              <div class="rp-menu-item" data-rows="1000">1k rows</div>
            </div>
          </div>
          <div class="rp-menu-wrap">
            <button class="rp-btn-icon" data-dd="wsColsDd" type="button" title="Columns"><i class="bi bi-layout-three-columns"></i></button>
            <div class="rp-menu" id="wsColsDd"><!-- dynamic — rebuilt when a file loads --></div>
          </div>
          <span class="rp-chip rp-toolbar-selchip" id="wsSelChip" title="Clear selection">
            <i class="bi bi-check2-square"></i><span id="wsSelCount">0</span>&nbsp;selected
          </span>
          <span class="rp-toolbar-sep"></span>
          <div class="rp-menu-wrap">
            <button class="rp-btn-icon" id="wsExport" data-dd="wsExportDd" type="button" disabled title="Export">
              <i class="bi bi-download"></i>
            </button>
            <div class="rp-menu" id="wsExportDd">
              <div class="rp-menu-item" data-fmt="csv">Export as CSV</div>
              <div class="rp-menu-item" data-fmt="xlsx">Export as Excel</div>
              <div class="rp-menu-item" data-fmt="json">Export as JSON</div>
            </div>
          </div>
          <button class="rp-btn-icon" id="wsHistoryToggle" type="button" title="Step history">
            <i class="bi bi-clock-history"></i>
          </button>
          <button class="rp-btn-icon" id="wsToolsToggle" type="button" title="Tools panel">
            <i class="bi bi-tools"></i>
          </button>
        </div>

        <!-- body — filter panel · table · tools panel -->
        <div class="rp-surface-body">

          <aside class="rp-panel rp-panel-filter" id="wsFilterPanel">
            <div class="rp-panel-inner">
              <div class="rp-panel-head">
                <div class="rp-panel-tabs rp-panel-tabs-pills" id="wsFilterTabs">
                  <button class="is-active" type="button" data-tab="filter" title="Filter source rows">
                    <i class="bi bi-funnel"></i> Filter
                  </button>
                  <button type="button" data-tab="report" title="Group + aggregate (report builder)">
                    <i class="bi bi-bar-chart-line"></i> Report
                  </button>
                </div>
                <button class="rp-btn-icon rp-panel-close" type="button"><i class="bi bi-x-lg"></i></button>
              </div>
              <div class="rp-panel-body">
                <div class="rp-panel-tab is-active" data-tab="filter">
                  <span class="rp-label">Condition groups</span>
                  <div id="wsGroupList"></div>
                  <button class="rp-btn-icon rp-btn-icon--glass rp-btn-icon--block" id="wsAddGroup" type="button">
                    <i class="bi bi-plus-lg"></i> Add group
                  </button>
                </div>
                <div class="rp-panel-tab" data-tab="report" id="wsReportBody" hidden>
                  <!-- report.js mounts the builder here -->
                </div>
              </div>
              <div class="rp-panel-foot">
                <div class="rp-panel-tab-foot is-active" data-tab="filter">
                  <button class="rp-btn-icon" id="wsClearFilter" type="button">Clear</button>
                  <button class="rp-btn-icon rp-btn-icon--accent" id="wsApplyFilter" type="button">
                    <i class="bi bi-funnel"></i> Apply filter
                  </button>
                </div>
                <div class="rp-panel-tab-foot" data-tab="report" hidden>
                  <button class="rp-btn-icon" id="wsClearReport" type="button">Clear</button>
                  <button class="rp-btn-icon rp-btn-icon--accent" id="wsApplyReport" type="button">
                    <i class="bi bi-play-fill"></i> Run preview
                  </button>
                </div>
              </div>
            </div>
          </aside>

          <div class="rp-table-wrap">
            <table class="rp-redtable rp-table" id="wsTable" hidden>
              <thead><!-- dynamic — rebuilt when a file loads --></thead>
              <tbody><!-- dynamic --></tbody>
            </table>
            <div class="rp-table-state" id="wsTableState">Open a file from the rail to see its data.</div>
          </div>

          <aside class="rp-panel rp-panel-history" id="wsHistoryPanel">
            <div class="rp-panel-inner">
              <div class="rp-panel-head">
                <span class="rp-panel-title"><i class="bi bi-clock-history"></i> History</span>
                <button class="rp-btn-icon rp-panel-close" type="button"><i class="bi bi-x-lg"></i></button>
              </div>
              <div class="rp-panel-body" id="wsHistoryBody">
                <p class="rp-empty rp-step-state">Open a file to see its step history.</p>
              </div>
            </div>
          </aside>

          <aside class="rp-panel rp-panel-tools" id="wsToolsPanel">
            <div class="rp-panel-inner">
              <div class="rp-panel-head">
                <div class="rp-panel-tabs rp-panel-tabs-pills" id="wsToolsTabs">
                  <button class="is-active" type="button" data-tab="clean" title="Clean + transform this file's columns">
                    <i class="bi bi-tools"></i> Clean
                  </button>
                  <button type="button" data-tab="joins" title="Join this file with another in the project">
                    <i class="bi bi-link-45deg"></i> Joins
                  </button>
                </div>
                <button class="rp-btn-icon rp-panel-close" type="button"><i class="bi bi-x-lg"></i></button>
              </div>
              <div class="rp-panel-body">
                <div class="rp-panel-tab is-active" data-tab="clean" id="wsToolsCleanBody"><!-- tools.js mounts the columns-redtable + cleaning toolbar here --></div>
                <div class="rp-panel-tab" data-tab="joins" id="wsToolsJoinsBody" hidden>
                  <p class="rp-empty rp-step-state">Join this file with another file in the same project.</p>
                </div>
              </div>
            </div>
          </aside>

        </div>

        <!-- pager — server-paged via /api/files/:rid/page?page=N&size=M -->
        <div class="rp-pager">
          <span class="rp-rows-info" id="wsRowsInfo">No file open.</span>
          <div class="rp-pages" id="wsPages"></div>
        </div>

      </div>
    </main>

  </div>
</section>
