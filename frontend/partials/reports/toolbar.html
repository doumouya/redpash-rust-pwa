<!-- Reports toolbar — search + filter + view controls + chart-add.
     The source-file selector is the file-tabs strip one row up; the
     report-level actions (export, etc.) live in the header. Reports are
     read-only against the source — no row-select / delete / edit modes.
     Filter funnel kept (reports can filter the source to chart a
     subset). -->
<div class="rp-rt-toolbar">

  <input class="rp-rt-search" type="search" placeholder="Filter rows in source…"
         data-reports-search />

  <button class="rp-btn" title="Filter"
          data-sp-panel-trigger="reports-filter-panel"
          onclick="spToggle('reports-filter-panel')">
    <i class="bi bi-funnel"></i>
  </button>

  <button class="rp-btn" title="Refresh source" onclick="spRefresh(this)">
    <i class="bi bi-arrow-clockwise"></i>
  </button>

  <div class="rp-dd-wrap">
    <button class="rp-rt-pill-btn" title="Rows per page" onclick="spDdToggle(this)">
      <span data-sp-rows-label>25</span><span class="rp-rt-pill-unit"> rows</span>
      <i class="bi bi-chevron-down"></i>
    </button>
    <div class="rp-dd-menu" role="menu">
      <div class="rp-dd-item"             onclick="spDdSelectRows(this, 10)">10 rows</div>
      <div class="rp-dd-item is-selected" onclick="spDdSelectRows(this, 25)">25 rows</div>
      <div class="rp-dd-item"             onclick="spDdSelectRows(this, 50)">50 rows</div>
      <div class="rp-dd-item"             onclick="spDdSelectRows(this, 100)">100 rows</div>
    </div>
  </div>

  <!-- Columns picker — checkbox per column from the source file. -->
  <div class="rp-dd-wrap">
    <button class="rp-btn" title="Columns" onclick="spDdToggle(this)">
      <i class="bi bi-layout-three-columns"></i>
    </button>
    <div class="rp-dd-menu" role="menu" style="min-width:8.5rem" data-reports-cols-picker>
      <button type="button" class="rp-dd-reset" title="Restore all columns"
              onclick="spColsReset(this)">
        <i class="bi bi-arrow-counterclockwise"></i> Reset
      </button>
      <div class="rp-form-meta" style="padding:0.5rem;font-style:italic">No columns.</div>
    </div>
  </div>

  <!-- + Chart — opens new-chart modal. Pinned to the right. -->
  <button class="rp-btn" type="button" aria-label="Add a chart" title="Add a chart"
          style="margin-left:auto"
          onclick="reportsNewChart()">
    <i class="bi bi-plus-lg"></i>
  </button>

</div>
