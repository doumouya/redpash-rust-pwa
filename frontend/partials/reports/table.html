<!-- Source-file table — the redtable engine paints rows + thead into
     [data-reports-table] from /api/files/:rid/page on every source-
     file change / search / page swap. Reports are READ-ONLY against
     the source — no row-mode (edit / select / delete) cells; the
     toolbar above doesn't ship mode buttons. Sandbox sample row kept
     for the visual port; live mountReportsSandbox replaces tbody. -->
<div class="rp-rt-table-wrap" data-reports-table>
  <table class="rp-rt-table">
    <thead>
      <tr>
        <th class="rp-rt-th-sortable" style="min-width:10rem">Column A <i class="bi bi-arrow-down-up rp-rt-sort-ico"></i></th>
        <th class="rp-rt-th-sortable">Column B <i class="bi bi-arrow-down-up rp-rt-sort-ico"></i></th>
        <th class="rp-rt-th-sortable">Column C <i class="bi bi-arrow-down-up rp-rt-sort-ico"></i></th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td colspan="3" style="text-align:center;color:var(--muted);padding:1rem;font-style:italic">
          Pick a source file from the toolbar to populate this table.
        </td>
      </tr>
    </tbody>
  </table>
</div>

<div class="rp-rt-paging">
  <div class="rp-rt-rows-info" data-reports-rows-info>—</div>
  <div class="rp-rt-pages" data-reports-pages></div>
</div>
