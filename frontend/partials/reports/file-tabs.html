<!-- Source-file tabs — sits BELOW the header. One .rp-rtp-tab per CSV
     dataset in the active project; the selected tab carries .active.
     This strip IS the source-file selector: clicking a tab loads that
     dataset into the table pane (reportSelectFile). Painted by
     _renderReportsFileTabs. Each non-active tab has a × that hides it;
     a trailing + reopens hidden ones — same model as the objects tabs. -->
<div class="rp-rtp-tabs">
  <div class="rp-rtp-tabs-inner" data-reports-file-tabs>
    <!-- File tabs injected here by _renderReportsFileTabs. -->
  </div>
</div>
