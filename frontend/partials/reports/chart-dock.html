<!-- Charts page (page 2) body — left builder rail + the chart dock.
     The builder edits the *active* chart; its card in the dock redraws
     live as fields change. Chart type = a family <select> + a row of
     inline-SVG variant tiles (no modifier checkboxes — every variant is
     a tile). "+ New" starts a draft; Save (title + description) commits. -->
<div class="rp-reports-charts" data-reports-chart-dock>

  <!-- ── Builder rail ─────────────────────────────────────────────── -->
  <aside class="rp-chart-builder" data-chart-builder>
    <div class="rp-chart-builder__hdr">
      <span class="rp-chart-builder__ttl" data-builder-ttl>New chart</span>
      <button class="rp-btn rp-btn-xs" type="button" title="New chart" data-nc-new>
        <i class="bi bi-plus-lg"></i>
      </button>
    </div>

    <div class="rp-chart-builder__body">
      <div class="rp-form-row">
        <label class="rp-form-lbl" for="nc-family">Chart type</label>
        <select id="nc-family" class="rp-input">
          <option value="bar">Bar</option>
          <option value="line">Line</option>
          <option value="area">Area</option>
          <option value="pie">Pie</option>
          <option value="pictorial_bar">Pictorial</option>
          <option value="scatter">Scatter</option>
          <option value="heatmap">Heatmap</option>
          <option value="matrix">Matrix</option>
          <option value="radar">Radar</option>
          <option value="boxplot">Box plot</option>
          <option value="calendar">Calendar</option>
          <option value="funnel">Funnel</option>
          <option value="gauge">Gauge</option>
        </select>
      </div>

      <!-- Variant tiles — JS paints one SVG-button per variant of the
           selected family; empty for single-variant families. -->
      <div class="rp-chart-variants" data-nc-variants></div>

      <!-- X / group-by — hidden for gauge (single scalar, no group). -->
      <div class="rp-form-row" data-cond-x>
        <label class="rp-form-lbl" for="nc-x"><span data-nc-lbl-x>Group by</span></label>
        <select id="nc-x" class="rp-input" data-reports-x-picker>
          <option value="">Pick a source file first</option>
        </select>
      </div>

      <!-- Y group-by — heatmap / matrix / radar second categorical dim. -->
      <div class="rp-form-row" data-cond-ygroup hidden>
        <label class="rp-form-lbl" for="nc-ygroup"><span data-nc-lbl-ygroup>Y group by</span></label>
        <select id="nc-ygroup" class="rp-input" data-reports-ygroup-picker>
          <option value="">Pick a source file first</option>
        </select>
      </div>

      <div class="rp-form-row">
        <label class="rp-form-lbl" for="nc-y"><span data-nc-lbl-y>Metric column</span></label>
        <select id="nc-y" class="rp-input" data-reports-y-picker>
          <option value="*">* (row count)</option>
        </select>
      </div>

      <!-- Aggregator — hidden for scatter (raw rows) + boxplot (5-stat). -->
      <div class="rp-form-row" data-cond-agg>
        <label class="rp-form-lbl" for="nc-agg">Aggregator</label>
        <select id="nc-agg" class="rp-input">
          <option value="count">Count</option>
          <option value="sum">Sum</option>
          <option value="mean">Average</option>
          <option value="min">Min</option>
          <option value="max">Max</option>
        </select>
      </div>

      <!-- Trend line — scatter only. -->
      <div class="rp-form-row" data-cond-regression hidden>
        <label class="rp-form-lbl" for="nc-regression">Trend line</label>
        <select id="nc-regression" class="rp-input">
          <option value="">None</option>
          <option value="linear">Linear</option>
          <option value="exponential">Exponential</option>
          <option value="logarithmic">Logarithmic</option>
          <option value="polynomial">Polynomial</option>
        </select>
      </div>

      <!-- Symbol shape — pictorial only. -->
      <div class="rp-form-row" data-cond-symbol hidden>
        <label class="rp-form-lbl" for="nc-symbol">Symbol</label>
        <select id="nc-symbol" class="rp-input">
          <option value="circle">Circle</option>
          <option value="rect">Rectangle</option>
          <option value="roundRect">Rounded rect</option>
          <option value="triangle">Triangle</option>
          <option value="diamond">Diamond</option>
          <option value="pin">Pin</option>
          <option value="arrow">Arrow</option>
        </select>
      </div>
    </div>

    <!-- Title + description live in the foot — auto-filled while a card is
         active, Save stamps them onto it. No modal: these two fields are
         the whole "save" interaction. The action row is the master
         Save / Download / Delete cluster, all acting on the active chart. -->
    <div class="rp-chart-builder__foot">
      <div class="rp-form-row">
        <label class="rp-form-lbl" for="nc-title">Title</label>
        <input id="nc-title" class="rp-input" type="text" placeholder="chart-001" />
      </div>
      <div class="rp-form-row">
        <label class="rp-form-lbl" for="nc-desc">Description</label>
        <textarea id="nc-desc" class="rp-input" rows="2"
                  placeholder="Optional — what this chart shows"></textarea>
      </div>
      <div class="rp-chart-builder__actions">
        <button class="btn btn-primary" type="button" data-nc-save>
          <i class="bi bi-floppy"></i> Save
        </button>
        <button class="rp-btn" type="button" data-nc-download
                aria-label="Download as HTML" title="Download as HTML">
          <i class="bi bi-download"></i>
        </button>
        <button class="rp-btn" type="button" data-nc-delete
                aria-label="Delete chart" title="Delete chart">
          <i class="bi bi-trash"></i>
        </button>
      </div>
    </div>
  </aside>

  <!-- ── Chart dock — one card per STATE.charts entry; the active one
       redraws live from the builder. Painted by _renderReportsCharts. ── -->
  <div class="rp-reports__chart-grid" data-reports-chart-grid></div>

</div>
