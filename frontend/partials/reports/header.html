<!-- Reports header — project + active-source-file workspace controls.
     Page chrome (back arrow + Profile / … / Theme) is one row up in
     .rp-rt-topbar; this row stays focused on the active project and the
     source file feeding the report.
     Data hooks:
       [data-reports-proj-name] — active project name
       [data-reports-file-name] — active source-file display name
       [data-reports-proj-meta] — meta line (dataset count)
     Undo / Redo / History / Export / Saved-settings act on the report's
     chart layout — that edit surface is Phase 2, so they ship disabled
     (cleaner's header ships undo/redo disabled the same way). Add-file
     is live: it opens the Cleaner scoped to this project — the surface
     where new datasets are ingested. No cleanness widget here: cleanness
     is a file-mutation concept, and Reports is read-only on its source. -->
<div class="rp-rt-header">
  <h2 class="rp-rt-title">
    <i class="bi bi-folder2-open"></i>
    <span data-reports-proj-name>—</span>
    <span class="rp-rt-title-sep">—</span>
    <i class="bi bi-file-earmark-text"></i>
    <span class="rp-rt-title-fname" data-reports-file-name>—</span>
  </h2>

  <div class="rp-rtp-hdr-info">
    <div class="rp-rtp-hdr-meta" data-reports-proj-meta>—</div>
  </div>

  <div class="rp-rt-hdr-actions">
    <button class="rp-btn" title="Undo — report editing lands in Phase 2" disabled>
      <i class="bi bi-arrow-counterclockwise"></i>
    </button>
    <button class="rp-btn" title="Redo — report editing lands in Phase 2" disabled>
      <i class="bi bi-arrow-clockwise"></i>
    </button>
    <button class="rp-btn" title="History — report editing lands in Phase 2" disabled>
      <i class="bi bi-clock-history"></i>
    </button>
    <button class="rp-btn" title="Export report — lands in Phase 2" disabled>
      <i class="bi bi-download"></i>
    </button>
    <button class="rp-btn" title="Saved report views — lands in Phase 2" disabled>
      <i class="bi bi-sliders"></i>
    </button>
    <!-- Add a dataset — routes to the Cleaner scoped to this project;
         Cleaner is the ingest surface where new files are uploaded. -->
    <button class="rp-btn" aria-label="Add a dataset" title="Add a dataset (opens Cleaner)"
            onclick="reportsAddFile()">
      <i class="bi bi-plus"></i>
    </button>
  </div>
</div>
