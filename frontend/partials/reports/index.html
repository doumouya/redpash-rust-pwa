<!-- Reports composition root — two full-bleed pages, vertical scroll-snap.

     Topbar: back + title + cleaner / objects / profile / theme.
     Panel = a vertical scroll-snap deck of two pages + a page-dots rail:
       Page 1 "Data"   — proj-tabs / header / file-tabs / toolbar + redtable
       Page 2 "Charts" — the chart dock (builder panel lands in pass 2)
     The page-dots (right edge) jump between pages; reports.js keeps the
     active dot in sync with the scroll position. -->

<div class="rp-rt-topbar">
  <button class="rp-btn" type="button" aria-label="Back to Home" title="Back to Home"
          onclick="location.hash='#/home'">
    <i class="bi bi-arrow-left"></i>
  </button>
  <h1 class="rp-rt-page-title"><i class="bi bi-bar-chart-line"></i> Reports</h1>
  <button class="rp-btn" type="button" aria-label="Open Cleaner" title="Open Cleaner"
          style="margin-left:auto"
          onclick="location.hash='#/cleaner'">
    <i class="bi bi-magic"></i>
  </button>
  <a class="rp-btn" href="#/objects" aria-label="Open Objects" title="Open Objects">
    <i class="bi bi-grid-3x3-gap"></i>
  </a>
  <a class="rp-btn" href="#/profile" aria-label="Profile" title="Profile">
    <i class="bi bi-person-circle"></i>
  </a>
  <button class="rp-btn" type="button" aria-label="Toggle theme" title="Toggle theme"
          onclick="rpToggleTheme?.()">
    <i class="bi bi-moon" data-sp-theme-icon></i>
  </button>
</div>

<div class="rp-rt-panel">

  <div class="rp-reports-deck" data-reports-deck>

    <!-- ── Page 1 — Data: workspace chrome + the source redtable. ──── -->
    <section class="rp-reports-page" data-reports-page="data">
      <div data-include="./proj-tabs.html"></div>
      <div data-include="./header.html"></div>
      <div data-include="./file-tabs.html"></div>
      <div data-include="./toolbar.html"></div>
      <div class="rp-reports-page__body">
        <div data-include="./filter-panel.html"></div>
        <div data-include="./table.html"></div>
        <div data-include="./tools-panel.html"></div>
      </div>
    </section>

    <!-- ── Page 2 — Charts. ─────────────────────────────────────────── -->
    <section class="rp-reports-page" data-reports-page="charts">
      <div data-include="./chart-dock.html"></div>
    </section>

  </div>

  <!-- Page-dots — jump between Data + Charts; active dot tracks scroll.
       The active page's dot becomes its bi-icon; inactive pages stay dots. -->
  <nav class="rp-reports-dots" aria-label="Reports pages">
    <button class="rp-reports-dot is-active" type="button"
            data-reports-dot="data" aria-label="Data page" title="Data">
      <i class="bi bi-table"></i>
    </button>
    <button class="rp-reports-dot" type="button"
            data-reports-dot="charts" aria-label="Charts page" title="Charts">
      <i class="bi bi-bar-chart-fill"></i>
    </button>
  </nav>
</div>
