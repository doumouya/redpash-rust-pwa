<!-- Left side-panel — filter the source rows before charting. Overlay,
     slides in via spToggle('reports-filter-panel'). Predicate rows
     collect into a shared::filter::FilterNode Group; Apply re-renders
     the report (grouped or raw) with the filter applied. -->
<div class="rp-rt-filter-panel" id="reports-filter-panel">
  <div class="rp-rt-filter-inner">

    <div class="rp-rt-filter-hdr">
      <span class="rp-rt-panel-hdr">Filter rows</span>
      <button class="rp-btn" title="Clear all predicates" style="margin-left:auto"
              onclick="reportsFbClear(this)">
        <i class="bi bi-eraser"></i>
      </button>
      <button class="rp-btn" title="Close panel"
              onclick="document.getElementById('reports-filter-panel').classList.remove('open')">
        <i class="bi bi-x-lg"></i>
      </button>
    </div>

    <div class="rp-rt-filter-content">

      <!-- AND / OR combinator. -->
      <div class="rp-rt-fb-op-toggle">
        <button type="button" class="is-active" data-combo="and" onclick="reportsFbSetCombo(this)">AND</button>
        <button type="button" data-combo="or" onclick="reportsFbSetCombo(this)">OR</button>
      </div>

      <!-- Predicate rows — spFbAddPredicate clones this row; the column /
           op dropdowns are populated from the source columns when the
           filter is wired up. -->
      <div class="rp-rt-fb-rows">
        <div class="rp-rt-fb-row">
          <button class="rp-rt-fb-rm" title="Remove predicate"
                  onclick="event.stopPropagation();spFbRmPredicate(this)">
            <i class="bi bi-x"></i>
          </button>
          <div class="rp-dd-wrap rp-rt-fb-col" data-fb-col data-value="">
            <button type="button" class="rp-rt-fb-dd-btn" onclick="spDdToggle(this)">
              <span data-dd-lbl>Column…</span>
              <i class="bi bi-chevron-down"></i>
            </button>
            <div class="rp-dd-menu" role="menu"></div>
          </div>
          <div class="rp-rt-fb-selects">
            <div class="rp-dd-wrap rp-rt-fb-op" data-fb-op data-value="">
              <button type="button" class="rp-rt-fb-dd-btn" onclick="spDdToggle(this)">
                <span data-dd-lbl>Op…</span>
                <i class="bi bi-chevron-down"></i>
              </button>
              <div class="rp-dd-menu" role="menu"></div>
            </div>
            <input type="text" class="rp-rt-fb-val" data-fb-val placeholder="value" />
          </div>
        </div>
      </div>

      <button type="button" class="rp-rt-fb-add" onclick="reportsFbAddPredicate(this)">
        <i class="bi bi-plus-lg"></i> Add predicate
      </button>

      <!-- Filter / select columns — collapsible. A regex name-pattern +
           a checkbox per source column; "Keep matched columns" trims the
           view to the matches. Mirrors the cleaner (the Objects-page
           filter has no column section). -->
      <div class="rp-rt-panel-sect open" onclick="spToggleSection(this)" style="margin-top:0.25rem">
        <span class="rp-rt-panel-sect-lbl">Filter / select columns</span>
        <i class="bi bi-chevron-down rp-rt-panel-sect-chevron"></i>
      </div>
      <div class="rp-rt-panel-sect-body open">
        <label class="rp-form-row">
          <span class="rp-form-lbl">Name pattern (regex)</span>
          <input type="text" class="rp-input" data-reports-filter-regex
                 placeholder="e.g. TOP.* or date.*" />
        </label>

        <!-- One checkbox per source column — painted by JS from the
             active file's columns. Checked = kept after Apply. -->
        <div class="rp-form-row" data-reports-filter-cols
             style="display:flex;flex-direction:column;gap:0.1875rem;max-height:11rem;overflow-y:auto"></div>

        <div style="display:flex;justify-content:flex-end;margin-top:0.5rem">
          <button class="btn btn-ghost btn-sm" onclick="reportsFbKeepCols(this)">
            <i class="bi bi-funnel-fill"></i> Keep matched columns
          </button>
        </div>
      </div>

    </div><!-- /.rp-rt-filter-content -->

    <div class="rp-rt-filter-footer">
      <button class="btn btn-ghost btn-sm" onclick="reportsFbApply(this)">
        <i class="bi bi-funnel"></i> Apply
      </button>
    </div>

  </div>
</div>
