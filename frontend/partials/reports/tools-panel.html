<!-- Right side-panel — "Reports Tools": the report-query builder. The
     sections map onto ReportSpec — grouping, aggregates, display toggles,
     window functions, top-N. UI shell for now; wiring to /reports/preview
     lands in the next pass. Overlay, slides in via spToggle. -->
<div class="rp-rtp-tools" id="reports-tools-panel">
  <div class="rp-rtp-tools-inner">

    <div class="rp-rt-panel-hdr-bar">
      <span class="rp-rt-panel-hdr"><i class="bi bi-diagram-3"></i> Reports Tools</span>
      <button class="rp-btn" title="Close panel" style="margin-left:auto"
              onclick="document.getElementById('reports-tools-panel').classList.remove('open')">
        <i class="bi bi-x-lg"></i>
      </button>
    </div>

    <div class="rp-rtp-tools-content">

      <!-- ── Grouping — group rows + the optional matrix column axis. ── -->
      <div class="rp-rt-panel-sect open" onclick="spToggleSection(this)">
        <span class="rp-rt-panel-sect-lbl">Grouping</span>
        <i class="bi bi-chevron-down rp-rt-panel-sect-chevron"></i>
      </div>
      <div class="rp-rt-panel-sect-body open">
        <div class="rp-rt-tool-sublbl">Group rows</div>
        <div class="rp-rt-tool-rows" data-reports-group-rows>
          <div class="rp-rt-tool-row">
            <select class="rp-input">
              <option value="">Pick a column…</option>
            </select>
            <button class="rp-rt-tool-rm" type="button" title="Remove">
              <i class="bi bi-x"></i>
            </button>
          </div>
        </div>
        <button type="button" class="btn btn-ghost btn-sm rp-rt-tool-add">
          <i class="bi bi-plus-lg"></i> Add group
        </button>

        <div class="rp-rt-tool-sublbl" style="margin-top:0.625rem">Group columns</div>
        <select class="rp-input" data-reports-group-cols>
          <option value="">No column grouping</option>
        </select>
        <div class="rp-form-meta" style="margin-top:0.25rem">
          Pick a column to pivot the result into a cross-tab (matrix).
        </div>
      </div>

      <!-- ── Summarize — one aggregate per row. ── -->
      <div class="rp-rt-panel-sect open" onclick="spToggleSection(this)">
        <span class="rp-rt-panel-sect-lbl">Summarize</span>
        <i class="bi bi-chevron-down rp-rt-panel-sect-chevron"></i>
      </div>
      <div class="rp-rt-panel-sect-body open">
        <div class="rp-rt-tool-rows" data-reports-aggs>
          <div class="rp-rt-tool-agg">
            <select class="rp-input">
              <option value="*">Row count</option>
            </select>
            <div class="rp-rt-tool-agg__fn">
              <select class="rp-input">
                <option value="count">Count</option>
                <option value="sum">Sum</option>
                <option value="mean">Average</option>
                <option value="min">Min</option>
                <option value="max">Max</option>
              </select>
              <button class="rp-rt-tool-rm" type="button" title="Remove">
                <i class="bi bi-x"></i>
              </button>
            </div>
          </div>
        </div>
        <button type="button" class="btn btn-ghost btn-sm rp-rt-tool-add">
          <i class="bi bi-plus-lg"></i> Add summary
        </button>
      </div>

      <!-- ── Display — what the grouped result shows. ── -->
      <div class="rp-rt-panel-sect open" onclick="spToggleSection(this)">
        <span class="rp-rt-panel-sect-lbl">Display</span>
        <i class="bi bi-chevron-down rp-rt-panel-sect-chevron"></i>
      </div>
      <div class="rp-rt-panel-sect-body open">
        <label class="rp-rt-tool-check">
          <input type="checkbox" data-reports-show="details" checked />
          <span>Detail rows</span>
        </label>
        <label class="rp-rt-tool-check">
          <input type="checkbox" data-reports-show="subtotals" checked />
          <span>Subtotals</span>
        </label>
        <label class="rp-rt-tool-check">
          <input type="checkbox" data-reports-show="total" />
          <span>Grand total</span>
        </label>
        <label class="rp-rt-tool-check">
          <input type="checkbox" data-reports-show="stacked" />
          <span>Stacked summaries</span>
        </label>
      </div>

      <!-- ── Calculated columns — window functions. Next pass. ── -->
      <div class="rp-rt-panel-sect" onclick="spToggleSection(this)">
        <span class="rp-rt-panel-sect-lbl">Calculated columns</span>
        <i class="bi bi-chevron-down rp-rt-panel-sect-chevron"></i>
      </div>
      <div class="rp-rt-panel-sect-body">
        <div class="rp-form-meta" style="padding:0.5rem;font-style:italic">
          Window functions — running totals, % of group, ranks,
          previous / next value. Lands in the next pass.
        </div>
      </div>

      <!-- ── Top N per group ── -->
      <div class="rp-rt-panel-sect" onclick="spToggleSection(this)">
        <span class="rp-rt-panel-sect-lbl">Top N per group</span>
        <i class="bi bi-chevron-down rp-rt-panel-sect-chevron"></i>
      </div>
      <div class="rp-rt-panel-sect-body">
        <div class="rp-form-row">
          <label class="rp-form-lbl" for="rt-topn">Keep top</label>
          <input id="rt-topn" class="rp-input" type="number" min="1"
                 placeholder="e.g. 5" data-reports-topn />
        </div>
        <div class="rp-form-row">
          <label class="rp-form-lbl" for="rt-topn-by">Ranked by</label>
          <select id="rt-topn-by" class="rp-input" data-reports-topn-by>
            <option value="">Pick a summary…</option>
          </select>
        </div>
      </div>

    </div><!-- /.rp-rtp-tools-content -->

  </div>
</div>
