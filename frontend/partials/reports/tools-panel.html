<!-- Right side-panel — "Reports Tools". Empty placeholder for now;
     report tools land here in a later pass. Overlay, slides in via
     spToggle('reports-tools-panel'). -->
<div class="rp-rtp-tools" id="reports-tools-panel">
  <div class="rp-rtp-tools-inner">

    <div class="rp-rt-panel-hdr-bar">
      <span class="rp-rt-panel-hdr"><i class="bi bi-diagram-3"></i> Reports Tools</span>
      <button class="rp-btn" title="Close panel" style="margin-left:auto"
              onclick="document.getElementById('reports-tools-panel').classList.remove('open')">
        <i class="bi bi-x-lg"></i>
      </button>
    </div>

    <div class="rp-rtp-tools-content">
      <div class="rp-form-meta" style="padding:0.75rem;font-style:italic">
        Report tools land here.
      </div>
    </div>

  </div>
</div>
