<!-- Project tab strip — sits ABOVE the header. _renderReportsProjectTabs
     paints one .rp-rt-proj-tab per project; the active one carries
     .active. Clicking a tab re-scopes the page (#/reports?project=…).
     Each non-active tab has a × that hides it; a trailing + reopens
     hidden ones from a dropdown — same model as the objects type-tabs. -->
<div class="rp-rt-proj-tabs">
  <div class="rp-rt-proj-tabs-inner" data-reports-proj-tabs>
    <!-- Project tabs injected here by _renderReportsProjectTabs. -->
  </div>
</div>
