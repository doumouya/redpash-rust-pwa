<!-- SheetWise — the SQL console (view 1) + Connectors (view 2), conformed to the
     canonical rail-shell every other page uses. The rail (Sources/Targets in SQL
     view; connectors in Connectors view) toggles via the rp-rail-views
     data-rail-seg track; the surface holds the editor + result, or the connector
     guidance. Everything is a framework component — the page owns only rp-sw-*
     POSITIONING (the rp-cases-*/rp-mon-* convention), never a role-private class.
     mountRail / mountEditorCode / mountRedTable / mountPager / mountChipRow are
     mounted by pages/sheetwise.js into the hosts below. -->
<section class="rp-shell rp-shell--wide">
  <header id="rp-topbar"></header>

  <div class="rp-shell-body">
    <!-- rail — Sources/Targets (SQL) · connectors (Connectors); mountRail fills it -->
    <aside class="rp-rail" id="swRail"></aside>

    <main class="rp-main">
      <div class="rp-surface" id="swSurface">

        <!-- ════ view 1 — SQL console ════ -->
        <div class="rp-sw-view" id="swViewSql">
          <div class="rp-sw-editbar">
            <div id="swCols"></div>                       <!-- active file's columns (mountChipRow sets rp-chip-row) -->
            <div id="swEditor"></div>                     <!-- mountEditorCode -->
          </div>
          <div class="rp-sw-err" id="swErr" role="alert" aria-live="assertive" hidden></div>
          <div id="swGrid"></div>                          <!-- mountRedTable (the result grid) -->
          <div class="rp-sw-foot" id="swFoot">
            <span class="rp-sw-stat" id="swStat">—</span>
            <span class="rp-sw-foot-sp"></span>
            <input class="rp-input rp-sw-target-in" id="swTargetName"
                   placeholder="target table name" aria-label="Target table name" />
            <button class="rp-btn-icon rp-btn-icon--glass" id="swSave" type="button" disabled
                    title="Materialize this result as a new table file in the project">
              <i class="bi bi-plus-lg"></i><span>Save as table</span>
            </button>
            <div id="swPager"></div>                       <!-- mountPager -->
          </div>
        </div>

        <!-- ════ view 2 — Connectors (each connector = a rail group; its facets render here) ════ -->
        <div class="rp-sw-view rp-sw-conn" id="swViewConnectors" hidden>
          <div class="rp-empty rp-sw-conn-guide" id="swConnGuide">
            <i class="bi bi-database-add"></i>
            <p>Pull an external database into a CSV you can query — the live source is
               never touched. Expand a connector in the rail for its
               <b>Tables / Schema / Pulls / Settings</b>, or create one.</p>
            <button class="rp-btn-icon rp-btn-icon--accent" id="swConnNew" type="button">
              <i class="bi bi-plus-lg"></i><span>New connector</span>
            </button>
          </div>
          <div class="rp-sw-facet" id="swConnFacet" hidden></div>   <!-- active connector facet renders here -->
        </div>

      </div>
    </main>
  </div>
</section>
