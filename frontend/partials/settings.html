<!-- Settings — app preferences. Section shells only; rows render
     from `SETTINGS_ROWS` in settings.js via page-row.js helpers
     (prefRow / valueRow / actionsRow / mountRow), so the page is
     declarative data + one render call. Visual-impact prefs (theme,
     density, font size) drive token overrides on <html> so every
     component reshapes without a per-page edit.

     Shell migration (2026-05-27): adopted the standard `.rp-shell`
     rail-page layout used by Home / Monitoring / Workspace / Cases —
     left rail (`.rt-nav` with grouped tabs), main area
     (`.rp-main > .rp-surface`). Settings is the only page where
     clicking a rail tab DOESN'T switch views — sections stay in a
     scrolling stack and the rail items are anchor links that jump
     within `#rpSetView`. Active tab tracks scroll position via the
     IntersectionObserver in settings.js's `mountSettingsRail`. -->
<section class="rp-shell rp-shell--wide">
  <header id="rp-topbar"></header>

  <div class="rp-shell-body">

    <!-- ════ rail — grouped section index ════
         Populated by settings.js (SET_TABS / SET_GROUPS) so the
         rt-group + rt-tab markup matches the canonical
         home / monitoring rail exactly (collapsible groups,
         two-letter color marks, count badge). -->
    <aside class="rt-nav" id="rpSetNav">
      <div class="rt-nav-head">
        <span class="rt-nav-title">Settings</span>
        <button class="rt-btn" id="rpSetNavCollapse" type="button" title="Collapse">
          <i class="bi bi-chevron-double-left"></i>
        </button>
      </div>
      <div class="rt-nav-body" id="rpSetNavBody"></div>
      <div class="rt-nav-foot"><!-- rail footer nav mounted by settings.js --></div>
    </aside>

    <!-- ════ main — section stack on one scroll surface ════
         Same `<main class="rp-main"><div class="rp-surface">` shell
         as Home / Monitoring. #rpSetView IS the rp-surface; the
         IntersectionObserver in settings.js watches sections inside
         it for scroll-spy. -->
    <main class="rp-main">
      <div class="rp-surface rp-settings__surface" id="rpSetView">
        <header class="rp-page__head">
          <h1 class="rp-page__title">Settings</h1>
          <p class="rp-page__sub">App preferences. Stored on this device.</p>
        </header>

        <!-- Settings v2 search shell — mountSearch() in settings-search.js
             paints the live filter input + tag chip cloud here. Behavior:
             input debounces 80ms, matches against label/hint/key/tags;
             non-matching rows get .is-dim (40% opacity, kept in place so
             users see what they're filtering past); rail group badges
             switch from tab-count to hit-count while a query is active.
             "/" focuses the input from anywhere in Settings; Esc clears. -->
        <div class="rp-settings__search-shell" id="rpSetSearchShell" hidden></div>

        <section class="rp-page__section" id="set-appearance">
          <h2 class="rp-page__section-h">Appearance</h2>
          <div class="rp-page__section-body" data-rp-rows="appearance"></div>
        </section>

        <section class="rp-page__section" id="set-tables">
          <h2 class="rp-page__section-h">Tables</h2>
          <div class="rp-page__section-body" data-rp-rows="tables"></div>
        </section>

        <section class="rp-page__section" id="set-workspace">
          <h2 class="rp-page__section-h">Workspace</h2>
          <div class="rp-page__section-body" data-rp-rows="workspace"></div>
        </section>

        <section class="rp-page__section" id="set-data">
          <h2 class="rp-page__section-h">Data &amp; Export</h2>
          <div class="rp-page__section-body" data-rp-rows="data"></div>
        </section>

        <section class="rp-page__section" id="set-cleaner">
          <h2 class="rp-page__section-h">Cleaner</h2>
          <div class="rp-page__section-body" data-rp-rows="cleaner"></div>
        </section>

        <section class="rp-page__section" id="set-monitoring-charts">
          <h2 class="rp-page__section-h">Monitoring charts</h2>
          <div class="rp-page__section-body" data-rp-rows="monitoringCharts"></div>
        </section>

        <section class="rp-page__section" id="set-home-charts">
          <h2 class="rp-page__section-h">Home charts</h2>
          <div class="rp-page__section-body" data-rp-rows="homeCharts"></div>
        </section>

        <!-- Cases page settings — CAS_3FC70F56 stub. Rows land here as
             Cases-page surfaces identify prefs they want. -->
        <section class="rp-page__section" id="set-cases">
          <h2 class="rp-page__section-h">Cases page</h2>
          <div class="rp-page__section-body" data-rp-rows="cases"></div>
        </section>

        <!-- Hidden Items — Settings v2 step 5 (CAS_55984AC7). Unified
             recovery surface for everywhere the app lets users hide
             rows (Workspace rail, Home tabs, Cases). Reads localStorage
             `rp-pref-{rail_hidden_*,home_hidden_*,cases_hidden}` keys;
             renders a per-page grouped list with per-item × restore
             + per-page Restore all. -->
        <section class="rp-page__section" id="set-hidden">
          <h2 class="rp-page__section-h">Hidden items</h2>
          <div class="rp-page__section-body" data-rp-rows="hidden"></div>
        </section>

        <section class="rp-page__section" id="set-account">
          <h2 class="rp-page__section-h">Account</h2>
          <div class="rp-page__section-body" data-rp-rows="account"></div>
        </section>

        <section class="rp-page__section rp-settings__about" id="set-about">
          <div class="rp-page__section-body" data-rp-rows="about"></div>
        </section>
      </div>
    </main>

  </div>
</section>
