     server-rendered HTML (pulldown-cmark + syntect + gray_matter). -->
<section class="rp-docs">
  <aside class="rp-docs__nav" id="docs-nav" aria-label="Docs navigation">

    <p class="rp-muted">Pick a topic from the sidebar.</p>
  </article>
</section>
