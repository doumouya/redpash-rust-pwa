<!-- Open project — rp-modal that replaced the inline + dropdown on the
     project-tabs strip. Each row is a click-to-open project; clicking
     calls spAddProjectTab(this, "<name>") + closes the modal. The
     name field on each row is the source of truth for the new tab's
     label (kebab-case key would normally drive the [data-project=…]
     wrapper match too, but in this mockup the only "openable" entries
     are the two real projects which are both already tabs — so the
     body falls through to the empty state). -->
<div class="rp-modal-overlay" id="rp-modal-open-project"
     onclick="closeModal('open-project')" role="dialog" aria-modal="true">
  <div class="rp-modal rp-modal-md" onclick="event.stopPropagation()">
    <div class="rp-modal-hdr">
      <div>
        <h2 class="rp-modal-ttl">Open another project</h2>
        <div class="rp-modal-sub">Pick an existing project to open as a tab. New projects are created from the Projects page.</div>
      </div>
      <button class="rp-btn" onclick="closeModal('open-project')" aria-label="Close" title="Close"><i class="bi bi-x-lg"></i></button>
    </div>

    <input type="search" class="rp-input" placeholder="Filter projects…" oninput="spFilterPicks(this)" />

    <!-- Project picker grid — painted by JS on modal open from
         /api/projects, filtered to projects not currently tabbed.
         Empty container by default. -->
    <div class="rp-pick-grid" data-cleaner-project-picker></div>

    <div class="rp-modal-footer">
      <!-- New-project flow — closes this picker and opens the
           new-project modal via spOpenNewProjectModal (which resets
           the form + binds the drop-zone before opening). Backend
           has no standalone POST /api/projects — projects are created
           by POST /api/files/upload with project_name set
           (ensure_named_project upserts the project row). -->
      <button class="rp-btn" aria-label="New project with a file"
              title="New project (upload file)" style="margin-right:auto"
              onclick="closeModal('open-project');spOpenNewProjectModal()">
        <i class="bi bi-cloud-upload"></i>
      </button>
      <button class="btn btn-ghost" onclick="closeModal('open-project')">Close</button>
    </div>
  </div>
</div>
