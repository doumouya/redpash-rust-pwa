<!-- Saved settings — read-only inspector that lists every open file
     tab with its saved filters. Filter names are hard-coded for the
     demo; the live app pulls them from prefs.cleaner_saved_filters[
     rid]. Layout pattern (icon · name · Active badge · chips) is
     unchanged so the design intent reads. -->
<div class="rp-modal-overlay" id="rp-modal-saved-settings"
     onclick="closeModal('saved-settings')" role="dialog" aria-modal="true">
  <div class="rp-modal rp-modal-lg" onclick="event.stopPropagation()">
    <div class="rp-modal-hdr">
      <div>
        <h2 class="rp-modal-ttl">Saved tab settings</h2>
        <div class="rp-modal-sub">Saved filters and toolbar settings for each open file tab in the active project.</div>
      </div>
      <button class="rp-btn" onclick="closeModal('saved-settings')" aria-label="Close" title="Close"><i class="bi bi-x-lg"></i></button>
    </div>

    <!-- Per-tab settings list — painted by JS from prefs.cleaner_*[rid]
         on modal open. Render contract: one .rp-view-row per open file
         tab, .is-active on the row matching the currently active tab.
         The chip composition (Filters group + Toolbar group) is the
         same shape across rows; empty Filters group renders
         <span class="rp-view-default">No saved filters</span>. -->
    <div class="rp-views-list" data-cleaner-saved-settings></div>

    <div class="rp-modal-footer">
      <button class="btn btn-ghost" onclick="closeModal('saved-settings')">Close</button>
    </div>
  </div>
</div>
