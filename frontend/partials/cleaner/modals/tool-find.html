<!-- Find in values — mirrors modal-tool-find (live app cleaner.html
     lines 770-786). Column scope + search input; results land in
     the find-box. Secondary action hands off to Replace text. -->
<div class="rp-modal-overlay" id="rp-modal-tool-find"
     onclick="closeModal('tool-find')" role="dialog" aria-modal="true">
  <div class="rp-modal rp-modal-md" onclick="event.stopPropagation()">
    <div class="rp-modal-hdr">
      <div>
        <h2 class="rp-modal-ttl"><i class="bi bi-search"></i> Find in values</h2>
        <div class="rp-modal-sub">Search for a string or regex across one or all columns.</div>
      </div>
      <button class="rp-btn" onclick="closeModal('tool-find')" aria-label="Close" title="Close"><i class="bi bi-x-lg"></i></button>
    </div>

    <label class="rp-form-row">
      <span class="rp-form-lbl">Search in</span>
      <select class="rp-input" data-sp-col>
        <option selected>All columns</option>
        <option>Cause.intervention</option>
        <option>Client</option>
        <option>Formule</option>
        <option>Type.d.energie</option>
        <option>Outil.d.assistance</option>
      </select>
    </label>

    <label class="rp-form-row">
      <span class="rp-form-lbl">Search for</span>
      <input type="text" class="rp-input" data-sp-find placeholder="Search term or pattern…" />
    </label>

    <!-- Live preview — spPreviewFind scans the column scope's distinct
         values and lists every match (substring, case-insensitive). -->
    <div class="rp-form-row">
      <span class="rp-form-lbl rp-lbl-between">
        Matches
        <button type="button" class="btn btn-ghost btn-sm" onclick="spPreviewFind(this)"><i class="bi bi-arrow-clockwise"></i> Compute</button>
      </span>
      <div data-sp-preview>
        <div class="rp-preview-line rp-form-meta">Type a search term then click Compute.</div>
      </div>
    </div>

    <div class="rp-modal-footer">
      <button class="btn btn-ghost" onclick="closeModal('tool-find')">Close</button>
      <button class="btn btn-primary" onclick="closeModal('tool-find');openModal('tool-replacetext')">Replace these values <i class="bi bi-arrow-right"></i></button>
    </div>
  </div>
</div>
