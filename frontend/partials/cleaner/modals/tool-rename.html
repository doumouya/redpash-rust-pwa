<!-- Rename column — mirrors modal-tool-rename (live app cleaner.html
     lines 597-612). Column dropdown + new name input. -->
<div class="rp-modal-overlay" id="rp-modal-tool-rename"
     onclick="closeModal('tool-rename')" role="dialog" aria-modal="true">
  <div class="rp-modal rp-modal-sm" onclick="event.stopPropagation()">
    <div class="rp-modal-hdr">
      <div>
        <h2 class="rp-modal-ttl"><i class="bi bi-pencil-square"></i> Rename column</h2>
        <div class="rp-modal-sub">Renames the header in place; downstream references update.</div>
      </div>
      <button class="rp-btn" onclick="closeModal('tool-rename')" aria-label="Close" title="Close"><i class="bi bi-x-lg"></i></button>
    </div>

    <label class="rp-form-row">
      <span class="rp-form-lbl">Column to rename</span>
      <!-- [data-tool-cols] — _populateToolModal paints one <option> per
           STATE.columns on every open. -->
      <select class="rp-input" data-tool-cols></select>
    </label>

    <label class="rp-form-row">
      <span class="rp-form-lbl">New name</span>
      <input type="text" class="rp-input" data-tool-new-name
             placeholder="Enter new column name…" />
    </label>

    <div class="rp-modal-footer">
      <button class="btn btn-ghost" onclick="closeModal('tool-rename')">Cancel</button>
      <button class="btn btn-primary" onclick="cleanerApplyTool('tool-rename')">Apply rename</button>
    </div>
  </div>
</div>
