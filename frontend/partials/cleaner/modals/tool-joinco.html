<!-- Join columns — mirrors modal-tool-joinco (live app cleaner.html
     lines 729-750). Two column pickers with a + between, separator
     and new column name. -->
<div class="rp-modal-overlay" id="rp-modal-tool-joinco"
     onclick="closeModal('tool-joinco')" role="dialog" aria-modal="true">
  <div class="rp-modal rp-modal-md" onclick="event.stopPropagation()">
    <div class="rp-modal-hdr">
      <div>
        <h2 class="rp-modal-ttl"><i class="bi bi-link"></i> Join columns</h2>
        <div class="rp-modal-sub">Concatenate two columns into one.</div>
      </div>
      <button class="rp-btn" onclick="closeModal('tool-joinco')" aria-label="Close" title="Close"><i class="bi bi-x-lg"></i></button>
    </div>

    <div style="display:grid;grid-template-columns:1fr auto 1fr;gap:0.5rem;align-items:end">
      <label class="rp-form-row">
        <span class="rp-form-lbl">Column A</span>
        <select class="rp-input" data-sp-col-a>
          <option selected>Client</option>
          <option>Formule</option>
          <option>Cause.intervention</option>
          <option>Type.d.energie</option>
        </select>
      </label>
      <div style="padding-bottom:0.4rem;color:var(--muted);font-size:1.125rem">+</div>
      <label class="rp-form-row">
        <span class="rp-form-lbl">Column B</span>
        <select class="rp-input" data-sp-col-b>
          <option>Client</option>
          <option selected>Formule</option>
          <option>Cause.intervention</option>
          <option>Type.d.energie</option>
        </select>
      </label>
    </div>

    <div class="rp-2col">
      <label class="rp-form-row">
        <span class="rp-form-lbl">Separator</span>
        <input type="text" class="rp-input" data-sp-sep value=" - " />
      </label>
      <label class="rp-form-row">
        <span class="rp-form-lbl">New column name</span>
        <input type="text" class="rp-input" placeholder="joined_col" />
      </label>
    </div>

    <!-- Live preview — spPreviewJoinCo concatenates A + sep + B for
         each demo row so the user sees the actual joined string. -->
    <div class="rp-form-row">
      <span class="rp-form-lbl rp-lbl-between">
        Preview
        <button type="button" class="btn btn-ghost btn-sm" onclick="spPreviewJoinCo(this)"><i class="bi bi-arrow-clockwise"></i> Compute</button>
      </span>
      <div data-sp-preview>
        <div class="rp-preview-line rp-form-meta">Pick A + B + separator then click Compute.</div>
      </div>
    </div>

    <div class="rp-modal-footer">
      <button class="btn btn-ghost" onclick="closeModal('tool-joinco')">Cancel</button>
      <button class="btn btn-primary" onclick="closeModal('tool-joinco')">Create joined column</button>
    </div>
  </div>
</div>
