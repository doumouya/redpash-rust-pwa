<!-- Remove text — mirrors modal-tool-removetext (live app cleaner.html
     lines 753-767). Column + pattern; strips matches from values. -->
<div class="rp-modal-overlay" id="rp-modal-tool-removetext"
     onclick="closeModal('tool-removetext')" role="dialog" aria-modal="true">
  <div class="rp-modal rp-modal-sm" onclick="event.stopPropagation()">
    <div class="rp-modal-hdr">
      <div>
        <h2 class="rp-modal-ttl"><i class="bi bi-eraser"></i> Remove text</h2>
        <div class="rp-modal-sub">Strip a word or pattern from string values.</div>
      </div>
      <button class="rp-btn" onclick="closeModal('tool-removetext')" aria-label="Close" title="Close"><i class="bi bi-x-lg"></i></button>
    </div>

    <label class="rp-form-row">
      <span class="rp-form-lbl">Column</span>
      <select class="rp-input" data-tool-cols></select>
    </label>

    <label class="rp-form-row">
      <span class="rp-form-lbl">Pattern to remove</span>
      <input type="text" class="rp-input" data-tool-find
             placeholder="word, phrase or regex…" />
    </label>

    <div class="rp-modal-footer">
      <button class="btn btn-ghost" onclick="closeModal('tool-removetext')">Cancel</button>
      <button class="btn btn-primary" onclick="cleanerApplyTool('tool-removetext')">Apply to column</button>
    </div>
  </div>
</div>
