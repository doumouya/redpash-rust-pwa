<!-- Drop empty rows — mirrors modal-tool-droprows (live app
     cleaner.html lines 971-985). Checklist of columns; ticked
     columns must all be null for a row to drop. None ticked =
     drop where ALL columns are null. -->
<div class="rp-modal-overlay" id="rp-modal-tool-droprows"
     onclick="closeModal('tool-droprows')" role="dialog" aria-modal="true">
  <div class="rp-modal rp-modal-sm" onclick="event.stopPropagation()">
    <div class="rp-modal-hdr">
      <div>
        <h2 class="rp-modal-ttl"><i class="bi bi-file-minus"></i> Drop empty rows</h2>
        <div class="rp-modal-sub">Remove rows where the selected columns are null.</div>
      </div>
      <button class="rp-btn" onclick="closeModal('tool-droprows')" aria-label="Close" title="Close"><i class="bi bi-x-lg"></i></button>
    </div>

    <div class="rp-form-row">
      <span class="rp-form-lbl">Drop rows where ALL of these columns are null. Leave none ticked to require EVERY column to be null.</span>
      <!-- [data-tool-checklist] — _populateToolModal paints one
           <label><input type="checkbox" data-tool-col="<colname>"> per
           STATE.columns. _readToolPayload reads the checked ones via
           the `cols()` helper. -->
      <div data-tool-checklist
           style="display:flex;flex-direction:column;gap:0.1875rem;max-height:18rem;overflow-y:auto">
        <div class="rp-form-meta" style="padding:0.5rem;font-style:italic">
          Open a file to load its columns.
        </div>
      </div>
    </div>

    <div class="rp-modal-footer">
      <button class="btn btn-ghost" onclick="closeModal('tool-droprows')">Cancel</button>
      <button class="btn btn-primary" onclick="cleanerApplyTool('tool-droprows')">Drop rows</button>
    </div>
  </div>
</div>
