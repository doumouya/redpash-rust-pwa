<!-- New project — name + first file, both required. Backend has no
     standalone POST /api/projects; projects come into being via
     POST /api/files/upload (ensure_named_project upserts the project
     row on demand). So this modal IS the upload-to-new-project flow.
     Submit wires through spCleanerCreateProject() which builds the
     multipart, POSTs, then navigates to the new file.
     Description is captured for the user but not persisted yet —
     ensure_named_project doesn't take a description; we'd need a
     follow-up PATCH /api/projects/:rid to store it. -->
<div class="rp-modal-overlay" id="rp-modal-new-project"
     onclick="closeModal('new-project')" role="dialog" aria-modal="true">
  <div class="rp-modal rp-modal-md" onclick="event.stopPropagation()">
    <div class="rp-modal-hdr">
      <div>
        <h2 class="rp-modal-ttl">New project</h2>
        <div class="rp-modal-sub">Name your project and import its first file to create it.</div>
      </div>
      <button class="rp-btn" onclick="closeModal('new-project')"
              aria-label="Close" title="Close">
        <i class="bi bi-x-lg"></i>
      </button>
    </div>

    <div class="rp-form-row">
      <label class="rp-form-lbl" for="np-name">Project name</label>
      <input id="np-name" type="text" class="rp-input" placeholder="e.g. Q1 Sales Data"
             maxlength="120" required />
    </div>

    <div class="rp-form-row">
      <label class="rp-form-lbl" for="np-desc">Description <span class="rp-form-meta">(optional, not persisted yet)</span></label>
      <input id="np-desc" type="text" class="rp-input" placeholder="Short description" />
    </div>

    <div class="rp-form-row">
      <label class="rp-form-lbl">Files <span class="rp-form-meta">(at least one — drop several to seed the project with multiple files)</span></label>
      <label class="rp-obj-drop-zone" data-cleaner-np-drop>
        <input id="np-file" type="file" accept=".csv,.tsv,.xlsx,.xls" multiple style="display:none"
               onchange="window.__npFileLabel?.(this)" />
        <i class="bi bi-cloud-upload" style="font-size:1.5rem;color:var(--muted)"></i>
        <span data-cleaner-np-droplbl>Drop CSV / TSV / Excel files, or <u>click to browse</u></span>
      </label>
    </div>

    <!-- Error / status line — JS toggles between hidden, "Uploading…",
         and "Couldn't create project: <reason>" via [data-cleaner-np-status]. -->
    <div class="rp-form-meta" data-cleaner-np-status hidden style="margin:0.5rem 0;color:var(--red,#c33)"></div>

    <div class="rp-modal-footer">
      <button class="btn btn-ghost" onclick="closeModal('new-project')">Cancel</button>
      <button class="btn btn-primary" data-cleaner-np-submit
              onclick="spCleanerCreateProject(this)">Create project</button>
    </div>
  </div>
</div>
