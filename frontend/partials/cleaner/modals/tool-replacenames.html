<!-- Replace in names — mirrors modal-tool-replacenames (live app
     cleaner.html lines 633-650). Find + Replace inputs (column
     headers only — not cell values). -->
<div class="rp-modal-overlay" id="rp-modal-tool-replacenames"
     onclick="closeModal('tool-replacenames')" role="dialog" aria-modal="true">
  <div class="rp-modal rp-modal-sm" onclick="event.stopPropagation()">
    <div class="rp-modal-hdr">
      <div>
        <h2 class="rp-modal-ttl"><i class="bi bi-tag"></i> Replace in names</h2>
        <div class="rp-modal-sub">Find &amp; replace a character across all column names.</div>
      </div>
      <button class="rp-btn" onclick="closeModal('tool-replacenames')" aria-label="Close" title="Close"><i class="bi bi-x-lg"></i></button>
    </div>

    <div class="rp-2col">
      <label class="rp-form-row">
        <span class="rp-form-lbl">Find</span>
        <input type="text" class="rp-input" data-tool-find value="." />
      </label>
      <label class="rp-form-row">
        <span class="rp-form-lbl">Replace with</span>
        <input type="text" class="rp-input" data-tool-replace value="_" />
      </label>
    </div>

    <div class="rp-modal-footer">
      <button class="btn btn-ghost" onclick="closeModal('tool-replacenames')">Cancel</button>
      <button class="btn btn-primary" onclick="cleanerApplyTool('tool-replacenames')">Apply</button>
    </div>
  </div>
</div>
