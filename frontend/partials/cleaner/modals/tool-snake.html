<!-- Snake_case all — mirrors modal-tool-snake (live app cleaner.html
     lines 614-630). Header label + preview list of before/after. -->
<div class="rp-modal-overlay" id="rp-modal-tool-snake"
     onclick="closeModal('tool-snake')" role="dialog" aria-modal="true">
  <div class="rp-modal rp-modal-md" onclick="event.stopPropagation()">
    <div class="rp-modal-hdr">
      <div>
        <h2 class="rp-modal-ttl"><i class="bi bi-braces"></i> Snake_case all columns</h2>
        <div class="rp-modal-sub">Replaces <code>.</code> · spaces · dashes with <code>_</code></div>
      </div>
      <button class="rp-btn" onclick="closeModal('tool-snake')" aria-label="Close" title="Close"><i class="bi bi-x-lg"></i></button>
    </div>

    <!-- Live preview — spPreviewSnake reads SP_DEMO_COLS (sentinel
         column list), runs the snake_case transform client-side, and
         paints the before/after pairs into [data-sp-preview]. -->
    <div class="rp-form-row">
      <span class="rp-form-lbl rp-lbl-between">
        Preview
        <button type="button" class="btn btn-ghost btn-sm" onclick="spPreviewSnake(this)"><i class="bi bi-arrow-clockwise"></i> Compute</button>
      </span>
      <div data-sp-preview>
        <div class="rp-preview-line rp-form-meta">Click Compute to see the result on the current column list.</div>
      </div>
    </div>

    <div class="rp-modal-footer">
      <button class="btn btn-ghost" onclick="closeModal('tool-snake')">Cancel</button>
      <button class="btn btn-primary" onclick="closeModal('tool-snake')">Apply to all columns</button>
    </div>
  </div>
</div>
