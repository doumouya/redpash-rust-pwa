<!-- Open file — rp-modal that replaced the inline + dropdown on the
     file-tabs strip. A project can easily hold 20+ files (version
     copies, monthly snapshots, joined outputs), past the point where
     a 13rem dropdown reads cleanly. Each row is a click-to-open file;
     clicking calls spAddFileTab(this, "<filename>") + closes the modal.
     The card body shows filename + a meta line (size · modified ·
     cleanness pct) so picking from a long list stays scannable. -->
<div class="rp-modal-overlay" id="rp-modal-open-file"
     onclick="closeModal('open-file')" role="dialog" aria-modal="true">
  <div class="rp-modal rp-modal-md" onclick="event.stopPropagation()">
    <div class="rp-modal-hdr">
      <div>
        <h2 class="rp-modal-ttl">Open another file</h2>
        <div class="rp-modal-sub">Pick an existing file in this project to open as a tab. New uploads go through the header's + (multi-upload).</div>
      </div>
      <button class="rp-btn" onclick="closeModal('open-file')" aria-label="Close" title="Close"><i class="bi bi-x-lg"></i></button>
    </div>

    <input type="search" class="rp-input" placeholder="Filter files…" oninput="spFilterPicks(this)" />

    <!-- File picker grid — painted by JS on modal open from
         /api/projects/:rid/files, filtered to files not currently
         tabbed. Empty container by default. -->
    <div class="rp-pick-grid" data-cleaner-file-picker></div>

    <div class="rp-modal-footer">
      <!-- "Add files to this project" — reuses spOpenNewProjectModal
           pre-filled with the current project name. spCleanerCreateProject
           POSTs each file with that name; backend ensure_named_project
           upserts so all uploads land in the same project. Wrapper
           function reads STATE.project on the fly so the active project
           is always current. -->
      <button class="rp-btn" aria-label="Upload files to this project"
              title="Upload files to this project" style="margin-right:auto"
              onclick="spAddFilesToCurrentProject()">
        <i class="bi bi-cloud-upload"></i>
      </button>
      <button class="btn btn-ghost" onclick="closeModal('open-file')">Close</button>
    </div>
  </div>
</div>
