<!-- Drop columns — mirrors modal-tool-dropcols (live app cleaner.html
     lines 692-706). Multi-checkbox; destructive primary button. -->
<div class="rp-modal-overlay" id="rp-modal-tool-dropcols"
     onclick="closeModal('tool-dropcols')" role="dialog" aria-modal="true">
  <div class="rp-modal rp-modal-sm" onclick="event.stopPropagation()">
    <div class="rp-modal-hdr">
      <div>
        <h2 class="rp-modal-ttl"><i class="bi bi-dash-square"></i> Drop columns</h2>
        <div class="rp-modal-sub">Permanently remove columns from this file.</div>
      </div>
      <button class="rp-btn" onclick="closeModal('tool-dropcols')" aria-label="Close" title="Close"><i class="bi bi-x-lg"></i></button>
    </div>

    <div class="rp-form-row">
      <span class="rp-form-lbl">Select columns to drop</span>
      <!-- [data-tool-checklist] is the render hook for _populateToolModal —
           on every cleanerOpenTool('tool-dropcols', btn) call, this div's
           innerHTML is replaced with one <label> containing
           <input type="checkbox" data-tool-col="<colname>"> per STATE.columns
           entry. The previous hardcoded French sample labels never showed
           real columns + had no data-tool-col attrs, so _readToolPayload's
           cols() picked up nothing. Placeholder content below shows when
           no file is open. -->
      <div data-tool-checklist
           style="display:flex;flex-direction:column;gap:0.1875rem;max-height:18rem;overflow-y:auto">
        <div class="rp-form-meta" style="padding:0.5rem;font-style:italic">
          Open a file to load its columns.
        </div>
      </div>
    </div>

    <div class="rp-modal-footer">
      <button class="btn btn-ghost" onclick="closeModal('tool-dropcols')">Cancel</button>
      <!-- cleanerApplyTool: reads ticked [data-tool-col] checkboxes via
           _readToolPayload, POSTs { kind: "drop_columns", params: { cols } },
           pipes the response through the standard re-render + toast.
           Closes the modal optimistically. -->
      <button class="btn btn-primary" onclick="cleanerApplyTool('tool-dropcols')">Drop columns</button>
    </div>
  </div>
</div>
