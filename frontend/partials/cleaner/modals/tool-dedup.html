<!-- Remove duplicates — mirrors modal-tool-dedup in the live app
     (cleaner.html lines 808-831). Detect-by mode picks the dedup
     key; stats + samples populate from /api/files/:rid/dedup. -->
<div class="rp-modal-overlay" id="rp-modal-tool-dedup"
     onclick="closeModal('tool-dedup')" role="dialog" aria-modal="true">
  <div class="rp-modal rp-modal-md" onclick="event.stopPropagation()">
    <div class="rp-modal-hdr">
      <div>
        <h2 class="rp-modal-ttl"><i class="bi bi-copy"></i> Remove duplicates</h2>
        <div class="rp-modal-sub">Drop rows that repeat across the chosen key columns.</div>
      </div>
      <button class="rp-btn" onclick="closeModal('tool-dedup')" aria-label="Close" title="Close"><i class="bi bi-x-lg"></i></button>
    </div>

    <label class="rp-form-row">
      <span class="rp-form-lbl">Detect duplicates by</span>
      <!-- [data-tool-dedup-mode] — _populateToolModal paints:
           value="" (full-row) + one option per STATE.columns. On change
           cleanerDedupModeChanged() fires → _refreshDedupPreview hits
           /api/files/:rid/dedup with the new key and paints stats. -->
      <select class="rp-input" data-tool-dedup-mode onchange="cleanerDedupModeChanged()"></select>
    </label>

    <!-- Stats line — _refreshDedupPreview paints "N duplicate rows in
         K groups" into [data-tool-stats] when the dedup endpoint returns. -->
    <div class="rp-form-meta" data-tool-stats>
      Open + pick a key to scan.
    </div>

    <!-- Sample duplicate rows — _refreshDedupPreview paints into
         [data-tool-dedup-samples]. -->
    <div class="rp-form-row">
      <span class="rp-form-lbl">Sample duplicate groups</span>
      <div class="rp-scroll-list" data-tool-dedup-samples></div>
    </div>

    <div class="rp-modal-footer">
      <button class="btn btn-ghost" onclick="closeModal('tool-dedup')">Close</button>
      <button class="btn btn-primary" onclick="cleanerApplyTool('tool-dedup')">Remove duplicates</button>
    </div>
  </div>
</div>
