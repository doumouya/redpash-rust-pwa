<!-- Replace text — mirrors modal-tool-replacetext (live app
     cleaner.html lines 788-805). Column + find + replace. -->
<div class="rp-modal-overlay" id="rp-modal-tool-replacetext"
     onclick="closeModal('tool-replacetext')" role="dialog" aria-modal="true">
  <div class="rp-modal rp-modal-md" onclick="event.stopPropagation()">
    <div class="rp-modal-hdr">
      <div>
        <h2 class="rp-modal-ttl"><i class="bi bi-arrow-repeat"></i> Replace text</h2>
        <div class="rp-modal-sub">Find and replace a word or expression in string values.</div>
      </div>
      <button class="rp-btn" onclick="closeModal('tool-replacetext')" aria-label="Close" title="Close"><i class="bi bi-x-lg"></i></button>
    </div>

    <!-- Flagged columns — same surfacing as Remove text. Live app
         pulls counts from the column-quality scan. -->
    <div class="rp-form-meta" style="margin-bottom:0.375rem">
      <span class="rp-view-chip"><i class="bi bi-exclamation-diamond"></i>62 cells contain <code>#??!</code> across 4 cols</span>
      <span class="rp-view-chip"><i class="bi bi-exclamation-diamond"></i>11 cells contain <code>N/A</code></span>
    </div>

    <label class="rp-form-row">
      <span class="rp-form-lbl">Column</span>
      <select class="rp-input" data-sp-col>
        <option selected>Cause.intervention</option>
        <option>Type.d.energie</option>
        <option>Outil.d.assistance</option>
        <option>Client</option>
        <option>Formule</option>
      </select>
    </label>

    <div class="rp-2col">
      <label class="rp-form-row">
        <span class="rp-form-lbl">Find</span>
        <input type="text" class="rp-input" data-sp-find placeholder="search term…" />
      </label>
      <label class="rp-form-row">
        <span class="rp-form-lbl">Replace with</span>
        <input type="text" class="rp-input" data-sp-replace placeholder="leave blank to remove" />
      </label>
    </div>

    <!-- Live preview — spPreviewReplaceText runs the substitution on
         the column's distinct sample values. -->
    <div class="rp-form-row">
      <span class="rp-form-lbl rp-lbl-between">
        Preview
        <button type="button" class="btn btn-ghost btn-sm" onclick="spPreviewReplaceText(this)"><i class="bi bi-arrow-clockwise"></i> Compute</button>
      </span>
      <div data-sp-preview>
        <div class="rp-preview-line rp-form-meta">Type Find / Replace then click Compute.</div>
      </div>
    </div>

    <div class="rp-modal-footer">
      <button class="btn btn-ghost" onclick="closeModal('tool-replacetext')">Cancel</button>
      <button class="btn btn-primary" onclick="closeModal('tool-replacetext')">Replace values</button>
    </div>
  </div>
</div>
