<!-- Replace text — mirrors modal-tool-replacetext (live app
     cleaner.html lines 788-805). Column + find + replace. -->
<div class="rp-modal-overlay" id="rp-modal-tool-replacetext"
     onclick="closeModal('tool-replacetext')" role="dialog" aria-modal="true">
  <div class="rp-modal rp-modal-md" onclick="event.stopPropagation()">
    <div class="rp-modal-hdr">
      <div>
        <h2 class="rp-modal-ttl"><i class="bi bi-arrow-repeat"></i> Replace text</h2>
        <div class="rp-modal-sub">Find and replace a word or expression in string values.</div>
      </div>
      <button class="rp-btn" onclick="closeModal('tool-replacetext')" aria-label="Close" title="Close"><i class="bi bi-x-lg"></i></button>
    </div>

    <label class="rp-form-row">
      <span class="rp-form-lbl">Column</span>
      <select class="rp-input" data-tool-cols></select>
    </label>

    <div class="rp-2col">
      <label class="rp-form-row">
        <span class="rp-form-lbl">Find</span>
        <input type="text" class="rp-input" data-tool-find placeholder="search term…" />
      </label>
      <label class="rp-form-row">
        <span class="rp-form-lbl">Replace with</span>
        <input type="text" class="rp-input" data-tool-replace placeholder="leave blank to remove" />
      </label>
    </div>

    <div class="rp-modal-footer">
      <button class="btn btn-ghost" onclick="closeModal('tool-replacetext')">Cancel</button>
      <button class="btn btn-primary" onclick="cleanerApplyTool('tool-replacetext')">Replace values</button>
    </div>
  </div>
</div>
