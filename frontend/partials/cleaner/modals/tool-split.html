<!-- Split column — mirrors modal-tool-split (live app cleaner.html
     lines 710-726). Column + separator + new column names. -->
<div class="rp-modal-overlay" id="rp-modal-tool-split"
     onclick="closeModal('tool-split')" role="dialog" aria-modal="true">
  <div class="rp-modal rp-modal-md" onclick="event.stopPropagation()">
    <div class="rp-modal-hdr">
      <div>
        <h2 class="rp-modal-ttl"><i class="bi bi-scissors"></i> Split column</h2>
        <div class="rp-modal-sub">Divide one column into multiple by a separator.</div>
      </div>
      <button class="rp-btn" onclick="closeModal('tool-split')" aria-label="Close" title="Close"><i class="bi bi-x-lg"></i></button>
    </div>

    <label class="rp-form-row">
      <span class="rp-form-lbl">Column to split</span>
      <select class="rp-input" data-tool-cols></select>
    </label>

    <div class="rp-2col">
      <label class="rp-form-row">
        <span class="rp-form-lbl">Separator</span>
        <input type="text" class="rp-input" data-tool-sep value="/" />
      </label>
      <label class="rp-form-row">
        <span class="rp-form-lbl">New column names (comma-sep.)</span>
        <input type="text" class="rp-input" data-tool-into placeholder="col_a, col_b, col_c" />
      </label>
    </div>

    <div class="rp-modal-footer">
      <button class="btn btn-ghost" onclick="closeModal('tool-split')">Cancel</button>
      <button class="btn btn-primary" onclick="cleanerApplyTool('tool-split')">Split &amp; add columns</button>
    </div>
  </div>
</div>
