<!-- Save view as new file — quick rp-modal triggered by the header's
     "Save" button. The current view (visible columns + active
     filters + sort + selection) gets persisted as a NEW file in the
     project. Inert in the mockup; Pass D will POST to the backend
     and open the new file as a tab on success. -->
<div class="rp-modal-overlay" id="rp-modal-save-view"
     onclick="closeModal('save-view')" role="dialog" aria-modal="true">
  <div class="rp-modal rp-modal-sm" onclick="event.stopPropagation()">
    <div class="rp-modal-hdr">
      <div>
        <h2 class="rp-modal-ttl">Save view as new file</h2>
        <div class="rp-modal-sub">Persists what's currently visible — applied filters, hidden columns, sort — into a new file in this project.</div>
      </div>
      <button class="rp-btn" onclick="closeModal('save-view')" aria-label="Close" title="Close"><i class="bi bi-x-lg"></i></button>
    </div>

    <!-- Default value populated by JS on open from STATE.summary
         (active file's display_name + "_v2.csv" or similar suffix);
         placeholder shown when nothing's prefilled. Hardcoded sandbox
         demo value (raw_dossier_500_sentinels_v2.csv) was removed —
         users opening Save view in a fresh session would otherwise
         see someone else's filename pre-filled. -->
    <label class="rp-form-row">
      <span class="rp-form-lbl">New file name</span>
      <input type="text" class="rp-input" data-cleaner-save-view-name
             placeholder="new-file-name.csv"
             onkeydown="if (event.key==='Enter') { event.preventDefault(); closeModal('save-view'); }" />
    </label>

    <!-- Chips summarise what's about to be saved (visible-cols ratio,
         row count, filter count). Painted by JS on open from STATE
         (visibleCols / total cols, pageData.total or filtered count,
         savedFilters for current rid). Hardcoded sandbox values
         (14/17, 504 rows, 2 filters) were removed — they'd lie about
         the actual view being saved. -->
    <div class="rp-form-meta" data-cleaner-save-view-chips></div>

    <div class="rp-modal-footer">
      <button class="btn btn-ghost" onclick="closeModal('save-view')">Cancel</button>
      <button class="btn btn-primary" onclick="closeModal('save-view')">
        <i class="bi bi-cloud-arrow-up"></i> Save
      </button>
    </div>
  </div>
</div>
