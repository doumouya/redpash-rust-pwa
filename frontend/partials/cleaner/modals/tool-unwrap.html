<!-- Unwrap wrapped CSV — second entry point into the auto-unwrap flow.
     The first detection runs on upload (the wrapped-CSV banner above
     the table). When that auto-fix produces a clean multi-column
     frame, the banner disappears. If a tricky file slips through (mix
     of quote styles, separator drift, escape style), the user can
     re-trigger the same operation from here.

     Today the backend's `unwrap_csv` step ([backend/crates/data/src/
     steps.rs:142+]) is whole-file only and requires the frame to
     still be 1 column wide. Per-row straggler targeting is a future
     enhancement — see the sandbox-integration.md notes.

     _populateToolModal paints [data-tool-unwrap-status] on every open
     so the modal accurately reflects whether the current file can be
     re-unwrapped (1 col) or is already split (multi-col). -->
<div class="rp-modal-overlay" id="rp-modal-tool-unwrap"
     onclick="closeModal('tool-unwrap')" role="dialog" aria-modal="true">
  <div class="rp-modal" onclick="event.stopPropagation()">
    <div class="rp-modal-hdr">
      <div>
        <h2 class="rp-modal-ttl"><i class="bi bi-bandaid"></i> Unwrap wrapped CSV</h2>
        <div class="rp-modal-sub">Re-parse a single-column file whose values still contain CSV delimiters into proper columns.</div>
      </div>
      <button class="rp-btn" onclick="closeModal('tool-unwrap')" aria-label="Close" title="Close"><i class="bi bi-x-lg"></i></button>
    </div>

    <!-- Status block — _populateToolModal fills this with one of:
         (1-col / wrapped) "This file looks wrapped — 1 column, N rows,
                            header contains a separator. Click Re-run
                            unwrap to re-parse." → Apply enabled.
         (multi-col)        "This file is already split into N columns.
                            Use specific-row tools (replace text, drop
                            rows) for stragglers." → Apply disabled. -->
    <div class="rp-form-row">
      <div data-tool-unwrap-status>
        <div class="rp-form-meta" style="padding:0.5rem;font-style:italic">
          Open a file to see its unwrap status.
        </div>
      </div>
    </div>

    <!-- Future: per-row straggler picker + parse-hint overrides. The
         backend's unwrap_csv step takes no params today, so these
         controls don't exist yet. -->

    <div class="rp-modal-footer">
      <button class="btn btn-ghost" onclick="closeModal('tool-unwrap')">Cancel</button>
      <!-- cleanerApplyTool('tool-unwrap') → _readToolPayload returns
           { kind: "unwrap_csv", params: {} } → POST /files/:rid/steps.
           Backend errors with "only applies to a single-column
           DataFrame" if width != 1; that surfaces as a toast.
           _populateToolModal disables this button when the file is
           already multi-column so we avoid the round-trip. -->
      <button class="btn btn-primary" data-tool-unwrap-apply
              onclick="cleanerApplyTool('tool-unwrap')">
        <i class="bi bi-bandaid"></i> Re-run unwrap
      </button>
    </div>
  </div>
</div>
