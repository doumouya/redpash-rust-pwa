<!-- File table — structural wrapper only. The redtable engine
     (_paintSandboxTable in cleaner.js) renders the full <table> from
     /api/files/:rid/page response data into [data-cleaner-table-host].
     The outer .rp-rt-table-wrap carries [data-cleaner-table] purely as
     a show/hide handle (Overview tab hides it via _showSandboxOverview);
     the inner host is what gets innerHTML-wiped on each repaint, so the
     wrapped-CSV banner above survives.
     Render contract:
       JS replaces [data-cleaner-table-host] innerHTML with a complete
       <table class="rp-rt-table"> on every page / sort / filter change.
       Page info goes into [data-cleaner-rows-info]; page buttons into
       [data-cleaner-rows-pages]. -->
<div class="rp-rt-table-wrap" data-cleaner-table>
  <!-- File-issue banner: wrapped rows. _renderWrappedBanner toggles
       display based on _detectWrappedCsv() (1 col + header-has-sep +
       ≥70% rows-have-sep). Fix → tool-unwrap modal, which calls the
       backend's whole-file unwrap_csv step. data-file-scope hides it
       when Overview is the active tab. -->
  <div class="rp-rtp-fix-banner" id="cleaner-fix-wrapped"
       data-file-scope style="display:none">
    <i class="bi bi-exclamation-triangle"></i>
    <div class="rp-rtp-fix-banner-body">
      <div class="rp-rtp-fix-banner-ttl">Wrapped rows detected</div>
      <div class="rp-rtp-fix-banner-sub">Every row is double-quoted with internal quotes escaped — the file parses as one column.</div>
    </div>
    <button class="btn btn-primary btn-sm"
            onclick="cleanerOpenTool('tool-unwrap', this)">Fix</button>
  </div>
  <div data-cleaner-table-host>
    <!-- redtable engine paints here -->
  </div>
</div>
<div class="rp-rt-pager">
  <span class="rp-rt-rows-info" data-cleaner-rows-info>—</span>
  <span class="rp-rt-pages" data-cleaner-rows-pages></span>
</div>
