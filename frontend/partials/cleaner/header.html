<!-- Cleaner header — file-scoped workspace controls. Page chrome
     (back arrow + Profile / Docs / Theme) lives one row up in
     .rp-rt-topbar; this row stays focused on the active project +
     file (title, meta, cleanness, undo / redo / history / export /
     saved-settings / add file). JS populates the project + file
     labels, cleanness widget, and undo/redo enabled state from the
     live API; "—" placeholders mean "loading" / "no file picked".
     Data hooks:
       [data-cleaner-proj-name]     — current project name (left-of-dash title)
       [data-cleaner-file-name]     — active file display name (right-of-dash title)
       [data-cleaner-proj-meta]     — meta line ("3 files · last modified …")
       [data-cleaner-cleanness-lbl] — "File cleanness" / "Project cleanness"
       [data-cleaner-cleanness-fill]— width-driven progress bar fill
       [data-cleaner-cleanness-pct] — formatted percentage text
       [data-sp-undo] / [data-sp-redo] — buttons _spSyncUndoRedoButtons drives -->
<div class="rp-rt-header">
  <h2 class="rp-rt-title">
    <i class="bi bi-folder2-open"></i>
    <span data-cleaner-proj-name>—</span>
    <span class="rp-rt-title-sep">—</span>
    <i class="bi bi-file-earmark-text"></i>
    <span class="rp-rt-title-fname" data-cleaner-file-name
          onclick="if (this.isContentEditable) event.stopPropagation()">—</span>
  </h2>

  <div class="rp-rtp-hdr-info">
    <div class="rp-rtp-hdr-meta" data-cleaner-proj-meta>—</div>
  </div>

  <div class="rp-rt-hdr-actions">
    <div class="rp-rtp-overall">
      <span class="rp-rtp-overall-lbl" data-cleaner-cleanness-lbl>File cleanness</span>
      <div class="rp-rtp-overall-bar">
        <div class="rp-rtp-overall-fill" data-cleaner-cleanness-fill style="width:0%"></div>
      </div>
      <span class="rp-rtp-overall-pct" data-cleaner-cleanness-pct>—</span>
    </div>

    <!-- Undo / Redo — onclick fires the live cleanerUndo / cleanerRedo
         (POSTs /files/:rid/undo|redo, re-paints header + tabs + table +
         button state via the sandbox _afterHistory). data-sp-undo /
         data-sp-redo are selectors _syncUndoRedoButtons uses to set
         the disabled state from STATE.steps after every history mutation. -->
    <button class="rp-btn" title="Undo (Ctrl+Z)"
            data-sp-undo onclick="cleanerUndo()" disabled>
      <i class="bi bi-arrow-counterclockwise"></i>
    </button>
    <button class="rp-btn" title="Redo (Ctrl+Shift+Z)"
            data-sp-redo onclick="cleanerRedo()" disabled>
      <i class="bi bi-arrow-clockwise"></i>
    </button>
    <!-- History — cleanerOpenHistory paints the list from STATE.steps
         (newest first) THEN opens the modal, so the popover always
         reflects the active file's current history without an extra
         round-trip. Plain openModal would just show the empty mount
         on first click. -->
    <button class="rp-btn" title="View history"
            onclick="cleanerOpenHistory()">
      <i class="bi bi-clock-history"></i>
    </button>
    <!-- Export — cleanerExport fetches /files/:rid/export as a blob,
         triggers a transient <a download> so the browser saves the CSV
         under the server-suggested filename. data-cleaner-export is
         the selector the handler uses to add/remove a .is-spinning
         class while the fetch is in flight. -->
    <button class="rp-btn" title="Export current view"
            data-cleaner-export onclick="cleanerExport()">
      <i class="bi bi-download"></i>
    </button>
    <!-- Saved settings — cleanerOpenSavedSettings paints the per-file
         inspector list from STATE.savedFilters + STATE.filePrefs then
         opens the modal, so chips reflect the current snapshot even
         right after a filter save / mode change. -->
    <button class="rp-btn" title="See what's saved per tab"
            onclick="cleanerOpenSavedSettings()">
      <i class="bi bi-sliders"></i>
    </button>
    <!-- Add file — opens the new-project rp-modal with the active
         project's name pre-filled + locked, so spCleanerCreateProject's
         upload loop POSTs each file with that name. Backend
         ensure_named_project upserts so every dropped file lands in
         the same project regardless of how many uploads we make. -->
    <button class="rp-btn" aria-label="Add file to project" title="Add file"
            onclick="cleanerAddFile()">
      <i class="bi bi-plus"></i>
    </button>
  </div>
</div>
