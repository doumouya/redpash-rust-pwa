<!-- File-view toolbar. Buttons call into controls.js:
       spToggle('cleaner-filter-panel') — funnel opens / closes the
                                          left panel; close button in
                                          the panel itself calls the
                                          same helper.
       spSetMode(this)                  — mode triplet (edit/select/
                                          delete), one active at a time;
                                          re-click to clear.
       spToggleActive(this)             — single-button toggles (row-
                                          numbers, open-links, sync).
       spToggle('cleaner-tools-panel')  — right tools panel. -->
<div class="rp-rt-toolbar">
  <!-- Filter funnel is file-scoped (predicate filter on row data).
       Overview filters by typing in the search input — no structured
       filter needed. data-file-scope hides this on Overview. -->
  <button class="rp-btn" title="Filter"
          data-file-scope
          data-sp-panel-trigger="cleaner-filter-panel"
          onclick="spToggle('cleaner-filter-panel')">
    <i class="bi bi-funnel"></i>
  </button>
  <input class="rp-rt-search" type="search" placeholder="Search rows…" data-file-scope />

  <button type="button" class="rp-btn" data-sp-mode data-sp-mode-value="edit" data-file-scope title="Edit mode" onclick="spSetMode(this)">
    <i class="bi bi-pencil"></i>
  </button>
  <!-- Order is Edit / Select / [chip] / Delete. Select-mode produces
       the selection (chip updates live), Delete-mode IS the delete
       action — no separate bulk-delete button; clicking Delete with
       a non-zero selection deletes that batch. One trash icon, not
       two. data-count drives the chip's visibility (hidden at 0). -->
  <button type="button" class="rp-btn" data-sp-mode data-sp-mode-value="select" data-file-scope title="Select mode" onclick="spSetMode(this)">
    <i class="bi bi-check2-square"></i>
  </button>
  <span class="rp-rt-sel-chip" data-count="0" data-file-scope><i class="bi bi-check2-square"></i> 0 selected</span>
  <!-- Composite: spSetMode flips .is-mode-delete on the panel (and
       animates selected rows out if a selection exists, locally only).
       cleanerMaybeBulkDelete POSTs drop_rows with the selected global
       indices when STATE.selected is non-empty; no-op otherwise so the
       button still works as a plain mode toggle on empty selections. -->
  <button type="button" class="rp-btn" data-sp-mode data-sp-mode-value="delete" data-file-scope title="Delete mode (acts on selection when one exists)" onclick="spSetMode(this);cleanerMaybeBulkDelete()">
    <i class="bi bi-trash"></i>
  </button>

  <!-- Refresh — composite: spRefresh kicks the sandbox 600ms one-shot
       (instant click feedback), cleanerRefresh adds .is-spinning for
       the full fetch duration via the broadened CSS rule + re-paints
       via _paintSandboxTable. spRefresh's class removal at 600ms is
       harmless since the live half uses its own .is-spinning. -->
  <button class="rp-btn" data-file-scope title="Refresh" onclick="spRefresh(this);cleanerRefresh(this)">
    <i class="bi bi-arrow-clockwise"></i>
  </button>

  <!-- Row numbers — composite: spToggleRowNums flips is-active +
       drops .is-hide-rownums on the panel (CSS hides the # gutter);
       cleanerToggleRowNums persists STATE.showRowNums to prefs. -->
  <button type="button" class="rp-btn is-active" title="Show row numbers" aria-pressed="true" onclick="spToggleRowNums(this);cleanerToggleRowNums()">
    <i class="bi bi-list-ol"></i>
  </button>

  <!-- Report + Dashboard — anchors carry a placeholder href as the
       semantic fallback, but the onclick is the source of truth: it
       builds the real hash from STATE.rid / STATE.project and opens
       in a new tab. preventDefault + return false stop the placeholder
       href from also navigating. Report is per-file (data-file-scope);
       Dashboard is per-project (stays visible on Overview). -->
  <a class="rp-btn" href="#/reports" target="_blank" rel="noopener"
     data-file-scope
     title="New report from this file (opens in new tab)"
     onclick="return cleanerOpenReportForFile(event)">
    <i class="bi bi-bar-chart-fill"></i>
  </a>
  <a class="rp-btn" href="#/dashboards" target="_blank" rel="noopener"
     title="New dashboard for this project (opens in new tab)"
     onclick="return cleanerOpenDashboardForProject(event)">
    <i class="bi bi-grid-1x2-fill"></i>
  </a>

  <!-- Compute cleanness — composite: spClean spins the icon (sandbox
       affordance), cleanerScoreFile POSTs /files/:rid/cleanness and
       refreshes the header widget + file-tab data-cleanness via
       _afterHistory. -->
  <button class="rp-btn" data-file-scope title="Compute cleanness for this file" onclick="spClean(this);cleanerScoreFile(this)">
    <i class="bi bi-magic"></i>
  </button>
  <!-- Clear score deliberately removed: backend's hydrate() always
       recomputes cleanness on cache miss + writes it back to the DB
       (routes/files.rs hydrate line ~1174-1187), so a "clear" never
       persists — the next /files/:rid call (e.g. from
       _paintSandboxTable's refresh) reinstates a recomputed value
       within the same tick. Reintroducing a Clear button requires a
       backend change to make hydrate respect an explicit NULL in
       the DB. cleanerClearScore handler dropped alongside since
       nothing else calls it. -->

  <!-- Rows-per-page — composite on each item: spDdSelectRows flips
       the DD's is-selected + writes the visible rows-label; the live
       cleanerSetPageSize updates STATE.pageSize, resets STATE.page to
       1, persists the pref, and re-fetches /page with the new size. -->
  <!-- Rows-per-page — values mirror the legacy cleaner.live.html dropdown
       (10/25/50/100/500/1500/3000/5000), NOT the Objects-page set
       (10/25/50/100/250) that this partial accidentally inherited when
       the dropdown component was copy-pasted. Cleaning workflows hit
       large CSVs; users want bigger pages. Default selected = 25
       (matches _OV_DEFAULT_PAGE_SIZE in cleaner.js). _PAGE_SIZE_MAX
       caps at 5000, so the last option is the "max" label. -->
  <div class="rp-dd-wrap" data-file-scope>
    <button class="rp-rt-pill-btn" title="Rows per page" onclick="spDdToggle(this)">
      <span data-sp-rows-label>25</span><span class="rp-rt-pill-unit"> rows</span>
      <i class="bi bi-chevron-down"></i>
    </button>
    <div class="rp-dd-menu" role="menu">
      <div class="rp-dd-item"             onclick="spDdSelectRows(this, 10);cleanerSetPageSize(10)">10 rows</div>
      <div class="rp-dd-item is-selected" onclick="spDdSelectRows(this, 25);cleanerSetPageSize(25)">25 rows</div>
      <div class="rp-dd-item"             onclick="spDdSelectRows(this, 50);cleanerSetPageSize(50)">50 rows</div>
      <div class="rp-dd-item"             onclick="spDdSelectRows(this, 100);cleanerSetPageSize(100)">100 rows</div>
      <div class="rp-dd-item"             onclick="spDdSelectRows(this, 500);cleanerSetPageSize(500)">500 rows</div>
      <div class="rp-dd-item"             onclick="spDdSelectRows(this, 1500);cleanerSetPageSize(1500)">1500 rows</div>
      <div class="rp-dd-item"             onclick="spDdSelectRows(this, 3000);cleanerSetPageSize(3000)">3000 rows</div>
      <div class="rp-dd-item"             onclick="spDdSelectRows(this, 5000);cleanerSetPageSize(5000)">5k rows (max)</div>
    </div>
  </div>

  <!-- Columns picker — checkbox per column, listed in DB order (the
       backend's canonical schema order). User can hide / show via the
       checkboxes and (in the live app) drag to reorder. The Reset
       button restores DB order + makes all columns visible — that's
       the escape hatch when a user rearranges past the point of
       remembering what the default was. Mockup checks are inert;
       Pass D toggles real STATE.hiddenCols + repaints the table. -->
  <div class="rp-dd-wrap" data-file-scope>
    <button class="rp-btn" title="Columns" onclick="spDdToggle(this)">
      <i class="bi bi-layout-three-columns"></i>
    </button>
    <div class="rp-dd-menu" role="menu" style="min-width:8.5rem">
      <button type="button" class="rp-dd-reset" title="Restore DB order + show all columns"
              onclick="spColsReset(this)">
        <i class="bi bi-arrow-counterclockwise"></i> Reset to DB order
      </button>
      <!-- One .rp-dd-checkbox per column, painted by JS from the
           active file's columns_meta. Order = DB order; checked = visible. -->
      <div data-cleaner-cols-picker></div>
    </div>
  </div>

  <!-- Sync — composite: spToggleSync flips is-sync-on on the panel
       (CSS outlines synced fields); cleanerToggleSync persists
       STATE.linkToolbar. Cross-tab propagation of search/page-size
       lands when those handlers are migrated. -->
  <button type="button" class="rp-btn" title="Sync search + rows-per-page across file tabs" onclick="spToggleSync(this);cleanerToggleSync()">
    <i class="bi bi-link-45deg"></i>
  </button>

  <!-- Tools panel is file-scoped (operates on the active file's rows /
       columns / dtypes). Hidden on Overview where no file is selected. -->
  <button class="rp-btn" title="Cleaning tools" style="margin-left:auto"
          data-file-scope
          data-sp-panel-trigger="cleaner-tools-panel"
          onclick="spToggle('cleaner-tools-panel')">
    <i class="bi bi-tools"></i>
  </button>
</div>
