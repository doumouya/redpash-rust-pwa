<!-- Left side-panel — overlays the table edge when .open is on the panel.
     Structure: sticky header | scrollable .rp-rt-filter-content | sticky footer.
     File-scoped — hidden on the Overview tab via .is-overview-active. -->
<div class="rp-rt-filter-panel" id="cleaner-filter-panel" data-file-scope>
  <div class="rp-rt-filter-inner">

    <!-- Sticky header: title + clear + save + close × -->
    <!-- Clear / Save composites: spClickFx is the sandbox press-pulse
         (visual feedback); cleanerClearFilterDraft empties predicate
         rows back to one fresh-empty seed; cleanerSaveFilter prompts
         for a name + persists to STATE.savedFilters[rid] + the
         cleaner_saved_filters pref (visible from the saved-settings
         modal next time it opens). -->
    <div class="rp-rt-filter-hdr">
      <span class="rp-rt-panel-hdr">Filter rows</span>
      <button class="rp-btn" title="Clear all predicates" style="margin-left:auto"
              onclick="spClickFx(this);cleanerClearFilterDraft(this)">
        <i class="bi bi-eraser"></i>
      </button>
      <button class="rp-btn" title="Save filter"
              onclick="spClickFx(this);cleanerSaveFilter(this)">
        <i class="bi bi-floppy"></i>
      </button>
      <button class="rp-btn" title="Close panel"
              onclick="document.getElementById('cleaner-filter-panel').classList.remove('open')">
        <i class="bi bi-x-lg"></i>
      </button>
    </div>

    <!-- Scrollable content -->
    <div class="rp-rt-filter-content">

      <!-- Combinator toggle — single-active pair. data-combo carries
           the value the (future) apply handler reads. cleanerSetCombo
           flips .is-active across the pair on click. -->
      <div class="rp-rt-fb-op-toggle" data-cleaner-fb-combo>
        <button type="button" class="is-active" data-combo="and" onclick="cleanerSetCombo(this)">AND</button>
        <button type="button" data-combo="or"  onclick="cleanerSetCombo(this)">OR</button>
      </div>

      <div class="rp-rt-fb-rows">
        <!-- Predicate row: column (full width) → op + value (side by side).
             spFbAddPredicate clones this row; spFbRmPredicate handles the ×. -->
        <!-- Predicate template row — col + op are CUSTOM dropdowns
             (.rp-dd-wrap + spDdToggle), not native <select>, so the
             open popup matches the toolbar's .rp-dd-menu look (frosted
             glass, opacity transition). Native <select> popup is
             OS-rendered and uncusto­misable across browsers.
             _populateFilterPredicates fills the .rp-dd-menu children
             with .rp-dd-item per column / op after each _paintSandboxTable.
             data-fb-col / data-fb-op marker attrs (now on the wrap, not
             a select) let the populator + (future) apply handler target
             the right widget; the chosen value lives in `data-value` on
             the wrap, the visible label in [data-dd-lbl]. cleanerFbDdPick
             handles item clicks (label + data-value + close); the Add
             Predicate button uses cleanerFbAddPredicate (replaces sandbox
             spFbAddPredicate's clone+selectedIndex reset, which doesn't
             know about our custom widgets). -->
        <div class="rp-rt-fb-row">
          <button class="rp-rt-fb-rm" title="Remove predicate"
                  onclick="event.stopPropagation();spFbRmPredicate(this)">
            <i class="bi bi-x"></i>
          </button>
          <div class="rp-dd-wrap rp-rt-fb-col" data-fb-col data-value="">
            <button type="button" class="rp-rt-fb-dd-btn" onclick="spDdToggle(this)">
              <span data-dd-lbl>Column…</span>
              <i class="bi bi-chevron-down"></i>
            </button>
            <div class="rp-dd-menu" role="menu"></div>
          </div>
          <div class="rp-rt-fb-selects">
            <div class="rp-dd-wrap rp-rt-fb-op" data-fb-op data-value="">
              <button type="button" class="rp-rt-fb-dd-btn" onclick="spDdToggle(this)">
                <span data-dd-lbl>Op…</span>
                <i class="bi bi-chevron-down"></i>
              </button>
              <div class="rp-dd-menu" role="menu"></div>
            </div>
            <input type="text" class="rp-rt-fb-val" data-fb-val placeholder="value" />
          </div>
        </div>
      </div>

      <!-- Add Predicate uses cleanerFbAddPredicate (not sandbox
           spFbAddPredicate) because the latter clones the seed row
           + does `clone.querySelectorAll("select").selectedIndex = 0`
           to reset, which is a no-op on our custom .rp-dd-wrap widgets
           (they're <div>+<button>, not <select>). Ours also resets the
           wrap's data-value + label + closes any open .rp-dd-menu so
           the fresh row is genuinely empty. -->
      <button type="button" class="rp-rt-fb-add" onclick="cleanerFbAddPredicate(this)">
        <i class="bi bi-plus-lg"></i> Add predicate
      </button>

      <!-- Filter / select columns — collapsible section. -->
      <div class="rp-rt-panel-sect open" onclick="spToggleSection(this)" style="margin-top:0.25rem">
        <span class="rp-rt-panel-sect-lbl">Filter / select columns</span>
        <i class="bi bi-chevron-down rp-rt-panel-sect-chevron"></i>
      </div>
      <div class="rp-rt-panel-sect-body open">
        <label class="rp-form-row">
          <span class="rp-form-lbl">Name pattern (regex)</span>
          <input type="text" class="rp-input" placeholder="e.g. TOP.* or date.*" />
        </label>

        <!-- One .rp-dd-checkbox per column, painted by JS from the
             active file's columns_meta. Checked = visible / selected
             after Apply. -->
        <div class="rp-form-row" data-cleaner-filter-cols
             style="display:flex;flex-direction:column;gap:0.1875rem;max-height:11rem;overflow-y:auto"></div>

        <div style="display:flex;justify-content:flex-end;margin-top:0.5rem">
          <button class="btn btn-ghost btn-sm" onclick="spClickFx(this)">
            <i class="bi bi-funnel-fill"></i> Keep matched columns
          </button>
        </div>
      </div>

    </div><!-- /.rp-rt-filter-content -->

    <!-- Sticky footer: Apply — composite onclick collects every
         predicate row (col + op + value) into the filter_rows step
         payload, POSTs /files/:rid/steps, pipes the envelope through
         _afterHistory so the table repaints with the filtered rows +
         the step lands in the undo stack. .is-spinning on the button
         covers the round-trip; cleanerApplyFilter toggles disabled
         to prevent double-fire. -->
    <div class="rp-rt-filter-footer">
      <button class="btn btn-ghost btn-sm" onclick="spClickFx(this);cleanerApplyFilter(this)">
        <i class="bi bi-funnel"></i> Apply
      </button>
    </div>

  </div>
</div>
