<!-- File tabs — structural skeleton. JS appends one .rp-rtp-tab per file
     in the active project, between the Overview tab and the trailing
     + add wrap. Overview is permanent (no ×) — it's the project-level
     summary view; file tabs come and go as the user opens/closes them
     (persisted via prefs.cleaner_hidden_files).
     Render contract:
       JS inserts <button class="rp-rtp-tab" data-file-id="FIL_…" …>
       elements before .rp-tab-add-wrap; existing tabs get cleared on
       each project switch. -->
<div class="rp-rtp-tabs">
  <div class="rp-rtp-tabs-inner" data-cleaner-file-tabs>
    <!-- Composite onclick: sandbox spActivateTab flips .active visually
         on this tab + clears it from siblings. Live cleanerActivateTab('')
         (empty fid sentinel = Overview) clears STATE.rid, swaps body
         visibility ([data-cleaner-overview] in, [data-cleaner-table] out),
         repaints the header from project-level data, and paints the
         file-list overview via _paintSandboxOverview. -->
    <button class="rp-rtp-tab" type="button" data-is-overview onclick="spActivateTab(this);cleanerActivateTab('')">
      <i class="bi bi-folder2-open"></i>
      <span class="rp-rtp-tab-name">Overview</span>
    </button>

    <!-- File tabs injected here by JS -->

    <!-- spOpenFilePicker re-fetches the active project's files before
         opening, so newly-uploaded files (or files closed since mount)
         show up correctly in the picker. -->
    <span class="rp-tab-add-wrap">
      <button class="rp-tab-add" type="button" aria-label="Open another file" title="Open another file"
              onclick="spOpenFilePicker(this)">
        <i class="bi bi-plus-lg"></i>
      </button>
      <!-- Inline picker dropdown — replaced the open-file modal. A search
           field + a scroll-capped (~6-row) list of project files not yet
           open as tabs. spOpenFilePicker re-fetches, populates, and opens. -->
      <div class="rp-tab-add-menu rp-tab-add-menu--pick" role="menu">
        <div class="rp-tab-add-hdr">Open a file</div>
        <input class="rp-rt-search rp-tab-add-search" type="search"
               placeholder="Filter files…" oninput="spFilterTabAdd(this)" />
        <div class="rp-tab-add-items" data-cleaner-file-picker></div>
        <!-- Footer action — carries over the open-file modal's "upload"
             button. Sits OUTSIDE .rp-tab-add-items so it stays pinned
             below the ~6-row scroll window. -->
        <div class="rp-tab-add-item rp-tab-add-foot" role="menuitem"
             onclick="spAddFilesToCurrentProject()">
          <i class="bi bi-cloud-upload"></i>
          <span>Upload files to this project…</span>
        </div>
      </div>
    </span>
  </div>
</div>
