<!-- Right side-panel — overlay, same mechanic as filter panel.
     Structure: sticky header | scrollable .rp-rtp-tools-content.
     Only "Cleaning Tools" section is open by default; others collapsed.
     File-scoped — hidden on Overview via .is-overview-active. -->
<div class="rp-rtp-tools" id="cleaner-tools-panel" data-file-scope>
  <div class="rp-rtp-tools-inner">

    <!-- Sticky header: title + close × -->
    <div class="rp-rt-panel-hdr-bar">
      <span class="rp-rt-panel-hdr">Cleaning tools</span>
      <button class="rp-btn" title="Close panel" style="margin-left:auto"
              onclick="document.getElementById('cleaner-tools-panel').classList.remove('open')">
        <i class="bi bi-x-lg"></i>
      </button>
    </div>

    <!-- Scrollable content -->
    <div class="rp-rtp-tools-content">

      <!-- Dataset-level audit — always visible, above any section. -->
      <button class="rp-rtp-tools-top" onclick="openModal('tool-inspect', this)">
        <i class="bi bi-clipboard-data"></i>
        <span>Inspect dataset</span>
        <span class="rp-form-meta" style="margin-left:auto">overall audit + cleanup suggestions</span>
      </button>

      <!-- Cleaning Tools — open by default. -->
      <div class="rp-rt-panel-sect open" onclick="spToggleSection(this)">
        <span class="rp-rt-panel-sect-lbl">Cleaning Tools</span>
        <i class="bi bi-chevron-down rp-rt-panel-sect-chevron"></i>
      </div>
      <div class="rp-rt-panel-sect-body open">
        <div class="rp-rtp-ct-grid">
          <button class="rp-rtp-ct-btn" title="Remove duplicates"   onclick="openModal('tool-dedup',    this)"><i class="bi bi-copy"></i><span class="rp-rtp-ct-btn-lbl">Remove duplicates</span></button>
          <button class="rp-rtp-ct-btn" title="Fill missing values" onclick="openModal('tool-fill',     this)"><i class="bi bi-pencil-fill"></i><span class="rp-rtp-ct-btn-lbl">Fill missing values</span></button>
          <button class="rp-rtp-ct-btn" title="Fix invalid values"  onclick="openModal('tool-invalid',  this)"><i class="bi bi-wrench-adjustable"></i><span class="rp-rtp-ct-btn-lbl">Fix invalid values</span></button>
          <button class="rp-rtp-ct-btn" title="Format dates"        onclick="openModal('tool-dates',    this)"><i class="bi bi-calendar3"></i><span class="rp-rtp-ct-btn-lbl">Format dates</span></button>
          <button class="rp-rtp-ct-btn" title="Drop empty rows"     onclick="openModal('tool-droprows', this)"><i class="bi bi-file-minus"></i><span class="rp-rtp-ct-btn-lbl">Drop empty rows</span></button>
          <button class="rp-rtp-ct-btn" title="Unwrap rows"         onclick="openModal('tool-unwrap',   this)"><i class="bi bi-bandaid"></i><span class="rp-rtp-ct-btn-lbl">Unwrap rows</span></button>
        </div>
      </div>

      <!-- Column Names — collapsed by default. -->
      <div class="rp-rt-panel-sect" onclick="spToggleSection(this)">
        <span class="rp-rt-panel-sect-lbl">Column Names</span>
        <i class="bi bi-chevron-down rp-rt-panel-sect-chevron"></i>
      </div>
      <div class="rp-rt-panel-sect-body">
        <div class="rp-rtp-ct-grid">
          <button class="rp-rtp-ct-btn" title="Rename column"    onclick="openModal('tool-rename',       this)"><i class="bi bi-cursor-text"></i><span class="rp-rtp-ct-btn-lbl">Rename column</span></button>
          <button class="rp-rtp-ct-btn" title="Snake_case all"   onclick="openModal('tool-snake',        this)"><i class="bi bi-braces"></i><span class="rp-rtp-ct-btn-lbl">Snake_case all</span></button>
          <button class="rp-rtp-ct-btn" title="Replace in names" onclick="openModal('tool-replacenames', this)"><i class="bi bi-tag"></i><span class="rp-rtp-ct-btn-lbl">Replace in names</span></button>
          <button class="rp-rtp-ct-btn" title="Change case"      onclick="openModal('tool-changecase',   this)"><i class="bi bi-fonts"></i><span class="rp-rtp-ct-btn-lbl">Change case</span></button>
          <button class="rp-rtp-ct-btn" title="Drop columns"     onclick="openModal('tool-dropcols',     this)"><i class="bi bi-dash-square"></i><span class="rp-rtp-ct-btn-lbl">Drop columns</span></button>
        </div>
      </div>

      <!-- String Ops — collapsed by default. -->
      <div class="rp-rt-panel-sect" onclick="spToggleSection(this)">
        <span class="rp-rt-panel-sect-lbl">String Ops</span>
        <i class="bi bi-chevron-down rp-rt-panel-sect-chevron"></i>
      </div>
      <div class="rp-rt-panel-sect-body">
        <div class="rp-rtp-ct-grid">
          <button class="rp-rtp-ct-btn" title="Split column"   onclick="openModal('tool-split',       this)"><i class="bi bi-scissors"></i><span class="rp-rtp-ct-btn-lbl">Split column</span></button>
          <button class="rp-rtp-ct-btn" title="Join columns"   onclick="openModal('tool-joinco',      this)"><i class="bi bi-link-45deg"></i><span class="rp-rtp-ct-btn-lbl">Join columns</span></button>
          <button class="rp-rtp-ct-btn" title="Remove text"    onclick="openModal('tool-removetext',  this)"><i class="bi bi-eraser"></i><span class="rp-rtp-ct-btn-lbl">Remove text</span></button>
          <button class="rp-rtp-ct-btn" title="Find in values" onclick="openModal('tool-find',        this)"><i class="bi bi-search"></i><span class="rp-rtp-ct-btn-lbl">Find in values</span></button>
          <button class="rp-rtp-ct-btn" title="Replace text"   onclick="openModal('tool-replacetext', this)"><i class="bi bi-arrow-repeat"></i><span class="rp-rtp-ct-btn-lbl">Replace text</span></button>
        </div>
      </div>

      <!-- Data Types — collapsed by default, with coloured badges. -->
      <div class="rp-rt-panel-sect" onclick="spToggleSection(this)">
        <span class="rp-rt-panel-sect-lbl">Data Types</span>
        <i class="bi bi-chevron-down rp-rt-panel-sect-chevron"></i>
      </div>
      <div class="rp-rt-panel-sect-body">
        <div class="rp-rtp-dtype-row">
          <span class="rp-rtp-dtype-name">Numero_dossier_ID</span>
          <span class="rp-rtp-dtype-badge is-text">text</span>
        </div>
        <div class="rp-rtp-dtype-row">
          <span class="rp-rtp-dtype-name">Client</span>
          <span class="rp-rtp-dtype-badge is-text">text</span>
        </div>
        <div class="rp-rtp-dtype-row">
          <span class="rp-rtp-dtype-name">date.ouverture</span>
          <span class="rp-rtp-dtype-badge is-date">date</span>
        </div>
        <div class="rp-rtp-dtype-row">
          <span class="rp-rtp-dtype-name">date.de.survenance</span>
          <span class="rp-rtp-dtype-badge is-date">date</span>
        </div>
        <div class="rp-rtp-dtype-row">
          <span class="rp-rtp-dtype-name">TOP.D.R</span>
          <span class="rp-rtp-dtype-badge is-mixed">mixed</span>
        </div>
      </div>

      <!-- Join Preparation — collapsed by default. -->
      <div class="rp-rt-panel-sect" onclick="spToggleSection(this)">
        <span class="rp-rt-panel-sect-lbl">Join Preparation</span>
        <i class="bi bi-chevron-down rp-rt-panel-sect-chevron"></i>
      </div>
      <div class="rp-rt-panel-sect-body">
        <div class="rp-rtp-join-file">
          <div class="rp-rtp-join-file-hdr"><i class="bi bi-file-earmark-text"></i> raw_dossier_500_sentinels.csv</div>
          <div class="rp-rtp-join-items">
            <button class="rp-rtp-join-item">
              <span class="rp-rtp-join-cols">
                <span class="rp-rtp-join-col">Numero_dossier_ID</span>
                <i class="bi bi-arrow-left-right"></i>
                <span class="rp-rtp-join-col">Numero_dossier_ID</span>
              </span>
              <span class="rp-rtp-join-meta">
                <span class="rp-rtp-join-score">98%</span>
                <span class="rp-rtp-join-matches">493 matches</span>
              </span>
            </button>
            <button class="rp-rtp-join-item">
              <span class="rp-rtp-join-cols">
                <span class="rp-rtp-join-col">Matricule.de.traitement</span>
                <i class="bi bi-arrow-left-right"></i>
                <span class="rp-rtp-join-col">Matricule.de.traitement</span>
              </span>
              <span class="rp-rtp-join-meta">
                <span class="rp-rtp-join-score">72%</span>
                <span class="rp-rtp-join-matches">362 matches</span>
              </span>
            </button>
          </div>
        </div>
      </div>

    </div><!-- /.rp-rtp-tools-content -->

  </div>
</div>
