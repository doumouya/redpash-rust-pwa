<!-- Project tab strip — sits ABOVE the header. Active project tab gets
     an underline indicator (box-shadow inset); switching is animated
     via CSS transitions on background/color/box-shadow. Click any tab
     to activate it; the × close stops propagation so a close doesn't
     also activate. The + opens the open-project rp-modal.
     Real data — em.doumouya owns 2 projects: Clients Clean + sentinel. -->
<div class="rp-rt-proj-tabs">
  <div class="rp-rt-proj-tabs-inner">
    <!-- data-sp-project-key matches a sibling [data-project="…"] wrapper
         in index.html — spActivateTab toggles `hidden` to swap which
         project's header + file-tabs + table is on-screen. Keys are
         kebab-case so they double as folder names under projects/. -->
    <button class="rp-rt-proj-tab" type="button" data-sp-project-key="clients-clean" onclick="spActivateTab(this)">
      <i class="bi bi-folder2-open"></i>
      <span class="rp-rt-proj-tab-name">Clients Clean</span>
      <span class="rp-rt-proj-tab-x" title="Close" onclick="event.stopPropagation();spDeleteTab(this)"><i class="bi bi-x"></i></span>
    </button>
    <button class="rp-rt-proj-tab active" type="button" data-sp-project-key="sentinel" onclick="spActivateTab(this)">
      <i class="bi bi-folder2-open"></i>
      <span class="rp-rt-proj-tab-name">sentinel</span>
      <span class="rp-rt-proj-tab-x" title="Close" onclick="event.stopPropagation();spDeleteTab(this)"><i class="bi bi-x"></i></span>
    </button>
    <!-- + opens the open-project rp-modal — same pattern as the file-tabs
         +. A modal scales past the ~6-item dropdown sweet spot: 20+
         projects per user is realistic, and the picker wants search
         + per-project meta (file count · last opened) that doesn't
         fit a 13rem inline menu. Shares the .rp-tab-add-wrap / .rp-tab-add
         classes with the file-tabs + (single tab-strip add family). -->
    <!-- spOpenProjectPicker re-fetches /api/projects before opening, so
         the picker reflects the current open / closed split (closing a
         tab then re-hitting + needs to show that project as openable). -->
    <span class="rp-tab-add-wrap">
      <button class="rp-tab-add" type="button" aria-label="Open another project" title="Open another project"
              onclick="spOpenProjectPicker()">
        <i class="bi bi-plus-lg"></i>
      </button>
    </span>
  </div>
</div>
