<!-- Objects toolbar — same structure as the cleaner toolbar.
     File-scoped buttons (row numbers, cleanness compute, sync, tools panel)
     are omitted; everything else maps 1:1. Handlers are kind-implicit —
     they'll read currentKind from objects.js when state wiring lands. -->
<div class="rp-rt-toolbar">

  <button class="rp-btn" title="Filter"
          data-sp-panel-trigger="objects-filter-panel"
          onclick="spToggle('objects-filter-panel')">
    <i class="bi bi-funnel"></i>
  </button>

  <input class="rp-rt-search" type="search" placeholder="Search objects…" />

  <button type="button" class="rp-btn" data-sp-mode data-sp-mode-value="edit"
          title="Edit mode" onclick="spSetMode(this)">
    <i class="bi bi-pencil"></i>
  </button>
  <button type="button" class="rp-btn" data-sp-mode data-sp-mode-value="select"
          title="Select mode" onclick="spSetMode(this)">
    <i class="bi bi-check2-square"></i>
  </button>
  <span class="rp-rt-sel-chip" data-count="0">
    <i class="bi bi-check2-square"></i> 0 selected
  </span>
  <button type="button" class="rp-btn" data-sp-mode data-sp-mode-value="delete"
          title="Delete mode (acts on selection when one exists)" onclick="spSetMode(this)">
    <i class="bi bi-trash"></i>
  </button>

  <button class="rp-btn" title="Refresh" onclick="spRefresh(this)">
    <i class="bi bi-arrow-clockwise"></i>
  </button>

  <div class="rp-dd-wrap">
    <button class="rp-rt-pill-btn" title="Rows per page" onclick="spDdToggle(this)">
      <span data-sp-rows-label>25</span><span class="rp-rt-pill-unit"> rows</span>
      <i class="bi bi-chevron-down"></i>
    </button>
    <div class="rp-dd-menu" role="menu">
      <div class="rp-dd-item"             onclick="spDdSelectRows(this, 10)">10 rows</div>
      <div class="rp-dd-item is-selected" onclick="spDdSelectRows(this, 25)">25 rows</div>
      <div class="rp-dd-item"             onclick="spDdSelectRows(this, 50)">50 rows</div>
      <div class="rp-dd-item"             onclick="spDdSelectRows(this, 100)">100 rows</div>
      <div class="rp-dd-item"             onclick="spDdSelectRows(this, 250)">250 rows</div>
    </div>
  </div>

  <div class="rp-dd-wrap">
    <button class="rp-rt-pill-btn" title="Date format" onclick="spDdToggle(this)">
      <i class="bi bi-calendar3" style="font-size:0.75rem;margin-right:0.2rem"></i>
      <span>Relative</span>
      <i class="bi bi-chevron-down"></i>
    </button>
    <div class="rp-dd-menu" role="menu">
      <div class="rp-dd-item is-selected">Relative</div>
      <div class="rp-dd-item">Date</div>
      <div class="rp-dd-item">Date &amp; time</div>
    </div>
  </div>

  <div class="rp-dd-wrap">
    <button class="rp-btn" title="Columns" onclick="spDdToggle(this)">
      <i class="bi bi-layout-three-columns"></i>
    </button>
    <div class="rp-dd-menu" role="menu" style="min-width:8.5rem">
      <button type="button" class="rp-dd-reset" title="Restore default columns"
              onclick="spColsReset(this)">
        <i class="bi bi-arrow-counterclockwise"></i> Reset to default
      </button>
      <!-- Live JS will paint per-kind columns here when wired; the
           sandbox demo's hardcoded labels are a Projects-tab stub. -->
      <label class="rp-dd-checkbox"><input type="checkbox" checked /> Name</label>
      <label class="rp-dd-checkbox"><input type="checkbox" checked /> Stage</label>
      <label class="rp-dd-checkbox"><input type="checkbox" checked /> Status</label>
      <label class="rp-dd-checkbox"><input type="checkbox" checked /> Cleanness</label>
      <label class="rp-dd-checkbox"><input type="checkbox" checked /> Files</label>
      <label class="rp-dd-checkbox"><input type="checkbox" checked /> Created</label>
      <label class="rp-dd-checkbox"><input type="checkbox" checked /> Modified</label>
    </div>
  </div>

</div>
