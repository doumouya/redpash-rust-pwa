<!-- Objects toolbar — same structure as the cleaner toolbar.
     File-scoped buttons (row numbers, cleanness compute, sync, tools panel)
     are omitted; everything else maps 1:1. Handlers are kind-implicit —
     they'll read currentKind from objects.js when state wiring lands. -->
<div class="rp-rt-toolbar">

  <button class="rp-btn" title="Filter"
          data-sp-panel-trigger="objects-filter-panel"
          onclick="spToggle('objects-filter-panel')">
    <i class="bi bi-funnel"></i>
  </button>

  <!-- Search input with the same autocomplete grammar as predicate
       value inputs — wraps the input + a sibling [data-objects-search-menu]
       (.rp-rt-fb-dd-menu styled) for the distinct-values suggestion popup.
       objectsSearchInput drives both the row filter (STATE[kind].search +
       repaint via _objMatchesSearch) and the suggestion menu paint. -->
  <div class="rp-rt-search-wrap">
    <input class="rp-rt-search" type="search" placeholder="Search objects…"
           oninput="objectsSearchInput(this)" onfocus="objectsSearchInput(this)" />
    <div class="rp-rt-fb-dd-menu" data-objects-search-menu></div>
  </div>

  <button type="button" class="rp-btn" data-sp-mode data-sp-mode-value="edit"
          title="Edit mode" onclick="spSetMode(this)">
    <i class="bi bi-pencil"></i>
  </button>
  <button type="button" class="rp-btn" data-sp-mode data-sp-mode-value="select"
          title="Select mode" onclick="spSetMode(this)">
    <i class="bi bi-check2-square"></i>
  </button>
  <span class="rp-rt-sel-chip" data-count="0">
    <i class="bi bi-check2-square"></i> 0 selected
  </span>
  <!-- Delete-mode button composite: spSetMode handles the visual fade
       + undo push when there's a selection; objectsMaybeBulkDelete
       fires the actual /api DELETE so the rows don't reappear on
       refresh. Empty-selection click is a plain mode toggle (both
       handlers no-op on empty selection). -->
  <button type="button" class="rp-btn" data-sp-mode data-sp-mode-value="delete"
          title="Delete mode (acts on selection when one exists)"
          onclick="spSetMode(this);objectsMaybeBulkDelete()">
    <i class="bi bi-trash"></i>
  </button>

  <!-- Refresh — composite: spRefresh kicks the sandbox 600ms one-shot
       (instant click feedback), objectsRefresh adds .is-spinning for
       the full fetch duration + force-refreshes the kind's list cache
       through getCached.fresh, then repaints via _objLoadAndPaint. -->
  <button class="rp-btn" title="Refresh" onclick="spRefresh(this);objectsRefresh(this)">
    <i class="bi bi-arrow-clockwise"></i>
  </button>

  <div class="rp-dd-wrap">
    <button class="rp-rt-pill-btn" title="Rows per page" onclick="spDdToggle(this)">
      <span data-sp-rows-label>25</span><span class="rp-rt-pill-unit"> rows</span>
      <i class="bi bi-chevron-down"></i>
    </button>
    <!-- Composite onclick: spDdSelectRows = sandbox visual (label + tick);
         objectsSetRows = live state (STATE[kind].rowsPerPage + repaint
         + persist to prefs.objects_views via _persistObjView). Without
         the live half, picking a new rows-per-page was visual-only and
         Profile/Settings would still show the previous saved view. -->
    <div class="rp-dd-menu" role="menu">
      <div class="rp-dd-item"             onclick="spDdSelectRows(this, 10);objectsSetRows(this, 10)">10 rows</div>
      <div class="rp-dd-item is-selected" onclick="spDdSelectRows(this, 25);objectsSetRows(this, 25)">25 rows</div>
      <div class="rp-dd-item"             onclick="spDdSelectRows(this, 50);objectsSetRows(this, 50)">50 rows</div>
      <div class="rp-dd-item"             onclick="spDdSelectRows(this, 100);objectsSetRows(this, 100)">100 rows</div>
      <div class="rp-dd-item"             onclick="spDdSelectRows(this, 250);objectsSetRows(this, 250)">250 rows</div>
    </div>
  </div>

  <div class="rp-dd-wrap">
    <!-- Date format — `dateFmt` module global drives every cell that
         renders an ISO date (fmtDate in objects.js). Items call
         objectsSetDateFmt with the format key (matches _DATE_FMT_LABEL
         in objects.js); legacy used [data-rt-datefmt-label] + a
         different markup tree — sandbox uses [data-sp-datefmt-label]. -->
    <button class="rp-rt-pill-btn" title="Date format" onclick="spDdToggle(this)">
      <i class="bi bi-calendar3" style="font-size:0.75rem;margin-right:0.2rem"></i>
      <span data-sp-datefmt-label>Date &amp; time</span>
      <i class="bi bi-chevron-down"></i>
    </button>
    <div class="rp-dd-menu" role="menu">
      <div class="rp-dd-item"             onclick="objectsSetDateFmt(this, 'relative')">Relative</div>
      <div class="rp-dd-item"             onclick="objectsSetDateFmt(this, 'date')">Date</div>
      <div class="rp-dd-item is-selected" onclick="objectsSetDateFmt(this, 'datetime')">Date &amp; time</div>
    </div>
  </div>

  <div class="rp-dd-wrap">
    <button class="rp-btn" title="Columns" onclick="spDdToggle(this);objectsBuildColsDropdown(window.objectsActiveKind?.())">
      <i class="bi bi-layout-three-columns"></i>
    </button>
    <div class="rp-dd-menu" role="menu" style="min-width:8.5rem">
      <button type="button" class="rp-dd-reset" title="Restore default columns"
              onclick="objectsResetCols()">
        <i class="bi bi-arrow-counterclockwise"></i> Reset to default
      </button>
      <!-- Live JS paints per-kind .rp-dd-checkbox items here from the
           active SCHEMAS[kind].columns + STATE[kind].visibleCols.
           Rebuilt on every tab switch and every dropdown open so the
           list always matches the current tab. -->
      <div data-sp-cols-picker></div>
    </div>
  </div>

</div>
