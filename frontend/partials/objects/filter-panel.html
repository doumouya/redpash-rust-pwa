<!-- Objects filter panel — predicate builder. Live JS:
       objectsBuildFilterPanel(kind) — paints per-kind column dropdown
         options on each tab switch + initial mount.
       objectsApplyFilter()           — collects predicates, populates
         objPredicates / objCombinator, repaints via paintObjectsSandboxTable.
       objectsClearFilter()           — resets predicates + repaints.
       objectsAddPredicate() / objectsRemovePredicate(btn) — add / remove rows.
     [data-objects-filter-rows] is the container the JS reads + writes.
     Each row carries [data-fb-col] (column key) + [data-fb-op] + [data-fb-val]
     so _objRowMatchesFilter (legacy helper, kind-agnostic) can evaluate. -->
<div class="rp-rt-filter-panel" id="objects-filter-panel">
  <div class="rp-rt-filter-inner">

    <!-- Sticky header -->
    <div class="rp-rt-filter-hdr">
      <span class="rp-rt-panel-hdr">Filter objects</span>
      <button class="rp-btn" title="Clear all predicates" style="margin-left:auto"
              onclick="objectsClearFilter()">
        <i class="bi bi-eraser"></i>
      </button>
      <button class="rp-btn" title="Close panel"
              onclick="document.getElementById('objects-filter-panel').classList.remove('open')">
        <i class="bi bi-x-lg"></i>
      </button>
    </div>

    <!-- Scrollable content -->
    <div class="rp-rt-filter-content">

      <div class="rp-rt-fb-op-toggle" data-objects-filter-combo>
        <button type="button" class="is-active" data-combo="and"
                onclick="objectsSetFilterCombo(this)">AND</button>
        <button type="button" data-combo="or"
                onclick="objectsSetFilterCombo(this)">OR</button>
      </div>

      <!-- One predicate row is auto-painted by objectsBuildFilterPanel(kind);
           more can be added via the + button below. -->
      <div class="rp-rt-fb-rows" data-objects-filter-rows></div>

      <button type="button" class="rp-rt-fb-add" onclick="objectsAddPredicate()">
        <i class="bi bi-plus-lg"></i> Add predicate
      </button>

    </div><!-- /.rp-rt-filter-content -->

    <div class="rp-rt-filter-footer">
      <button class="btn btn-ghost btn-sm" onclick="objectsApplyFilter()">
        <i class="bi bi-funnel"></i> Apply
      </button>
    </div>

  </div>
</div>
