<!-- Object-type tab strip — render target only.
     State-driven: live's objects.js owns currentKind + the per-tab catalog
     and writes tabs into the inner container. The sandbox stand-in
     spRenderObjectTabs (controls.js) renders a hardcoded 6-type list
     into #obj-tabs the first time spInit sees this strip — useful for
     the visual port; the live mount can overwrite when wiring lands.
     Min-1 enforcement (no × on the last tab) is handled by the renderer. -->
<div class="rp-rt-proj-tabs">
  <div class="rp-rt-proj-tabs-inner" id="obj-tabs"></div>
</div>
