<!-- Projects header — title + meta + export + new project.
     No cleanness bar or undo/redo — this is a browse surface.
     [data-objects-meta] is the live JS render target for the row count
     line; sandbox demo's hardcoded "6 projects · 16 files total" is a
     visual placeholder until wiring lands. -->
<div class="rp-rt-header">
  <h2 class="rp-rt-title">
    <i class="bi bi-folder2"></i> My Projects
  </h2>
  <div class="rp-rtp-hdr-info">
    <div class="rp-rtp-hdr-meta" data-objects-meta>6 projects · 16 files total</div>
  </div>
  <div class="rp-rt-hdr-actions">
    <button class="rp-btn" title="Export current view as CSV">
      <i class="bi bi-download"></i>
    </button>
    <button class="rp-btn" title="New project" onclick="openModal('new-project')">
      <i class="bi bi-plus"></i>
    </button>
  </div>
</div>
