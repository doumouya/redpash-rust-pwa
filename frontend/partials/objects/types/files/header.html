<!-- Files header — all files across all projects. -->
<div class="rp-rt-header">
  <h2 class="rp-rt-title">
    <i class="bi bi-file-earmark-text"></i> Files
  </h2>
  <div class="rp-rtp-hdr-info">
    <div class="rp-rtp-hdr-meta" data-objects-meta>16 files across 6 projects</div>
  </div>
  <div class="rp-rt-hdr-actions">
    <button class="rp-btn" title="Export current view as CSV"
            onclick="objExport()">
      <i class="bi bi-download"></i>
    </button>
    <!-- Files schema has no addAction/addHref, so objAdd falls through
         to _objOpenUploadModal — the programmatic dropzone + project
         picker that hits /api/files/upload with project_name (the
         backend's ensure_named_project upsert handles new-vs-existing). -->
    <button class="rp-btn" title="Import new file" onclick="objAdd()">
      <i class="bi bi-plus"></i>
    </button>
  </div>
</div>
