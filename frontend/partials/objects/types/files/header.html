<!-- Files header — all files across all projects. -->
<div class="rp-rt-header">
  <h2 class="rp-rt-title">
    <i class="bi bi-file-earmark-text"></i> Files
  </h2>
  <div class="rp-rtp-hdr-info">
    <div class="rp-rtp-hdr-meta" data-objects-meta>16 files across 6 projects</div>
  </div>
  <div class="rp-rt-hdr-actions">
    <button class="rp-btn" title="Export current view as CSV">
      <i class="bi bi-download"></i>
    </button>
    <button class="rp-btn" title="Import new file">
      <i class="bi bi-plus"></i>
    </button>
  </div>
</div>
