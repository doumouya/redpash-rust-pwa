<!-- Dashboards table — sandbox sample rows for visual port.
     Columns: select | Name | Reports | Created | Modified | Actions. -->
<div class="rp-rt-table-wrap" data-objects-table="dashboards">
  <table class="rp-rt-table">
    <thead>
      <tr>
        <th class="rp-rt-th-mode" style="width:1.5rem">
          <input type="checkbox" onclick="spSelectAllRows(this)" />
          <i class="bi bi-circle rp-row-uncheck"></i>
          <i class="bi bi-check2-circle rp-row-check"></i>
          <i class="bi bi-trash rp-row-trash rp-master-trash"></i>
        </th>
        <th class="rp-rt-th-sortable" style="min-width:10rem">Name <i class="bi bi-arrow-down-up rp-rt-sort-ico"></i></th>
        <th class="rp-rt-th-sortable">Reports <i class="bi bi-arrow-down-up rp-rt-sort-ico"></i></th>
        <th class="rp-rt-th-sortable">Created <i class="bi bi-arrow-down-up rp-rt-sort-ico"></i></th>
        <th class="rp-rt-th-sortable">Modified <i class="bi bi-arrow-down-up rp-rt-sort-ico"></i></th>
        <th class="rp-rt-th-mode" style="width:5rem"></th>
      </tr>
    </thead>
    <tbody>
      <tr onclick="spToggleRowSel(this)">
        <td><input type="checkbox" /><i class="bi bi-circle rp-row-uncheck"></i><i class="bi bi-check2-circle rp-row-check"></i><i class="bi bi-trash rp-row-trash"></i></td>
        <td><a class="rp-obj-name" href="#"><i class="bi bi-layout-wtf"></i> Q4 overview</a></td>
        <td>3</td><td>2 weeks ago</td><td>today</td>
        <td class="rp-rt-actions">
          <a class="rp-btn rp-btn-xs" href="#/cleaner" title="Open project in cleaner" onclick="event.stopPropagation()"><i class="bi bi-magic"></i></a>
          <a class="rp-btn rp-btn-xs" href="#/reports" title="New report for this project" onclick="event.stopPropagation()"><i class="bi bi-bar-chart-fill"></i></a>
          <a class="rp-btn rp-btn-xs" href="#/dashboards" title="Open this dashboard" onclick="event.stopPropagation()"><i class="bi bi-grid-1x2-fill"></i></a>
        </td>
      </tr>
      <tr onclick="spToggleRowSel(this)">
        <td><input type="checkbox" /><i class="bi bi-circle rp-row-uncheck"></i><i class="bi bi-check2-circle rp-row-check"></i><i class="bi bi-trash rp-row-trash"></i></td>
        <td><a class="rp-obj-name" href="#"><i class="bi bi-layout-wtf"></i> HR monthly</a></td>
        <td>2</td><td>3 days ago</td><td>today</td>
        <td class="rp-rt-actions">
          <a class="rp-btn rp-btn-xs" href="#/cleaner" title="Open project in cleaner" onclick="event.stopPropagation()"><i class="bi bi-magic"></i></a>
          <a class="rp-btn rp-btn-xs" href="#/reports" title="New report for this project" onclick="event.stopPropagation()"><i class="bi bi-bar-chart-fill"></i></a>
          <a class="rp-btn rp-btn-xs" href="#/dashboards" title="Open this dashboard" onclick="event.stopPropagation()"><i class="bi bi-grid-1x2-fill"></i></a>
        </td>
      </tr>
    </tbody>
  </table>
</div>
<div class="rp-rt-pager">
  <div class="rp-rt-rows-info" data-objects-rows-info>Showing 1–2 of 2 dashboards</div>
  <div class="rp-rt-pages" data-objects-pages></div>
</div>
