<!-- Reports header — saved reports list. -->
<div class="rp-rt-header">
  <h2 class="rp-rt-title">
    <i class="bi bi-bar-chart-line"></i> Reports
  </h2>
  <div class="rp-rtp-hdr-info">
    <div class="rp-rtp-hdr-meta" data-objects-meta>4 reports</div>
  </div>
  <div class="rp-rt-hdr-actions">
    <button class="rp-btn" title="Export list"
            onclick="objExport()">
      <i class="bi bi-download"></i>
    </button>
    <a class="rp-btn" href="#/reports?new=1" title="New report">
      <i class="bi bi-plus"></i>
    </a>
  </div>
</div>
