<!-- Users header — users list. Read-only browse in dev. -->
<div class="rp-rt-header">
  <h2 class="rp-rt-title">
    <i class="bi bi-people"></i> Users
  </h2>
  <div class="rp-rtp-hdr-info">
    <div class="rp-rtp-hdr-meta" data-objects-meta>4 users</div>
  </div>
  <div class="rp-rt-hdr-actions">
    <button class="rp-btn" title="Export list"
            onclick="objExport()">
      <i class="bi bi-download"></i>
    </button>
    <!-- New-user creation is dev-only today (Phase 4 OAuth handles
         real account minting); the button stays for visual parity
         with the other tabs but has no destination yet. -->
    <button class="rp-btn" title="New user (dev-only, not wired yet)" disabled>
      <i class="bi bi-plus"></i>
    </button>
  </div>
</div>
