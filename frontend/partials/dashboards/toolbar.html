<!-- Dashboards toolbar — slim row above the canvas.
     Dashboards LAYOUT existing charts (created on the /reports page);
     they don't build charts themselves. So the toolbar has no source-
     file picker (charts carry their own data binding); just template
     + add-widget + open / save / export. -->
<div class="rp-rt-toolbar">

  <!-- Template — predefined CSS-grid layout that defines the slots. -->
  <div class="rp-dd-wrap">
    <button class="rp-rt-pill-btn" title="Template" onclick="spDdToggle(this)">
      <i class="bi bi-grid-3x2-gap" style="font-size:0.75rem;margin-right:0.2rem"></i>
      <span data-dashboards-template-label>Hero + pair</span>
      <i class="bi bi-chevron-down"></i>
    </button>
    <div class="rp-dd-menu" role="menu" data-dashboards-template-picker>
      <div class="rp-dd-item"             data-template="single">Single panel</div>
      <div class="rp-dd-item"             data-template="two-col">Two columns</div>
      <div class="rp-dd-item"             data-template="three-up">Three-up</div>
      <div class="rp-dd-item is-selected" data-template="hero-pair">Hero + pair</div>
      <div class="rp-dd-item"             data-template="four-grid">2×2 grid</div>
    </div>
  </div>

  <input class="rp-rt-search" type="search" placeholder="Filter widgets in this dashboard…"
         data-dashboards-search />

  <!-- + Widget — opens the chart-picker modal (a gallery of charts the
       user has already created via /reports). For non-chart widgets
       (stat / list / text) the picker has a "blank widget" path. -->
  <button class="rp-btn" type="button" aria-label="Add widget" title="Add widget"
          onclick="openModal('pick-chart')">
    <i class="bi bi-plus-lg"></i>
  </button>

  <!-- Show / hide the floating tools window. Mirrors cleaner's panel
       trigger pattern (body :has() rule in glass-btn.css lights this
       button while its panel is .open). -->
  <button class="rp-btn" type="button" aria-label="Toggle tools window" title="Tools"
          data-sp-panel-trigger="dashboards-tools-window"
          onclick="spToggle('dashboards-tools-window')">
    <i class="bi bi-sliders"></i>
  </button>

  <!-- Open another dashboard from the picker. -->
  <button class="rp-btn" type="button" aria-label="Open another dashboard"
          title="Open another dashboard"
          style="margin-left:auto"
          onclick="openModal('open-dashboard')">
    <i class="bi bi-collection"></i>
  </button>

  <!-- Save / Export — wired in Phase 2. -->
  <button class="rp-btn" type="button" aria-label="Save dashboard" title="Save dashboard"
          data-dashboards-save>
    <i class="bi bi-floppy"></i>
  </button>
  <button class="rp-btn" type="button" aria-label="Export PNG" title="Export PNG"
          data-dashboards-export>
    <i class="bi bi-download"></i>
  </button>

</div>
