<!-- Floating tools window — draggable, collapsible.
     Dashboards are PURE LAYOUT — charts are created on /reports and
     imported here. So this window's job is:
       • Slots — list of active slots in the current template; click
         a slot row to focus its widget below.
       • Widget kind — chart-from-report / stat / list / text / image.
         "Chart from report" is the default (the most common widget
         and the only one with library content to pick from).
       • Chart library — gallery of existing charts (across the user's
         reports), grouped by report. Shown only when widget kind =
         "chart from report". Click a chart card to bind it to the
         active slot. Filter input scopes the gallery by chart title /
         report title.
       • Override — optional per-slot tweaks (title override, hide
         legend, color theme). Doesn't change the chart's data
         binding (that lives on the report).
     Open / close mirrors the cleaner tools-panel mechanic via
     spToggle('dashboards-tools-window'). -->
<div class="rp-dashboards__tools-window" id="dashboards-tools-window"
     role="dialog" aria-label="Dashboard tools">

  <header class="rp-dashboards__tools-hdr" data-dashboards-tools-drag>
    <i class="bi bi-sliders"></i>
    <span class="rp-dashboards__tools-ttl">Dashboard tools</span>
    <button class="rp-btn rp-btn-xs" type="button"
            title="Collapse"
            style="margin-left:auto"
            data-dashboards-tools-collapse>
      <i class="bi bi-dash-lg"></i>
    </button>
    <button class="rp-btn rp-btn-xs" type="button" title="Close"
            onclick="document.getElementById('dashboards-tools-window').classList.remove('open')">
      <i class="bi bi-x-lg"></i>
    </button>
  </header>

  <div class="rp-dashboards__tools-body">

    <!-- Slots — one row per slot in the active template. -->
    <section class="rp-dashboards__tools-sect">
      <header class="rp-dashboards__tools-sect-hdr">
        <i class="bi bi-grid-3x2-gap"></i> Slots
      </header>
      <div class="rp-dashboards__slots" data-dashboards-slots-list>
        <button class="rp-dashboards__slot is-selected" type="button" data-slot="hero">
          <span class="rp-dashboards__slot-key">hero</span>
          <span class="rp-dashboards__slot-name">Monthly revenue</span>
          <i class="bi bi-bar-chart-fill"></i>
        </button>
        <button class="rp-dashboards__slot" type="button" data-slot="kpi-1">
          <span class="rp-dashboards__slot-key">kpi-1</span>
          <span class="rp-dashboards__slot-name">Active projects</span>
          <i class="bi bi-graph-up-arrow"></i>
        </button>
        <button class="rp-dashboards__slot" type="button" data-slot="kpi-2">
          <span class="rp-dashboards__slot-key">kpi-2</span>
          <span class="rp-dashboards__slot-name">Recent files</span>
          <i class="bi bi-clock-history"></i>
        </button>
      </div>
    </section>

    <!-- Widget kind — what this slot holds. "Chart" pulls from the
         reports library below; non-chart kinds are configured inline. -->
    <section class="rp-dashboards__tools-sect">
      <header class="rp-dashboards__tools-sect-hdr">
        <i class="bi bi-collection"></i> Widget kind
      </header>
      <div class="rp-set-opt-grp" data-dashboards-widget-kind>
        <button type="button" class="rp-set-opt active" data-kind="chart"><i class="bi bi-bar-chart-fill bi-sm"></i> Chart</button>
        <button type="button" class="rp-set-opt"        data-kind="stat"><i class="bi bi-graph-up-arrow bi-sm"></i> Stat</button>
        <button type="button" class="rp-set-opt"        data-kind="list"><i class="bi bi-list-ul bi-sm"></i> List</button>
        <button type="button" class="rp-set-opt"        data-kind="text"><i class="bi bi-text-paragraph bi-sm"></i> Text</button>
        <button type="button" class="rp-set-opt"        data-kind="image"><i class="bi bi-image bi-sm"></i> Image</button>
      </div>
    </section>

    <!-- Chart library — gallery of existing charts. JS populates from
         /api/reports (each report's charts surface as cards). Hidden
         when widget kind ≠ "chart". The toolbar's +Widget button opens
         the same gallery as a fullscreen modal for browse-and-pick. -->
    <section class="rp-dashboards__tools-sect" data-dashboards-chart-library>
      <header class="rp-dashboards__tools-sect-hdr">
        <i class="bi bi-grid-fill"></i> Pick a chart
        <a class="rp-dashboards__tools-sect-link" href="#/reports"
           title="Create a new chart on the Reports page">
          new chart <i class="bi bi-arrow-up-right"></i>
        </a>
      </header>
      <input type="search" class="rp-input rp-input--sm"
             placeholder="Filter charts by title or report…"
             data-dashboards-chart-search style="margin-bottom:0.375rem" />
      <div class="rp-dashboards__chart-gallery" data-dashboards-chart-gallery>

        <!-- Each chart card = thumbnail + title + source report. Click
             to bind to the active slot. The thumbnail is a tiny SVG
             of the chart's primary geometry (bar / line / pie / area /
             scatter) — JS renders it from the chart spec on the
             server. Sample cards below for the visual port. -->

        <button type="button" class="rp-dashboards__chart-card is-bound" data-chart-id="CHT_sample1">
          <span class="rp-dashboards__chart-thumb">
            <svg viewBox="0 0 60 36" aria-hidden="true">
              <rect x="6"  y="22" width="6" height="12" fill="currentColor" opacity="0.6"/>
              <rect x="16" y="16" width="6" height="18" fill="currentColor" opacity="0.7"/>
              <rect x="26" y="10" width="6" height="24" fill="currentColor" opacity="0.85"/>
              <rect x="36" y="14" width="6" height="20" fill="currentColor" opacity="0.7"/>
              <rect x="46" y="8"  width="6" height="26" fill="currentColor"/>
            </svg>
          </span>
          <span class="rp-dashboards__chart-card-ttl">Monthly revenue</span>
          <span class="rp-dashboards__chart-card-src">Sentinel · bar</span>
        </button>

        <button type="button" class="rp-dashboards__chart-card" data-chart-id="CHT_sample2">
          <span class="rp-dashboards__chart-thumb">
            <svg viewBox="0 0 60 36" aria-hidden="true">
              <polyline points="4,28 14,20 24,24 34,12 44,16 54,6"
                        fill="none" stroke="currentColor" stroke-width="1.75"/>
              <circle cx="14" cy="20" r="1.5" fill="currentColor"/>
              <circle cx="24" cy="24" r="1.5" fill="currentColor"/>
              <circle cx="34" cy="12" r="1.5" fill="currentColor"/>
              <circle cx="44" cy="16" r="1.5" fill="currentColor"/>
              <circle cx="54" cy="6"  r="1.5" fill="currentColor"/>
            </svg>
          </span>
          <span class="rp-dashboards__chart-card-ttl">Trend (cumulative)</span>
          <span class="rp-dashboards__chart-card-src">Sentinel · line</span>
        </button>

        <button type="button" class="rp-dashboards__chart-card" data-chart-id="CHT_sample3">
          <span class="rp-dashboards__chart-thumb">
            <svg viewBox="0 0 60 36" aria-hidden="true">
              <path d="M30,4 a14,14 0 0,1 13.86,12 L30,18 Z" fill="currentColor"/>
              <path d="M30,4 a14,14 0 0,0 -13.86,12 L30,18 Z" fill="currentColor" opacity="0.6"/>
              <path d="M16.14,16 a14,14 0 0,0 27.72,0 L30,18 Z" fill="currentColor" opacity="0.35"/>
            </svg>
          </span>
          <span class="rp-dashboards__chart-card-ttl">Status split</span>
          <span class="rp-dashboards__chart-card-src">Customer onboarding · pie</span>
        </button>

        <button type="button" class="rp-dashboards__chart-card" data-chart-id="CHT_sample4">
          <span class="rp-dashboards__chart-thumb">
            <svg viewBox="0 0 60 36" aria-hidden="true">
              <path d="M2,30 L12,22 L22,26 L32,14 L42,18 L52,8 L58,12 L58,34 L2,34 Z"
                    fill="currentColor" opacity="0.55"/>
              <polyline points="2,30 12,22 22,26 32,14 42,18 52,8 58,12"
                        fill="none" stroke="currentColor" stroke-width="1.5"/>
            </svg>
          </span>
          <span class="rp-dashboards__chart-card-ttl">Q4 invoice breakdown</span>
          <span class="rp-dashboards__chart-card-src">Vendor invoices · area</span>
        </button>

        <button type="button" class="rp-dashboards__chart-card" data-chart-id="CHT_sample5">
          <span class="rp-dashboards__chart-thumb">
            <svg viewBox="0 0 60 36" aria-hidden="true">
              <rect x="6"  y="6"  width="6" height="28" fill="currentColor" opacity="0.85"/>
              <rect x="6"  y="6"  width="6" height="10" fill="currentColor" opacity="0.4"/>
              <rect x="16" y="12" width="6" height="22" fill="currentColor" opacity="0.85"/>
              <rect x="16" y="12" width="6" height="8"  fill="currentColor" opacity="0.4"/>
              <rect x="26" y="4"  width="6" height="30" fill="currentColor" opacity="0.85"/>
              <rect x="26" y="4"  width="6" height="14" fill="currentColor" opacity="0.4"/>
              <rect x="36" y="14" width="6" height="20" fill="currentColor" opacity="0.85"/>
              <rect x="36" y="14" width="6" height="6"  fill="currentColor" opacity="0.4"/>
              <rect x="46" y="8"  width="6" height="26" fill="currentColor" opacity="0.85"/>
              <rect x="46" y="8"  width="6" height="12" fill="currentColor" opacity="0.4"/>
            </svg>
          </span>
          <span class="rp-dashboards__chart-card-ttl">HR attrition (stacked)</span>
          <span class="rp-dashboards__chart-card-src">HR Records 2024 · stacked-bar</span>
        </button>

        <button type="button" class="rp-dashboards__chart-card" data-chart-id="CHT_sample6">
          <span class="rp-dashboards__chart-thumb">
            <svg viewBox="0 0 60 36" aria-hidden="true">
              <g fill="currentColor">
                <circle cx="10" cy="22" r="1.5"/>
                <circle cx="18" cy="14" r="2"/>
                <circle cx="24" cy="28" r="1.2"/>
                <circle cx="30" cy="10" r="2.5"/>
                <circle cx="36" cy="24" r="1.8"/>
                <circle cx="42" cy="18" r="1.2"/>
                <circle cx="48" cy="8"  r="2"/>
                <circle cx="54" cy="22" r="1.5"/>
              </g>
            </svg>
          </span>
          <span class="rp-dashboards__chart-card-ttl">Spend vs volume</span>
          <span class="rp-dashboards__chart-card-src">Q4 Sales · scatter</span>
        </button>

      </div>
    </section>

    <!-- Override — per-slot tweaks that don't change the chart's
         data binding. Title override + a couple of toggles. -->
    <section class="rp-dashboards__tools-sect">
      <header class="rp-dashboards__tools-sect-hdr">
        <i class="bi bi-pencil-square"></i> Slot override
      </header>
      <div class="rp-form-row">
        <label class="rp-form-lbl" for="dw-title">Title override <span class="rp-form-meta">(optional)</span></label>
        <input id="dw-title" type="text" class="rp-input"
               placeholder="Leave empty to use the chart's own title" />
      </div>
      <div class="rp-form-row">
        <label class="rp-form-lbl">Display</label>
        <div class="rp-set-opt-grp">
          <button type="button" class="rp-set-opt active" data-show="legend">Legend</button>
          <button type="button" class="rp-set-opt active" data-show="title">Title</button>
          <button type="button" class="rp-set-opt"        data-show="grid">Grid lines</button>
        </div>
      </div>
    </section>

  </div>
</div>
