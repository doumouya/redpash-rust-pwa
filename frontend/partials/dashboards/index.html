<!-- Dashboards composition root — Full canvas + floating tools layout.

     Topbar: back / Dashboards title / cleaner / objects / profile / theme.
     Panel structure:
       toolbar         — slim row with source / template / +widget / save
       body            — positioning context for canvas + tools window
         canvas        — absolute, fills body; CSS-grid laid out per template
         tools window  — absolute, bottom-right by default; draggable header
       modals          — open-dashboard picker, new-dashboard creator
     The floating tools window covers part of the canvas by design — the
     user reorders it to focus on whichever slot they're configuring. -->

<div class="rp-rt-topbar">
  <a class="rp-btn" href="#/home" aria-label="Back to Home" title="Back to Home">
    <i class="bi bi-arrow-left"></i>
  </a>
  <h1 class="rp-rt-page-title"><i class="bi bi-grid-1x2-fill"></i> Dashboards</h1>
  <a class="rp-btn" href="#/cleaner" aria-label="Open Cleaner" title="Open Cleaner"
     style="margin-left:auto">
    <i class="bi bi-magic"></i>
  </a>
  <a class="rp-btn" href="#/objects" aria-label="Open Objects" title="Open Objects">
    <i class="bi bi-grid-3x3-gap"></i>
  </a>
  <a class="rp-btn" href="#/reports" aria-label="Open Reports" title="Open Reports">
    <i class="bi bi-bar-chart-line"></i>
  </a>
  <a class="rp-btn" href="#/profile" aria-label="Profile" title="Profile">
    <i class="bi bi-person-circle"></i>
  </a>
  <button class="rp-btn" type="button" aria-label="Toggle theme" title="Toggle theme"
          onclick="rpToggleTheme?.()">
    <i class="bi bi-moon" data-sp-theme-icon></i>
  </button>
</div>

<div class="rp-rt-panel">

  <div data-include="./toolbar.html"></div>

  <div class="rp-rt-body">
    <!-- Full-bleed canvas — JS paints the grid + tiles from STATE.dashboard.
         Sample tiles below demonstrate the layout for the visual port. -->
    <div data-include="./canvas.html"></div>

    <!-- Floating tools window — draggable header, collapsible body.
         Default position bottom-right via CSS; JS rewrites inline
         style.top/left when the user drags. -->
    <div data-include="./tools-window.html"></div>

    <!-- Modals (loaded ahead so openModal can find them). -->
    <div data-include="./modals/new-dashboard.html"></div>
    <div data-include="./modals/open-dashboard.html"></div>
    <div data-include="./modals/pick-chart.html"></div>
  </div>
</div>
