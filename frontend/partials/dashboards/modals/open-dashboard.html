<!-- Open dashboard — picker grid populated by JS from /api/dashboards.
     Each card opens the dashboard in the canvas + closes the modal.
     Footer's cloud-upload kicks off the new-dashboard flow as a
     shortcut from inside the picker (same pattern as cleaner's
     open-project → new-project chain). -->
<div class="rp-modal-overlay" id="rp-modal-open-dashboard"
     onclick="closeModal('open-dashboard')" role="dialog" aria-modal="true">
  <div class="rp-modal rp-modal-md" onclick="event.stopPropagation()">
    <div class="rp-modal-hdr">
      <div>
        <h2 class="rp-modal-ttl">Open dashboard</h2>
        <div class="rp-modal-sub">Pick a saved dashboard to load into the canvas.</div>
      </div>
      <button class="rp-btn" onclick="closeModal('open-dashboard')" aria-label="Close" title="Close">
        <i class="bi bi-x-lg"></i>
      </button>
    </div>

    <input type="search" class="rp-input" placeholder="Filter dashboards…" />

    <div class="rp-pick-grid" data-dashboards-picker>
      <div class="rp-form-meta" style="padding:1rem;text-align:center;font-style:italic">
        Loading dashboards…
      </div>
    </div>

    <div class="rp-modal-footer">
      <button class="rp-btn" aria-label="New dashboard"
              title="New dashboard" style="margin-right:auto"
              onclick="closeModal('open-dashboard');openModal('new-dashboard')">
        <i class="bi bi-plus-lg"></i>
      </button>
      <button class="btn btn-ghost" onclick="closeModal('open-dashboard')">Close</button>
    </div>
  </div>
</div>
