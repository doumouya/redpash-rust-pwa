<!-- New dashboard — minimal form: name + template starter.
     Submit creates the dashboard on the backend (POST /api/dashboards)
     and switches the canvas to the new dashboard's empty grid. -->
<div class="rp-modal-overlay" id="rp-modal-new-dashboard"
     onclick="closeModal('new-dashboard')" role="dialog" aria-modal="true">
  <div class="rp-modal rp-modal-md" onclick="event.stopPropagation()">
    <div class="rp-modal-hdr">
      <div>
        <h2 class="rp-modal-ttl">New dashboard</h2>
        <div class="rp-modal-sub">Name + a starting template. You can change the template later from the toolbar.</div>
      </div>
      <button class="rp-btn" onclick="closeModal('new-dashboard')"
              aria-label="Close" title="Close">
        <i class="bi bi-x-lg"></i>
      </button>
    </div>

    <div class="rp-form-row">
      <label class="rp-form-lbl" for="nd-name">Dashboard name</label>
      <input id="nd-name" type="text" class="rp-input"
             placeholder="e.g. Q4 overview" maxlength="120" required />
    </div>

    <div class="rp-form-row">
      <label class="rp-form-lbl">Starting template</label>
      <div class="rp-set-opt-grp" id="nd-template">
        <button type="button" class="rp-set-opt active" data-template="single">Single panel</button>
        <button type="button" class="rp-set-opt"        data-template="two-col">Two columns</button>
        <button type="button" class="rp-set-opt"        data-template="three-up">Three-up</button>
        <button type="button" class="rp-set-opt"        data-template="hero-pair">Hero + pair</button>
        <button type="button" class="rp-set-opt"        data-template="four-grid">2×2 grid</button>
      </div>
    </div>

    <div class="rp-modal-footer">
      <button class="btn btn-ghost" onclick="closeModal('new-dashboard')">Cancel</button>
      <button class="btn btn-primary" onclick="closeModal('new-dashboard')">Create dashboard</button>
    </div>
  </div>
</div>
