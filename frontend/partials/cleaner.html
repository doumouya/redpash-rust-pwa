<!-- Cleaner page — sandbox markup composed via data-include.
     Phase 2 of the prerelease frontend rewrite: this thin shell replaces
     the historical 1011-line monolith (preserved in git history
     for reference). The full cleaner UI lives under /partials/cleaner/*
     as a tree of small partials loaded recursively by /scripts/include.js.

     JS bridge: /scripts/pages/cleaner.js's mount() must await
     window.rpInclude(root) before it queries the DOM, because partials
     load asynchronously after the router injects this shell.

     Bootstrap Icons loaded per-partial (matches home/landing/objects/
     profile — index.html doesn't include it globally). Open Sans is the
     sandbox body font (Light 300 default) — load it here so the cleaner
     page matches the sandbox's visual rhythm. -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;600&display=swap" />

<!-- Absolute path: include.js resolves relative paths against location.href,
     which on the live SPA is "http://host/#/cleaner?file=…" — `./cleaner/`
     would point at /cleaner/ rather than /partials/cleaner/. The nested
     data-includes inside the loaded fragments resolve against THEIR own
     URL, so they correctly stay relative. -->
<div id="page-cleaner" data-include="/partials/cleaner/index.html"></div>
