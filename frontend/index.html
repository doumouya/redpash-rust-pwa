<!doctype html>
<html lang="en" data-theme="new-dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RedPash</title>
  <meta name="description" content="Upload a file you don't fully trust. Get it back clean." />
  <link rel="manifest" href="/manifest.json" />
  <!-- Bootstrap Icons — the icon set the rail + components use. Self-hosted
       (vendor/) so the UI never depends on a CDN. A plain <link>, not a
       main.css @import: its @font-face url()s resolve relative to the vendor
       dir (build-fe leaves vendor/ as-is; only .js + the css manifest hash). -->
  <link rel="stylesheet" href="/vendor/bootstrap-icons/bootstrap-icons.css" />
  <script>
    // FOUC pre-paint: apply theme/density/fontsize from the localStorage
    // mirror BEFORE any CSS evaluates. The pref-registry keeps the mirror in
    // sync; the server-resolved cascade corrects after boot if they differ.
    (function () {
      try {
        var read = function (k) {
          var v = localStorage.getItem("rp-pref-" + k);
          return v ? JSON.parse(v) : null;
        };
        var t = read("theme");
        if (t === "new-light" || t === "new-dark") document.documentElement.dataset.theme = t;
        var d = read("density");
        if (d === "compact" || d === "comfortable") document.documentElement.dataset.density = d;
        var f = read("fontsize");
        if (f === "sm" || f === "lg") document.documentElement.dataset.fontsize = f;
      } catch (e) { /* prefs are a nicety, never a boot blocker */ }
    })();
  </script>
  <link rel="stylesheet" href="/styles/main.css" />
</head>
<body>
  <main id="app" aria-busy="true"></main>
  <!-- ECharts — vendored/self-hosted (no CDN; works offline). Plain script so
       window.echarts is ready before the boot module mounts any chart. build-fe
       leaves vendor/ as-is (not hashed), like bootstrap-icons. -->
  <script src="/vendor/echarts/echarts.min.js"></script>
  <script type="module" src="/framework/boot/main.js"></script>
</body>
</html>
