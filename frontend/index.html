<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#11111b" />
  <title>RedPash</title>

  <!-- Apply the saved theme + visual prefs (density, font size) before
       first paint — no flash of the wrong theme / sizing. Inline
       rather than imported so it runs synchronously before the CSS
       evaluates. Reads both the new unified namespace (`rp-pref-*`,
       JSON-encoded — migration 023) and the legacy per-pref keys
       (raw strings) so this paint is correct across the transitional
       window. prefs.js's migration on module-load moves legacy keys
       into the new namespace and removes them. -->
  <script>
    try {
      var d = document.documentElement;
      function rp(name, legacy, ok) {
        var raw = localStorage.getItem("rp-pref-" + name);
        if (raw != null) { try { var v = JSON.parse(raw); if (ok(v)) return v; } catch (_) {} }
        if (legacy) { var lv = localStorage.getItem(legacy); if (ok(lv)) return lv; }
        return null;
      }
      var t  = rp("theme",    "rp-theme",     function (v) { return v === "light" || v === "dark"; });
      var dn = rp("density",  "rp-density",   function (v) { return v === "compact" || v === "cozy" || v === "comfortable"; });
      var fs = rp("fontSize", "rp-font-size", function (v) { return v === "sm" || v === "md" || v === "lg"; });
      if (t)  d.dataset.theme    = t;
      if (dn) d.dataset.density  = dn;
      if (fs) d.dataset.fontSize = fs;
    } catch (e) {}
  </script>

  <link rel="icon" href="/icons/favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/icons/icon-192.png" />
  <link rel="manifest" href="/manifest.json" />

  <!-- Savate — the RedPash brand wordmark face. -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Savate:wght@900&display=swap" />

  <!-- Bootstrap Icons — the icon set the redtable components use. -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" />

  <!-- ECharts — the 8th atom; the Workspace body renders chart-typed
       files through this. Loaded globally because chart files can
       appear behind any rail click. -->
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>

  <link rel="stylesheet" href="/styles/main.css" />
</head>
<body>
  <!-- App shell. The router (scripts/main.js) renders the active page
       partial into #app. Kept intentionally bare — the frontend reset
       rebuilds every page from here. -->
  <main id="app"></main>

  <script type="module" src="/scripts/main.js"></script>
</body>
</html>
