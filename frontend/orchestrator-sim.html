<!doctype html>
<html lang="en">
<!-- Purpose: self-contained visual simulation of the /feature role-chain orchestrator
     (architect → CP1 → tester → coder → reviewer → CP2 → ops) — drives the state
     machine, the circuit breaker, and the TEST-DRIFT escape valve so the design can be
     SEEN and stress-tested without running real agents. Mirrors the docs/internal/state/
     current_feature.md ledger shape, so it can later be fed a live run. Vanilla JS, no deps.
     Doc: docs/internal/processes/agent-roles.md -->
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RedPash Orchestrator Simulation</title>
<style>
  /* new-dark palette (mirrors styles/tokens.css var names; inlined so the sandbox is
     render-proof on its own). Swap to <link rel="stylesheet" href="styles/tokens.css">
     to track the live theme. */
  :root{
    --rp-bg:#0b0d10; --rp-surface:#15181d; --rp-surface-2:#1b1f26; --rp-border:#272c34;
    --rp-text:#eef1f5; --rp-text-dim:#aeb6c2; --rp-text-mute:#6b7480;
    --rp-accent:#2f6bff; --rp-on-accent:#ffffff; --rp-hover:#222730;
    --rp-ok:#3fb950; --rp-warn:#d6a13a; --rp-err:#e5534b; --rp-info:#4493f8;
    --rp-radius:.6rem; --rp-radius-lg:.9rem; --rp-glass:rgba(255,255,255,.04);
    --rp-blur:10px; --rp-ease:cubic-bezier(.4,0,.2,1);
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--rp-bg);color:var(--rp-text);
    font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
  .wrap{max-width:62rem;margin:0 auto;padding:1.75rem 1.5rem 3rem}

  /* header */
  .head{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.5rem}
  .head h1{font-size:1.6rem;font-weight:600;letter-spacing:-.01em;margin:0}
  .head-ctl{display:flex;gap:.5rem}
  .iconbtn{width:3.25rem;height:2.5rem;border:1px solid var(--rp-border);border-radius:99rem;
    background:var(--rp-surface-2);color:var(--rp-text);cursor:pointer;font-size:1rem;
    display:flex;align-items:center;justify-content:center;
    transition:background .15s var(--rp-ease),transform .1s var(--rp-ease)}
  .iconbtn:hover{background:var(--rp-hover)} .iconbtn:active{transform:scale(.95)}
  .iconbtn.primary{background:var(--rp-accent);border-color:transparent;color:var(--rp-on-accent)}

  /* DAG */
  .dag{position:relative;margin:0 auto;width:100%;max-width:34rem}
  .dag svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
  .nodes{position:relative;display:flex;flex-direction:column;align-items:center;gap:2.1rem;
    padding:.5rem 0;z-index:1}
  .node{min-width:17rem;padding:.85rem 1.1rem;text-align:center;border-radius:var(--rp-radius);
    border:1px solid var(--rp-border);background:var(--rp-surface);color:var(--rp-text-dim);
    font-size:1.02rem;transition:all .25s var(--rp-ease);position:relative}
  .node.checkpoint{border-style:dashed}
  .node.done{color:var(--rp-text);border-color:color-mix(in srgb,var(--rp-ok) 45%,var(--rp-border))}
  .node.done::after{content:"✓";position:absolute;right:.7rem;top:50%;transform:translateY(-50%);
    color:var(--rp-ok);font-size:.85rem}
  .node.active{background:var(--rp-accent);border-color:transparent;color:var(--rp-on-accent);
    box-shadow:0 0 0 4px color-mix(in srgb,var(--rp-accent) 22%,transparent),
    0 8px 24px color-mix(in srgb,var(--rp-accent) 30%,transparent)}
  .node.await{border-color:var(--rp-warn);color:var(--rp-text);
    box-shadow:0 0 0 4px color-mix(in srgb,var(--rp-warn) 18%,transparent)}
  .node.failed{border-color:var(--rp-err);color:var(--rp-text);
    box-shadow:0 0 0 4px color-mix(in srgb,var(--rp-err) 20%,transparent)}
  .node.escalated{border-color:var(--rp-err);background:color-mix(in srgb,var(--rp-err) 14%,var(--rp-surface));color:var(--rp-text)}
  /* edges */
  .edge{fill:none;stroke:var(--rp-border);stroke-width:1.6}
  .edge.flow{stroke:var(--rp-accent);stroke-width:2.4;filter:drop-shadow(0 0 4px color-mix(in srgb,var(--rp-accent) 60%,transparent))}
  .edge.drift{stroke:var(--rp-warn);stroke-dasharray:2 0}
  .edge.fail{stroke:var(--rp-err);stroke-dasharray:5 4}
  .edge.dim{opacity:.5}
  .elabel{fill:var(--rp-text-dim);font-size:.72rem;font-weight:600}
  .elabel.drift{fill:var(--rp-warn)} .elabel.fail{fill:var(--rp-err)}
  .arrow{fill:var(--rp-border)} .arrow.flow{fill:var(--rp-accent)}

  /* counters */
  .rule{height:1px;background:var(--rp-border);margin:2rem 0 1.25rem}
  .counters{display:grid;grid-template-columns:repeat(3,1fr);text-align:center;gap:1rem}
  .counters .lab{color:var(--rp-text-mute);font-size:.86rem}
  .counters .val{font-size:1.5rem;font-weight:600;margin-top:.25rem;font-variant-numeric:tabular-nums}
  .counters .val.warn{color:var(--rp-warn)} .counters .val.bad{color:var(--rp-err)}

  /* toggles */
  .toggles{display:flex;justify-content:space-between;gap:1rem;margin:1.5rem 0 .25rem;flex-wrap:wrap}
  .toggle{display:flex;align-items:center;gap:.75rem}
  .toggle label{color:var(--rp-text-dim);user-select:none}
  .sw{--w:3.1rem;--h:1.6rem;position:relative;width:var(--w);height:var(--h);flex:0 0 auto;
    border-radius:99rem;background:var(--rp-surface-2);border:1px solid var(--rp-border);
    cursor:pointer;transition:background .2s var(--rp-ease)}
  .sw::after{content:"";position:absolute;top:50%;left:.18rem;transform:translateY(-50%);
    width:1.15rem;height:1.15rem;border-radius:50%;background:var(--rp-text-mute);
    transition:left .2s var(--rp-ease),background .2s var(--rp-ease)}
  .sw[aria-checked="true"]{background:color-mix(in srgb,var(--rp-accent) 75%,transparent);border-color:transparent}
  .sw[aria-checked="true"]::after{left:calc(var(--w) - 1.33rem);background:#fff}

  /* approve */
  .approve{width:100%;margin-top:1.5rem;padding:1.05rem;border-radius:var(--rp-radius-lg);
    border:1px solid var(--rp-border);background:var(--rp-glass);
    -webkit-backdrop-filter:blur(var(--rp-blur));backdrop-filter:blur(var(--rp-blur));
    color:var(--rp-text);font-size:1.05rem;cursor:pointer;transition:all .15s var(--rp-ease)}
  .approve:not(:disabled):hover{background:var(--rp-hover)}
  .approve.armed{background:var(--rp-accent);border-color:transparent;color:var(--rp-on-accent);
    box-shadow:0 6px 20px color-mix(in srgb,var(--rp-accent) 35%,transparent)}
  .approve:disabled{opacity:.45;cursor:not-allowed}

  /* gate table + log */
  .panels{display:grid;grid-template-columns:1fr 1fr;gap:1.25rem;margin-top:2rem}
  @media(max-width:48rem){.panels{grid-template-columns:1fr}}
  .panel{border:1px solid var(--rp-border);border-radius:var(--rp-radius-lg);
    background:var(--rp-surface);overflow:hidden}
  .panel h2{font-size:.82rem;letter-spacing:.04em;text-transform:uppercase;color:var(--rp-text-mute);
    margin:0;padding:.75rem 1rem;border-bottom:1px solid var(--rp-border)}
  table{width:100%;border-collapse:collapse;font-size:.86rem}
  td{padding:.5rem 1rem;border-bottom:1px solid var(--rp-border)}
  tr:last-child td{border-bottom:0}
  td.cmd{color:var(--rp-text-mute);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.78rem}
  .res{font-weight:600;font-size:.78rem}
  .res.pass{color:var(--rp-ok)} .res.fail{color:var(--rp-err)} .res.none{color:var(--rp-text-mute)}
  .log{height:14rem;overflow-y:auto;padding:.6rem 1rem;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
    font-size:.78rem;line-height:1.7;display:flex;flex-direction:column;gap:.1rem}
  .log .ln{color:var(--rp-text-dim)} .log .ln .who{color:var(--rp-info);font-weight:600}
  .log .ln.drift .who{color:var(--rp-warn)} .log .ln.fail .who{color:var(--rp-err)}
  .log .ln.ok .who{color:var(--rp-ok)} .log .ln.em .who{color:var(--rp-accent)}
  .status{margin-top:1rem;text-align:center;color:var(--rp-text-mute);font-size:.9rem;min-height:1.2rem}
  .status b{color:var(--rp-text)}
  .status.escalated b{color:var(--rp-err)} .status.landed b{color:var(--rp-ok)}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <h1>RedPash Orchestrator Simulation</h1>
    <div class="head-ctl">
      <button class="iconbtn primary" id="playBtn" title="Play / pause">⏸</button>
      <button class="iconbtn" id="resetBtn" title="Reset">↺</button>
    </div>
  </div>

  <div class="dag">
    <svg id="edges" aria-hidden="true"></svg>
    <div class="nodes" id="nodes"></div>
  </div>

  <div class="status" id="status"></div>

  <div class="rule"></div>
  <div class="counters">
    <div><div class="lab">Gate Retries</div><div class="val" id="cRetry">0/3</div></div>
    <div><div class="lab">Role-Hops</div><div class="val" id="cHops">0/8</div></div>
    <div><div class="lab">Drift Rounds</div><div class="val" id="cDrift">0/2</div></div>
  </div>

  <div class="toggles">
    <div class="toggle"><label for="swFail">Force Gate Failure</label>
      <div class="sw" id="swFail" role="switch" aria-checked="false" tabindex="0"></div></div>
    <div class="toggle"><label for="swDrift">Inject TEST-DRIFT Dispute</label>
      <div class="sw" id="swDrift" role="switch" aria-checked="false" tabindex="0"></div></div>
  </div>

  <button class="approve" id="approve" disabled>Approve Checkpoint</button>

  <div class="panels">
    <div class="panel">
      <h2>Gate results — latest attempt</h2>
      <table id="gates"></table>
    </div>
    <div class="panel">
      <h2>Case comment stream</h2>
      <div class="log" id="log"></div>
    </div>
  </div>
</div>

<script>
"use strict";
// ── the ledger-shaped reactive state (mirrors docs/internal/state/current_feature.md) ──
const PHASES = [
  { key:"architect", label:"1. Architect (Spec)",      kind:"role" },
  { key:"cp1",       label:"2. Checkpoint 1 (Em)",      kind:"checkpoint" },
  { key:"tester",    label:"3. Tester (Red Tests)",     kind:"role" },
  { key:"coder",     label:"4. Coder (Green Impl)",     kind:"role" },
  { key:"reviewer",  label:"5. Reviewer (Static Gates)",kind:"role" },
  { key:"cp2",       label:"6. Checkpoint 2 (Push)",    kind:"checkpoint" },
  { key:"ops",       label:"7. Ops (Build & Push)",     kind:"role" },
];
const GATES = [
  { key:"tests",   cmd:"cargo test --jobs 4" },
  { key:"feTests", cmd:"sh tools/test-fe.sh" },
  { key:"audit",   cmd:"sh tools/audit.sh" },
  { key:"ciAudit", cmd:"sh tools/ci-audit/check.sh" },
  { key:"build",   cmd:"sh tools/build-wasm.sh / health-check" },
];
const CAPS = { retries:3, hops:8, drift:2 };

let S;
function fresh(){ return {
  activeFeature:"implement export schema", caseId:"CAS_402",
  idx:0,                          // active phase index
  status:"in_progress",          // in_progress | awaiting-checkpoint-N | escalated | landed
  state:"running",               // running | paused | awaiting | escalated | landed
  counters:{ retries:0, hops:0, drift:0 },
  gates:{ tests:null, feTests:null, audit:null, ciAudit:null, build:null },
  driftDone:false,               // drift resolved for this coder pass
  log:[],
  nodeState:{},                  // key -> done|active|await|failed|escalated
};}

// ── DOM refs ──
const $ = id => document.getElementById(id);
const elNodes=$("nodes"), elEdges=$("edges"), elStatus=$("status"),
      elApprove=$("approve"), elPlay=$("playBtn");

// ── render ──
function render(){
  // nodes
  elNodes.innerHTML = "";
  PHASES.forEach((p,i)=>{
    const d=document.createElement("div");
    d.className="node "+(p.kind==="checkpoint"?"checkpoint ":"")+(S.nodeState[p.key]||"");
    d.id="n-"+p.key; d.textContent=p.label;
    elNodes.appendChild(d);
  });
  drawEdges();
  // counters
  setCounter("cRetry",S.counters.retries,CAPS.retries);
  setCounter("cHops", S.counters.hops,  CAPS.hops);
  setCounter("cDrift",S.counters.drift, CAPS.drift);
  // gate table
  $("gates").innerHTML = GATES.map(g=>{
    const v=S.gates[g.key], cls=v===true?"pass":v===false?"fail":"none",
          txt=v===true?"pass":v===false?"fail":"–";
    return `<tr><td>${g.key}</td><td class="cmd">${g.cmd}</td>`+
           `<td class="res ${cls}">${txt}</td></tr>`;
  }).join("");
  // log
  $("log").innerHTML = S.log.map(l=>`<div class="ln ${l.t||""}"><span class="who">${l.who}</span> ${l.msg}</div>`).join("");
  $("log").scrollTop = 1e9;
  // approve button
  const armed = S.status.startsWith("awaiting");
  elApprove.disabled = !armed;
  elApprove.classList.toggle("armed", armed);
  elApprove.textContent = S.status==="awaiting-checkpoint-1" ? "Approve Spec (Checkpoint 1)"
    : S.status==="awaiting-checkpoint-2" ? "Approve Push (Checkpoint 2)" : "Approve Checkpoint";
  // play btn
  elPlay.textContent = S.state==="running" ? "⏸" : "▶";
  // status line
  elStatus.className = "status "+(S.state==="escalated"?"escalated":S.state==="landed"?"landed":"");
  elStatus.innerHTML = statusText();
}
function setCounter(id,v,cap){
  const el=$(id); el.textContent=`${v}/${cap}`;
  el.className="val"+(v>=cap?" bad":v>0?" warn":"");
}
function statusText(){
  if(S.state==="escalated") return `<b>Escalated to Em</b> — circuit breaker tripped. ${S.escalReason||""}`;
  if(S.state==="landed")    return `<b>Landed</b> — ${S.caseId} pushed &amp; closed.`;
  if(S.status.startsWith("awaiting")) return `Paused at <b>${cur().label}</b> — awaiting your approval.`;
  if(S.state==="paused")    return `Paused at <b>${cur().label}</b>.`;
  return `Running <b>${S.activeFeature}</b> (${S.caseId}) — phase <b>${cur().label}</b>.`;
}
const cur = ()=>PHASES[S.idx];

// ── SVG edges (computed from node rects so the curved Drift + dashed Failure paths track layout) ──
function centerOf(key){
  const n=$("n-"+key), box=elEdges.getBoundingClientRect(), r=n.getBoundingClientRect();
  return { x:r.left-box.left+r.width/2, top:r.top-box.top, bot:r.bottom-box.top,
           left:r.left-box.left, right:r.right-box.left, midY:r.top-box.top+r.height/2 };
}
function drawEdges(){
  const W=elEdges.clientWidth||1, H=elNodes.scrollHeight;
  elEdges.setAttribute("viewBox",`0 0 ${W} ${H}`); elEdges.style.height=H+"px";
  const flowKey = S.nodeState; // to light the current segment
  let svg = `<defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path class="arrow" d="M0,0 L7,3 L0,6 Z"/></marker>
    <marker id="ahf" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path class="arrow flow" d="M0,0 L7,3 L0,6 Z"/></marker></defs>`;
  // straight down-arrows between consecutive nodes
  for(let i=0;i<PHASES.length-1;i++){
    const a=centerOf(PHASES[i].key), b=centerOf(PHASES[i+1].key);
    const lit = (S.idx===i+1 && S.state!=="escalated");
    svg += `<path class="edge ${lit?"flow":""}" marker-end="url(#${lit?"ahf":"ah"})"
              d="M${a.x},${a.bot+1} L${b.x},${b.top-9}"/>`;
  }
  // Drift loop: coder(4) -> tester(3) on the LEFT
  const t=centerOf("tester"), c=centerOf("coder"), r=centerOf("reviewer");
  const lx = Math.min(t.left,c.left)-26;
  const driftLit = S.lastEdge==="drift";
  svg += `<path class="edge drift ${driftLit?"":"dim"}" marker-end="url(#ah)"
            d="M${c.left},${c.midY} C${lx},${c.midY} ${lx},${t.midY} ${t.left-2},${t.midY+6}"/>`;
  svg += `<text class="elabel drift" x="${lx+4}" y="${(t.midY+c.midY)/2}">Drift</text>`;
  // Failure return: reviewer(5) -> tester(3) on the RIGHT (dashed)
  const rx = Math.max(t.right,r.right)+26;
  const failLit = S.lastEdge==="fail";
  svg += `<path class="edge fail ${failLit?"":"dim"}" marker-end="url(#ah)"
            d="M${r.right},${r.midY} C${rx},${r.midY} ${rx},${t.midY} ${t.right+2},${t.midY+6}"/>`;
  svg += `<text class="elabel fail" x="${rx-30}" y="${(t.midY+r.midY)/2}">Failure</text>`;
  elEdges.innerHTML = svg;
}

// ── log helper ──
function note(who,msg,t){ S.log.push({who,msg,t}); }

// ── the state machine — one tick advances the active role phase ──
function enter(i){
  S.idx=i; const p=PHASES[i];
  PHASES.forEach((q,j)=>{ if(j<i) S.nodeState[q.key]="done"; });
  if(p.kind==="checkpoint"){
    S.nodeState[p.key]="await";
    S.status = p.key==="cp1" ? "awaiting-checkpoint-1" : "awaiting-checkpoint-2";
    S.state="awaiting";
    note("orchestrator", p.key==="cp1"
      ? "spec ready — ⛔ awaiting Em's approval (Checkpoint 1)"
      : "reviewer green — ⛔ awaiting Em's push approval (Checkpoint 2)","em");
  } else {
    S.nodeState[p.key]="active"; S.status="in_progress";
  }
  render();
}

function roleWork(){
  const p=cur(); S.lastEdge=null;
  if(p.kind==="checkpoint") return;            // handled by Approve
  S.counters.hops++;
  if(S.counters.hops>CAPS.hops) return escalate("global role-hop ceiling (8) exceeded");

  if(p.key==="architect"){ note("architect",`${S.caseId} created — spec + acceptance criteria written`); return advance(); }

  if(p.key==="tester"){
    note("tester","wrote 3 red tests, 1:1 with the acceptance criteria (failing)");
    S.gates.tests=false; return advance();
  }

  if(p.key==="coder"){
    // TEST-DRIFT escape valve (left "Drift" path) — coder vs a flawed test, resolved vs the Case
    if(S.injectDrift && !S.driftDone){
      S.counters.drift++; S.lastEdge="drift"; S.nodeState.coder="failed";
      note("coder","TEST-DRIFT: AC-3 says 200 OK; test asserts 201 — impl matches the Case","drift");
      render();
      if(S.counters.drift>CAPS.drift) return escalate("TEST-DRIFT unresolved after 2 round-trips — Case is ambiguous");
      return after(900,()=>{                    // yield back to tester
        note("tester","re-read AC-3 → coder is right; corrected the test","drift");
        S.driftDone=true; S.nodeState.coder=""; enter(idxOf("tester"));
        return after(700, roleWork);
      });
    }
    note("coder","implemented every AC — cargo test --jobs 4 → green","ok");
    S.gates.tests=true; return advance();
  }

  if(p.key==="reviewer"){
    if(S.forceFail){                            // right dashed "Failure" path → back to coder
      S.counters.retries++; S.lastEdge="fail"; S.nodeState.reviewer="failed";
      S.gates.audit=false; S.gates.ciAudit=false;
      note("reviewer","ci-audit: NEW regression — blocked. looping back to coder","fail");
      render();
      if(S.counters.retries>CAPS.retries) return escalate("retry budget (3/3) exhausted — escalating to Em");
      return after(1000,()=>{
        S.nodeState.reviewer=""; note("orchestrator","retry "+S.counters.retries+"/3 → coder","fail");
        enter(idxOf("coder")); return after(700, roleWork);
      });
    }
    S.gates.audit=true; S.gates.ciAudit=true; S.gates.feTests=true;
    note("reviewer","audit.sh + ci-audit clean · coverage ok → in_review","ok");
    return advance();
  }

  if(p.key==="ops"){
    S.gates.build=true; S.gates.ciAudit=true;
    note("ops","build-wasm + health-check + ci-audit green · pushed prerelease · Case → done","ok");
    S.nodeState.ops="done"; S.state="landed"; S.status="landed"; render(); stop();
    return;
  }
}
const idxOf = k => PHASES.findIndex(p=>p.key===k);
function advance(){ if(S.idx<PHASES.length-1){ enter(S.idx+1); scheduleTick(); } }
function escalate(reason){
  S.state="escalated"; S.status="escalated"; S.escalReason=reason;
  S.nodeState[cur().key]="escalated";
  note("orchestrator","CIRCUIT BREAKER — "+reason+" — paused for Em","fail");
  render(); stop();
}

// ── ticking (play/pause) ──
let timer=null;
function scheduleTick(){
  if(S.state!=="running") return;
  const p=cur();
  if(p.kind==="checkpoint") return;             // wait for Approve
  timer=setTimeout(roleWork, 1100);
}
function after(ms,fn){ timer=setTimeout(fn,ms); }
function stop(){ clearTimeout(timer); timer=null; }

// ── controls ──
elApprove.onclick = ()=>{
  if(!S.status.startsWith("awaiting")) return;
  S.nodeState[cur().key]="done";
  note("Em","approved "+(cur().key==="cp1"?"the spec":"the push"),"em");
  S.state="running";
  advance();
  scheduleTick();
};
elPlay.onclick = ()=>{
  if(S.state==="landed"||S.state==="escalated") return;
  if(S.state==="running"){ S.state="paused"; stop(); }
  else if(S.state==="paused"){ S.state="running"; scheduleTick(); }
  render();
};
$("resetBtn").onclick = ()=>{ stop(); boot(); };

function bindSwitch(id,prop){
  const sw=$(id);
  const flip=()=>{ const v=sw.getAttribute("aria-checked")!=="true";
    sw.setAttribute("aria-checked",v); S[prop]=v; };
  sw.onclick=flip;
  sw.onkeydown=e=>{ if(e.key===" "||e.key==="Enter"){ e.preventDefault(); flip(); } };
}

// ── boot ──
function boot(){
  S = fresh();
  S.forceFail = $("swFail").getAttribute("aria-checked")==="true";
  S.injectDrift = $("swDrift").getAttribute("aria-checked")==="true";
  note("orchestrator",`/feature "${S.activeFeature}" — ledger opened`,"em");
  enter(0); scheduleTick();
}
bindSwitch("swFail","forceFail");
bindSwitch("swDrift","injectDrift");
window.addEventListener("resize", ()=>drawEdges());
boot();
</script>
</body>
</html>
