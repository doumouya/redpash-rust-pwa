# csv-to-xlsx — faithful CSV → xlsx fixture generator (Rust).
#
# Standalone — deliberately NOT a member of the backend workspace, so it
# lives self-contained under tools/ next to csv-to-xlsx.py. Versions
# mirror the backend workspace pins.

[package]
name    = "csv-to-xlsx"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "csv-to-xlsx"
path = "src/main.rs"

[dependencies]
rust_xlsxwriter = "0.95"
csv             = "1.3"
chardetng       = "0.1"
encoding_rs     = "0.8"
